    TopUpCreate:
      type: object
      required:
      - amount
      additionalProperties: false
      properties:
        amount:
          type: string
          description: USD from $1.00 to $150.00 in whole cents. Extra trailing zeroes identify the same
            amount on replay.
          pattern: ^(?:(?:[1-9][0-9]?|1[0-4][0-9])\.[0-9]{2}0{0,4}|150\.0{2,6})$
          example: '25.00'
    EventType:
      type: string
      description: |
        The message.sent, message.delivered, message.failed and message.received types
        describe those transitions. message.read is emitted once when the sending
        device first reports that the recipient read a message sent from an
        iMessage line. Its data is the Message with read_at, and its status is
        still delivered. read_at is the time Omni received that report, because
        the device does not report when the message was read. Other emitted
        message lifecycle changes use message.updated. A completed call emits call.completed. Other emitted
        call transitions use call.updated. Number acquisition, routing, campaign
        assignment, activation and release emit number.updated. Registration
        changes emit brand.updated and campaign.updated with their public resource.
        A top-up request, hosted link, payment, failure or recorded expiry emits
        top_up.updated. A clock-only expiry is visible on GET.
      enum:
      - message.sent
      - message.delivered
      - message.read
      - message.failed
      - message.received
      - message.updated
      - call.updated
      - call.completed
      - brand.updated
      - campaign.updated
      - number.updated
      - top_up.updated
    Event:
      type: object
      description: The body of a webhook delivery.
      required:
      - id
      - type
      - created_at
      - data
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^EV[0-9a-f]{32}$
          description: Event ID shared by all deliveries of this event.
        type:
          $ref: '#/components/schemas/EventType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          description: The event-specific snapshot captured at the transition.
      oneOf:
      - properties:
          type:
            enum:
            - message.sent
            - message.delivered
            - message.read
            - message.failed
            - message.received
            - message.updated
          data:
            $ref: '#/components/schemas/Message'
      - properties:
          type:
            enum:
            - call.completed
            - call.updated
          data:
            $ref: '#/components/schemas/Call'
      - properties:
          type:
            enum:
            - brand.updated
          data:
            $ref: '#/components/schemas/Brand'
      - properties:
          type:
            enum:
            - campaign.updated
          data:
            $ref: '#/components/schemas/Campaign'
      - properties:
          type:
            enum:
            - number.updated
          data:
            $ref: '#/components/schemas/NumberConfigurationSnapshot'
      - properties:
          type:
            enum:
            - top_up.updated
          data:
            $ref: '#/components/schemas/TopUp'
      example:
        id: EV0123456789abcdef0123456789abcdef
        type: message.delivered
        created_at: '2026-11-23T18:04:07Z'
        data:
          id: SM0123456789abcdef0123456789abcdef
          direction: outbound_api
          status: delivered
          to: '+14155550101'
          from: '+14155550100'
          campaign_id: null
          body: Your code is 482913
          media_urls: []
          segments: 1
          price:
            amount_micro_usd: 7900
            currency: USD
          error_code: null
          status_callback: null
          created_at: '2026-11-23T18:04:05Z'
          updated_at: '2026-11-23T18:04:07Z'
          sent_at: '2026-11-23T18:04:06Z'
