        **Price.** `brand.registration` in `GET /prices`. It is held from the
        balance when this request is accepted, charged when the carrier
        accepts the submission, and released if the carrier refuses the
        submission outright. A brand the registry later fails or cannot
        verify is not refunded. `price` in the answer is the amount held.

        **Asynchronous.** The answer is the brand in `pending`. The
        submission is the operation `operation_id` (`GET /operations/{id}`);
        the registry's verdict then arrives in `status`, usually within
        minutes and at most a few business days. Poll `GET /brands/{id}`.

        **Refusals.** `402 insufficient_funds` before anything is stored or
        sent. `422 unprocessable` with `details.reason`:
        `registration_not_enabled` (the account has no carrier profile yet)
        or `not_offered` (the account has no price for a brand).
        `409 idempotency_conflict` when the key was used for other details.

        After verification, use PATCH /brands/{brand_id} to update the display
        name or website. The original registration and paid receipt are retained.

        Required permission: `brands:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreate'
            example:
              legal_name: Synthetic Works LLC
              display_name: Synthetic Works
              entity_type: PRIVATE_PROFIT
              tax_id: 12-3456789
              tax_id_country: US
              vertical: TECHNOLOGY
              website: https://example.com
              address:
                street: 1 Example Street
                city: San Francisco
                region: CA
                postal_code: '94105'
                country: US
              contact:
                first_name: Ada
                last_name: Example
                email: ada@example.com
                phone_number: '+14155550100'
      responses:
        '201':
          description: The brand was recorded, its fee held, and its submission queued.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listBrands
      tags:
      - brands
      summary: List brands.
      description: |
        Every brand of the account, whichever API registered it.

        Required permission: `brands:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of brands.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandList'
        default:
          $ref: '#/components/responses/Error'
  /brands/{brand_id}:
    parameters:
    - name: brand_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getBrand
      tags:
      - brands
      summary: Read one brand.
      responses:
        '200':
          description: The brand.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `brands:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateBrand
      tags:
      - brands
      summary: Change the display name or website of a verified brand.
      description: |
        Supply one or both fields and a fresh Idempotency-Key. Omni queues a
        metadata amendment and publishes the values after a separate carrier
        read confirms them. Until then GET returns the last confirmed values.
        Repeat the same request and key to check the outcome. The original
        registration and paid receipt are retained. This operation has no
        customer fee and does not order re-vetting.
        Unregistered or unverified brands and concurrent or unresolved edits
        return 409. Changes to identity, tax, contact or vetting fields and
        a definitive carrier refusal return 422.

        Required permission: `brands:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdate'
            example:
              display_name: Example Market
              website: https://example.com
      responses:
        '200':
          description: The brand after independent confirmation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '202':
          description: The brand with a pending metadata change.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Error'
  /campaigns:
    post:
      operationId: createCampaign
      tags:
      - campaigns
      summary: Register a US 10DLC campaign for a verified brand.
      description: |
        A campaign is also a pool of senders: numbers join it with
        `PUT /numbers/{phone_number}/campaign`, and a message sent with
        `campaign_id` uses one of them. No number is needed to register one.

        **Price.** `campaign.registration` for the `use_case` in
        `GET /prices`. It is held when this request is accepted, charged when
        the carrier accepts the submission, and released if the carrier
        refuses the submission outright (for example because the brand does
        not qualify for the use case). A campaign rejected in review is not
        refunded. Before registering, read `campaign.monthly` for the same
        use case. When offered, this request pins the monthly price for
        subsequent terms and requests automatic renewal by default.
        Pass `auto_renewal: false` to register for the initial term only.
        A zero monthly price means Sendblue covers the recurring fee.
        With no monthly offer, omitting the preference registers a one-time
        campaign with `renewal_status: unavailable`. Explicit opt-in then
        returns 422 with reason `renewal_not_offered`.

        **Asynchronous.** The answer is the campaign in `pending`. The
        submission is the operation `operation_id`; review by the registry
        and the mobile networks then moves `status` to `approved` or
        `rejected`, typically in three to seven business days. Poll
        `GET /campaigns/{id}`.

        **Refusals.** `402 insufficient_funds` before anything is stored or
        sent. `422 unprocessable` with `details.reason`: `brand_not_found`,
        `brand_not_verified`, `campaign_limit` (a brand holds at most five
        campaigns that were not rejected), `registration_not_enabled`, or
        `not_offered` (the account has no price for this use case).
        `409 idempotency_conflict` when the key was used for another
        campaign.

        Change the renewal preference with `PATCH /campaigns/{campaign_id}`.
        After a rejection, register a
        corrected campaign with a new `Idempotency-Key`: it is a new
        submission and a new fee.

        Required permission: `campaigns:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
            example:
              brand_id: BN0123456789abcdef0123456789abcdef
              name: Order updates
              use_case: CUSTOMER_CARE
              description: Order confirmations and support replies for customers of the shop.
              message_flow: Customers tick an unchecked box at checkout to receive order updates by text.
              sample_messages:
              - Your order 1042 has shipped and arrives on Friday.
              - Thanks for writing in. An agent will reply within one hour.
              privacy_policy_url: https://example.com/privacy
              terms_url: https://example.com/terms
              opt_out_message: You are unsubscribed and will receive no more messages.
              help_message: 'Synthetic Works support: write to help@example.com.'
              has_embedded_links: false
              has_embedded_phone: false
              subscriber_opt_in: true
              terms_accepted: true
      responses:
        '201':
          description: The campaign was recorded, its fee held, and its submission queued.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listCampaigns
      tags:
      - campaigns
      summary: List campaigns.
      description: |
        Every campaign of the account, whichever API registered it.

        Required permission: `campaigns:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: brand_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: One page of campaigns.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignList'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}:
    parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCampaign
      tags:
      - campaigns
      summary: Read one campaign.
      responses:
        '200':
          description: The campaign.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `campaigns:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateCampaign
      tags:
      - campaigns
      summary: Turn automatic campaign renewal on or off.
      description: |
        Records the preference for this account's campaign. Read
        `auto_renewal_requested` for the requested setting, `auto_renewal`
        for carrier confirmation, and `renewal_status` for progress. Repeat
        the same preference safely. The existing paid term remains usable
        after opt-out. Opt-in requires the monthly offer listed by `GET /prices`.
        A malformed preference returns 400, an invalid credential returns 401,
        an unauthorized acting account returns 403, an absent or foreign
        campaign returns 404, and an ineligible campaign returns 409.
        A missing monthly offer returns 422 with reason
        `renewal_not_offered`. Unsupported fields return 400.

        Example 422 response:

        ```json
        {"error":{"code":"unprocessable","message":"This account has no monthly price for this campaign use case","details":{"field":"auto_renewal","reason":"renewal_not_offered"}}}
        ```

        Required permission: `campaigns:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdate'
            example:
              auto_renewal: false
      responses:
        '200':
          description: The campaign with the persisted renewal request and latest carrier observation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCampaign
      tags:
      - campaigns
      summary: Permanently deactivate an empty campaign at the registry.
      description: |
        Registry deletion cannot be undone. No registration or monthly fee is refunded.
        Remove assigned and pending numbers first. Turn off auto-renewal and allow any
        committed charges to settle. The account retains its numbers and billing history.
        The worker verifies carrier identity and sends at most one deletion. Repeat this
        request safely or read the campaign to see the result. The response and each
        campaign.updated event include the deactivation status, irreversibility and refund policy.

        Example deactivation after acceptance: `{"status":"pending","irreversible":true,"fees_refundable":false}`.
        A request body or query parameters return 400. Returns 401 for invalid credentials, 403 for insufficient permission, and 404 for
        an absent or foreign campaign. A 422 gives one of the reasons `numbers_attached`,
        `renewal_unsettled`, or `campaign_not_submitted`.

        Required permission: `campaigns:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '202':
          description: The request is queued or awaiting carrier confirmation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '200':
          description: The campaign with its confirmed, refused or review outcome.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
  /calls:
    post:
      operationId: createCall
      tags:
      - calls
      summary: Place an outbound call.
      description: |
        Give the call its instructions as a TwiML document: inline in `twiml`,
        or fetched from `url` when the call is answered. Exactly one of the two
        is required. TwiML documents and every request Omni makes to your URLs
        keep Twilio's parameter names and `X-Twilio-Signature`. The price of
        the longest possible call is held from the balance at acceptance.

        Required permission: `calls:create`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallCreate'
            example:
              to: '+14155550101'
              from: '+14155550100'
              twiml: <Response><Say>Hello from Sendblue.</Say></Response>
      responses:
        '201':
          description: The call was accepted and queued for dialing.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listCalls
      tags:
      - calls
      summary: List calls, newest first.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: to
        in: query
        schema:
          $ref: '#/components/schemas/PhoneNumber'
      - name: from
        in: query
        schema:
          $ref: '#/components/schemas/PhoneNumber'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CallStatus'
      - name: parent_call_id
        in: query
        schema:
          type: string
      - name: started_after
        in: query
        schema:
          type: string
          format: date-time
      - name: started_before
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: One page of calls.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `calls:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /calls/{call_id}:
    parameters:
    - $ref: '#/components/parameters/CallId'
    get:
      operationId: getCall
      tags:
      - calls
      summary: Read one call.
      responses:
        '200':
          description: The call.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `calls:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateCall
      tags:
      - calls
      summary: Redirect a call in progress, or end it.
      description: |
        Exactly one change per request. `{"status": "canceled"}` ends a call
        that has not been answered; `{"status": "completed"}` ends it in any
        state; `twiml`, or `url` with an optional `method`, replaces the
        instructions of a call in progress.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallUpdate'
            examples:
              complete:
                value:
                  status: completed
              redirect:
                value:
                  url: https://example.com/next
                  method: POST
      responses:
        '200':
          description: The call after the change was recorded.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        default:
          $ref: '#/components/responses/Error'
  /calls/{call_id}/recordings:
    parameters:
    - $ref: '#/components/parameters/CallId'
    get:
      operationId: listCallRecordings
      tags:
