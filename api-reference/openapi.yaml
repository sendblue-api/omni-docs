            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappConnectionList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /whatsapp/connections/{connection_id}:
    parameters:
    - name: connection_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getWhatsappConnection
      tags:
      - whatsapp
      summary: Read one connection, with the IDs of its numbers.
      responses:
        '200':
          description: The connection.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappConnection'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
    delete:
      operationId: disconnectWhatsappConnection
      tags:
      - whatsapp
      summary: Disconnect a Messaging account from this account.
      description: |
        Omni stops its webhook subscription to the Messaging account, destroys
        its business token, and marks the connection and its numbers
        `disconnected`. Queued messages fail with `connection_disconnected`
        and their holds are released. The numbers stay registered on
        WhatsApp. A repeat answers the connection as it is now. When Meta
        or Omni's key service does not answer, nothing changes and the
        answer is `503 unavailable`; repeat the request.

        Required permission: `whatsapp:connect`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: The disconnected connection.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappConnection'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/numbers:
    get:
      operationId: listWhatsappNumbers
      tags:
      - whatsapp
      summary: List the account's WhatsApp numbers.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: connection_id
        in: query
