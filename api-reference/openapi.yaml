      description: |
        Delivery metadata is retained for 30 days and scoped to this endpoint and account. An absent or foreign endpoint returns 404 not_found. A cursor from another endpoint returns 400 invalid_request.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
