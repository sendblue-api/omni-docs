          pattern: ^https://
          maxLength: 2048
        events:
          type: array
          minItems: 1
          maxItems: 26
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventType'
        enabled:
          type: boolean
          default: true
    WebhookEndpointUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
        events:
          type: array
          minItems: 1
          maxItems: 26
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventType'
        enabled:
          type: boolean
    WebhookEndpointList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        next_cursor:
          type:
          - string
          - 'null'
    WebhookDelivery:
      type: object
      required:
      - id
      - event_id
      - event_type
      - status
      - attempts
      - response_status
      - not_sent_reason
      - created_at
      - delivered_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          pattern: ^EV[0-9a-f]{32}$
        event_type:
          $ref: '#/components/schemas/EventType'
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
        attempts:
          type: integer
          minimum: 0
          maximum: 6
        response_status:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 599
        not_sent_reason:
          type:
          - string
          - 'null'
          enum:
          - account_not_eligible
          - null
          description: |
            Why a delivery with no response has not been sent. `account_not_eligible` means the account's company is not eligible for outbound delivery now: its root account is not active, or its wallet has never been funded. Nothing is sent while that holds; a pending delivery is retried on the usual schedule and is sent once the wallet has been funded, and a failed one can be replayed. The value reports the account's state when the log is read. It is null for a delivery that reached the endpoint and whenever the account is eligible.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          $ref: '#/components/schemas/NullableTimestamp'
    WebhookDeliveryList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          type:
          - string
          - 'null'
    Subaccount:
