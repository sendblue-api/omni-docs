      description: |
        Answers an Operation, as `PATCH /groups/{group_id}` does. The
        participant appears on the Group when the operation has `succeeded`.
        A current participant answers `409 conflict`; a group of 31
        participants answers `422` (`group_full`). Free; ten per line per minute.

        Required permission: `messages:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
