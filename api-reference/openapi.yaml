      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        max_size:
          type: integer
          minimum: 1
          maximum: 5000
          default: 1000
    QueueUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        max_size:
          type: integer
          minimum: 1
          maximum: 5000
    QueueList:
