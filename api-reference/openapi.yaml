    Operation:
      type: object
      required:
      - id
      - type
      - status
      - resource
      - error
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          description: |
            `brand.submission`, `campaign.submission` and the three `group.`
            types are live. `number.purchase` is not returned by any
            operation yet. `whatsapp.template_sync` is a connection's template
            sync: `pending` while a sync is due, running or retrying, and
            `succeeded` once the last one finished.
          enum:
          - number.purchase
          - brand.submission
          - campaign.submission
          - group.participant_add
          - group.participant_remove
          - group.rename
          - whatsapp.template_sync
        status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
        resource:
          description: The resource the operation produced or acted on, once known.
          oneOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        error:
          description: Why a failed operation failed, in the shape of `Error.error`.
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                $ref: '#/components/schemas/ErrorCode'
              message:
                type: string
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
