          $ref: '#/components/responses/Error'
    post:
      operationId: createSubaccount
      tags:
      - admin
      summary: Create a subaccount. Its `token` is shown once, here.
      description: |
        Requires the parent account token or an admin acting in that account. The subaccount
        authenticates as itself with `Bearer <its id>.<its token>`; it shares
        the parent's balance.

        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Optional. An absent body is an empty object.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountCreate'
            example:
              name: West region
      responses:
        '201':
          description: The subaccount with its token.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountWithToken'
        default:
          $ref: '#/components/responses/Error'
  /admin/subaccounts/{subaccount_id}:
    parameters:
    - name: subaccount_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSubaccount
      tags:
      - admin
      summary: Read one subaccount.
      responses:
        '200':
          description: The subaccount.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subaccount'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
    patch:
      operationId: updateSubaccount
      tags:
      - admin
      summary: Rename, suspend or reactivate a subaccount.
      description: |
        A suspended subaccount cannot authenticate or start new work.

        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountUpdate'
            example:
              status: suspended
      responses:
        '200':
          description: The changed subaccount.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subaccount'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: closeSubaccount
      tags:
      - admin
      summary: Permanently close a direct child account.
      description: |
        The active parent closes its child and revokes the child's credentials.
        The child spends from the parent's wallet. Closure transfers no funds.
        The parent can still read the closed account and its posted transactions.
        Repeating the request returns 204. Closure cannot be reversed.
        Active numbers, device lines, pending orders, active campaigns, outstanding
        renewal exposure, open wallet holds or unsettled work return 409 conflict
        with a blocker in error.details.reason. A foreign or root ID returns 404.
        A request body or query parameter returns 400. For example, a 409
        for an open reservation includes `{"reason":"wallet_holds"}` in error.details.

        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
      responses:
        '204':
          description: The child is permanently closed. The response has no body.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /admin/keys:
    get:
      operationId: listKeys
      tags:
      - admin
      summary: List API keys. Secrets are never listed.
      description: |
        Requires `keys:manage` in the acting account.

        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of keys.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKey
      tags:
      - admin
      summary: Create an API key. Its `secret` is shown once, here.
      description: |
        Requires `keys:manage`. A creator may delegate only permissions they
        hold. A delegated key inherits the issuing key's expiry unless the
        request gives it an earlier one. Only an administrator session or
        account token may issue a Standard key with access to the compatible
        API under `/t`. Authenticate with `Authorization: Bearer <id>.<secret>`.
        An identical retry returns the existing key metadata. The secret is
        displayed on the first successful creation only. Replaying the same
        request after revocation returns `404 not_found` and creates no key.

        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Optional. An absent body is an empty object.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreate'
            example:
              name: Message sender
              role: messaging
      responses:
        '200':
          description: Matching issuance replay. The original key metadata excludes its secret.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '201':
          description: The key with its secret.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyWithSecret'
        default:
          $ref: '#/components/responses/Error'
  /admin/keys/{key_id}:
    parameters:
    - name: key_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getKey
      tags:
      - admin
      summary: Read one API key's metadata.
      responses:
        '200':
          description: The key.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
    patch:
      operationId: updateKey
      tags:
      - admin
      summary: Relabel an API key.
      description: |
        Requires `keys:manage`. Only the name changes: a key's permissions,
        role and expiry are fixed at issuance, and its secret is never shown
        again. Repeating the request changes nothing more.

        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdate'
            example:
              name: Billing export
      responses:
        '200':
          description: The key with its new name.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
              example:
                id: SKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx01
                name: Billing export
                role: billing_read
                permissions:
                - billing:read
                - me:read
                created_by: person:example-user
                expires_at: null
                last_used_at: '2026-11-24T17:58:00.000000Z'
                created_at: '2026-11-23T00:00:00.000000Z'
                updated_at: '2026-11-24T18:04:05.123456Z'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeKey
      tags:
      - admin
      summary: Revoke an API key. It stops authenticating at once.
      responses:
        '204':
          description: Revoked.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
  /operations/{operation_id}:
    parameters:
    - name: operation_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getOperation
      tags:
      - operations
      summary: Read the state of asynchronous work.
      description: |
        The submission of one brand or campaign to the carrier, named by the
        `operation_id` of the brand or campaign. It is `pending` until the
        carrier has answered, `succeeded` once the carrier accepted the
        submission (the fee is charged then), and `failed` when the carrier
        refused it (the fee is released). The registry's review is not part
        of the operation: read it from the resource's `status`.

        A number purchase does not return an operation yet: `POST /numbers`
        answers `201` or `202`, and repeating it reads the outcome.

        Required permission: `operations:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The operation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: OP0123456789abcdef0123456789abcdef
                type: brand.submission
                status: succeeded
                resource:
                  type: brand
                  id: BN0123456789abcdef0123456789abcdef
                error: null
                created_at: '2026-11-23T18:04:05.123456Z'
                updated_at: '2026-11-23T18:04:09.123456Z'
        default:
          $ref: '#/components/responses/Error'
  /prices:
    get:
      operationId: getPrices
      tags:
      - account
      summary: What this account pays for each thing that costs money.
      description: |
        The one place a price is read before it is charged: registering a
        brand or a campaign, buying and keeping a number, a message, a call.
        Each price is the rate this account's next request resolves to. A
        product the account has no rate for is absent, and a request for it
        is refused. The list is not paged; `next_cursor` is always null.

        A price is charged per whole `billing_increment` of `unit`, with at
        least `minimum_increments`: a call priced per 60 seconds is charged
        for each started minute. Conference participant time is priced separately
        for each participant. A composed SMS or MMS item quotes the maximum
        hold for one part in `price`. Its `usage_pricing` gives the base rate or
        estimate, carrier surcharge policy, billing condition and receipt deadline.
        Supply `parts` to preview a quantity without disclosing message text.
        A flat MMS remains one logical message regardless of part count. Unknown or
        repeated keys and out-of-range counts return 400 invalid_request.

        Required permission: `prices:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - in: query
        name: parts
        description: Estimated or known billed parts for one message. Defaults to one in composed offers.
        schema:
          type: integer
          minimum: 1
          maximum: 1600
      responses:
        '200':
          description: Assigned offers in USD. Composed terms and previews are specific to the authenticated
            account.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
              example:
                data:
                - product: brand.registration
                  use_case: null
                  unit: registration
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '4.00'
                    amount_micro_usd: 4000000
                    currency: USD
                - product: campaign.registration
                  use_case: LOW_VOLUME
                  unit: registration
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '15.00'
                    amount_micro_usd: 15000000
                    currency: USD
                - product: campaign.monthly
                  use_case: LOW_VOLUME
                  unit: month
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '0.00'
                    amount_micro_usd: 0
                    currency: USD
                - product: call.conference.participant
                  use_case: null
                  unit: second
                  billing_increment: 60
                  minimum_increments: 1
                  price:
                    amount: '0.004'
                    amount_micro_usd: 4000
                    currency: USD
                - product: message.sms.outbound
                  use_case: null
                  unit: segment
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '0.0079'
                    amount_micro_usd: 7900
                    currency: USD
                - product: message.mms.outbound
                  use_case: null
                  unit: part
                  billing_increment: 1
                  minimum_increments: 1
                  pricing_model: composed
                  price:
                    amount: '0.015'
                    amount_micro_usd: 15000
                    currency: USD
                  usage_pricing:
                    base_policy: per_part
                    base_multiplier_bps: null
                    base_estimate_per_part:
                      amount: '0.01'
                      amount_micro_usd: 10000
                      currency: USD
                    base_ceiling_per_part:
                      amount: '0.01'
                      amount_micro_usd: 10000
                      currency: USD
                    surcharge_policy: at_cost
                    surcharge_multiplier_bps: null
                    surcharge_ceiling_per_part:
                      amount: '0.005'
                      amount_micro_usd: 5000
                      currency: USD
                    billability_policy: upstream_charge
                    receipt_wait_seconds: 86400
                    parts: 1
                    estimated_base:
                      amount: '0.01'
                      amount_micro_usd: 10000
                      currency: USD
                    maximum_hold:
                      amount: '0.015'
                      amount_micro_usd: 15000
                      currency: USD
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
webhooks:
  nativeEvent:
    post:
      operationId: receiveNativeEvent
      description: Outbound delivery to the subscriber. Only the endpoint signing secret authenticates
        this message.
      summary: Receive a signed resource snapshot at the registered URL.
      security: []
      parameters:
      - name: X-Sendblue-Signature
        in: header
        required: true
        description: HMAC-SHA256 of the timestamp, a period and the exact body bytes, keyed by the displayed
          secret.
        schema:
          type: string
          pattern: ^t=[0-9]+,v1=[0-9a-f]{64}$
      - name: X-Sendblue-Delivery-Id
        in: header
        required: true
        description: Stable across automatic attempts of one delivery.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        2XX:
          description: The receiver acknowledged the delivery.
        default:
          description: The endpoint did not acknowledge the delivery.
components:
  securitySchemes:
    person:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A person''s session: `Authorization: Bearer <ID token>`, the ID token the Sendblue
        sign-in issues. The person acts in their company''s root account with the role of their seat.'
    bearer:
      type: http
      scheme: bearer
      bearerFormat: <credential id>.<secret>
      description: '`Authorization: Bearer <credential id>.<secret>`: an API key ID (`SK…`) with the key''s
        secret, or an account ID (`AC…`) with the account''s token. An existing Sendblue API key is accepted
        in the same form.'
    legacyKeyId:
      type: apiKey
      in: header
      name: sb-api-key-id
      description: The ID of an existing Sendblue API key (or of an `SK…` key or `AC…` account), sent
        together with `sb-api-secret-key`.
    legacyKeySecret:
      type: apiKey
      in: header
      name: sb-api-secret-key
      description: The credential's secret, sent together with `sb-api-key-id`.
  parameters:
    ActingAccount:
      name: Sendblue-Account
      in: header
      required: false
      description: |
        The account a person acts in: the root account of their company
        (the default) or one of its active subaccounts. Accepted on every
        operation with a person's session, and only with one.
      schema:
        type: string
        pattern: ^AC[0-9a-f]{32}$
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Limit100:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 1024
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value unique to this intended write, 1 to 128 visible ASCII
        characters. A repeat with the same key returns the original result.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x7E]+$
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
    CallId:
      name: call_id
      in: path
      required: true
      schema:
        type: string
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
    PhoneNumberPath:
      name: phone_number
      in: path
      required: true
      description: E.164, with the plus sign percent-encoded (`%2B14155550100`).
      schema:
        $ref: '#/components/schemas/PhoneNumber'
  headers:
    RequestId:
      description: |
        `Request-Id`. Identifies this request in Sendblue's logs. Present on
        every response of this API, success or error, and readable by a page
        on an allowed origin.
      schema:
        type: string
        pattern: ^RQ[0-9a-f]{32}$
      example: RQ0123456789abcdef0123456789abcdef
    RetryAfter:
      description: Seconds to wait before repeating the request. Present on throttled requests and resource
        service outages.
      schema:
        type: integer
  responses:
    Error:
      description: |
        Any response that is not 2xx: `400 invalid_request`,
        `401 unauthenticated`, `402 insufficient_funds`, `403 forbidden` or `permission_denied`,
        `404 not_found`, `405 method_not_allowed`, `409 conflict` or
        `idempotency_conflict`, `413 payload_too_large`,
        `415 unsupported_media_type`, `422 unprocessable`, `429 rate_limited`,
        `500 internal`, `503 unavailable`, `upstream_unavailable` or `write_outcome_unknown`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_request
              message: Unknown field
              details:
                field: colour
  schemas:
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              description: |
                Machine-readable context. `field` names the request member,
                parameter or header at fault; `reason` narrows `unprocessable`,
                and `forbidden` for a verified person with no seat (`no_seat`),
                whose active membership could not be confirmed (`membership_unclassified`), or
                whose company has no usable account (`account_required`, `account_suspended`).
              properties:
                field:
                  type: string
                reason:
                  type: string
                recovery:
                  type: string
                  enum:
                  - retry_same_idempotency_key
                  - read_resource
                  - reconcile_tag_membership
                  description: Required for write_outcome_unknown. Follow the operation-specific recovery
                    before attempting another write.
                required_permission:
                  $ref: '#/components/schemas/Permission'
              additionalProperties: true
    ErrorCode:
      type: string
      description: |
        The catalogue of error codes, with the status each is sent with.

        | Code | Status | Meaning |
        | --- | --- | --- |
        | `invalid_request` | 400 | The request is malformed: bad JSON, an unknown or mistyped member, a bad parameter or header. |
        | `unauthenticated` | 401 | No credential, or one that does not verify. |
        | `insufficient_funds` | 402 | The balance cannot cover the price, or debt is outstanding. |
        | `forbidden` | 403 | The account, resource or deployment refuses this operation. |
        | `permission_denied` | 403 | The credential lacks the named permission. See `details.required_permission`. |
        | `not_found` | 404 | No such route, or no such resource in this account. |
        | `method_not_allowed` | 405 | The route exists and does not take this method. |
        | `conflict` | 409 | The resource is not in a state that allows the change. |
        | `idempotency_conflict` | 409 | The `Idempotency-Key` was used for a different request. |
        | `payload_too_large` | 413 | The request body is over the limit. |
        | `unsupported_media_type` | 415 | The body is not `application/json`. |
        | `unprocessable` | 422 | The request is well formed and cannot be carried out; `details.reason` says why. |
        | `unsupported` | 422 | The member or value is defined and not available yet. |
        | `rate_limited` | 429 | Too many requests; wait `Retry-After` seconds. |
        | `internal` | 500 | An unexpected failure. |
        | `unavailable` | 503 | A dependency is unavailable or the request ran out of time; retry. |
        | `upstream_unavailable` | 503 | The resource service is unavailable. Wait the number of seconds in Retry-After. |
        | `write_outcome_unknown` | 503 | The owner may have committed. Follow details.recovery. Retry-After is omitted. |
      enum:
      - invalid_request
      - unauthenticated
      - insufficient_funds
      - forbidden
      - permission_denied
      - not_found
      - method_not_allowed
      - conflict
      - idempotency_conflict
      - payload_too_large
      - unsupported_media_type
      - unprocessable
      - unsupported
      - rate_limited
      - internal
      - unavailable
      - upstream_unavailable
      - write_outcome_unknown
    Money:
      type: object
      required:
      - amount_micro_usd
      - currency
      additionalProperties: false
      properties:
        amount_micro_usd:
          type: integer
          format: int64
          description: Millionths of a US dollar. 1 USD is 1000000.
        currency:
          type: string
          const: USD
      example:
        amount_micro_usd: 7900
        currency: USD
    PhoneNumber:
      type: string
      description: A phone number in E.164 form.
      pattern: ^\+[1-9][0-9]{6,14}$
      example: '+14155550100'
    HttpMethod:
      type: string
      enum:
      - GET
      - POST
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    NullableTimestamp:
      type:
      - string
      - 'null'
      format: date-time
    Channel:
      type: string
      enum:
      - sms
      - mms
      - voice
      - imessage
    Me:
      type: object
      required:
      - id
      - name
      - status
      - type
      - parent_id
      - credential
      - permissions
      - capabilities
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          description: The account the request acts in.
        name:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        type:
          type: string
          enum:
          - root
          - subaccount
        parent_id:
          type:
          - string
          - 'null'
          description: The parent account's ID, for a subaccount.
        credential:
          type: object
          required:
          - type
          - id
          additionalProperties: false
          properties:
            type:
              type: string
              description: |
                `api_key` for an `SK…` key and for an existing Sendblue API
                key, `account_token` for the account's token, `person` for a
                session.
              enum:
              - api_key
              - account_token
              - person
            id:
              type: string
              description: The key or account ID, or the person's user ID.
        user:
          description: The signed-in person. Present for a session only.
          $ref: '#/components/schemas/User'
        permissions:
          $ref: '#/components/schemas/Permissions'
        capabilities:
          type: array
          description: |
            The resource groups this credential can use on this deployment.
            A group is listed when its routes are live and available to the
            credential. `balance` grants the balance read. `billing` also
            grants access to the billing journal. Contacts, tags, variables and
            workflows appear for grants with available routes in the root account
            when company resources are available on this deployment. The
            media group covers uploads and reads of uploaded media. Team is listed
            for an eligible root admin session or root account token. Directory reads
            recheck a signed-in admin’s current role.
          items:
            type: string
            enum:
            - messages
            - numbers
            - brands
            - campaigns
            - prices
            - operations
            - contacts
            - tags
            - variables
            - workflows
            - calls
            - recordings
            - balance
            - billing
            - keys
            - subaccounts
            - top_ups
            - webhooks
            - media
            - team
        created_at:
          $ref: '#/components/schemas/NullableTimestamp'
    AccountStatus:
      type: string
      enum:
      - active
      - suspended
      - closed
    Role:
      type: string
      description: |
        What a person may do. `admin` may use `/admin` (keys, subaccounts,
        billing) and create the company's account; `manager` and `member`
        may use everything else. The role comes from the person's Sendblue
        seat: its `admin` and `manager` are these, and its `user` and
        `member` are `member`.
      enum:
      - admin
      - manager
      - member
    User:
      type: object
      required:
      - id
      - email
      - name
      - role
      - accounts
      - accounts_truncated
      additionalProperties: false
      properties:
        id:
          type: string
          description: The person's user ID at the identity provider.
        email:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/Role'
        accounts:
          type: array
          description: |
            The accounts the person may act in: the root account of their
            company and its active subaccounts, in ID order, at most 200.
          items:
            type: object
            required:
            - id
            - name
            - type
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
                enum:
                - root
                - subaccount
        accounts_truncated:
          type: boolean
          description: Whether the company has more accounts than `accounts` lists.
    Account:
      type: object
      required:
      - id
      - name
      - status
      - type
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        type:
          type: string
          enum:
          - root
        created_at:
          $ref: '#/components/schemas/NullableTimestamp'
    AccountCreate:
      type: object
      description: No members. The company comes from the session.
      additionalProperties: false
    MessageDirection:
      type: string
      description: '`outbound_reply` is a message a TwiML reply to an inbound message sent.'
      enum:
      - inbound
      - outbound_api
      - outbound_reply
    MessageStatus:
      type: string
      enum:
      - scheduled
      - queued
      - sending
      - sent
      - delivered
      - undelivered
      - failed
      - canceled
      - received
      - unknown
    Message:
      type: object
      required:
      - id
      - direction
      - status
      - to
      - from
      - campaign_id
      - body
      - media_urls
      - segments
      - price
      - error_code
      - status_callback
      - created_at
      - updated_at
      - sent_at
      additionalProperties: false
      properties:
        delivery_evidence:
          type: string
          enum:
          - verified
          - unknown
          - reported
          - reported_unconfirmed
          description: Evidence that an iMessage line sent the message. `verified` is the strongest evidence,
            read from the sending device's own record. `reported` means the device's authenticated report
            was corroborated by a second check. `reported_unconfirmed` means the report lacks that corroboration.
            The message status separately records recipient delivery.
        billing_status:
          type: string
          enum:
          - held
          - charged
          - uncharged
          - review
          description: The reservation is held, captured, released without charge, or awaiting review
            by Sendblue after a late affirmative report or a report that names another service after the
            charge.
        channel:
          type: string
          enum:
          - imessage
          - sms
          description: The service a message sent from an iMessage line went out as. On a line that sends
            iMessage only it is `imessage` once the device reports the message sent. On a line that may
            fall back to the device's own SMS it is the service the device last reported. Absent until
            then, and absent on every other kind of sender. The price is the one for the service the message
            was finally sent by. SMS counts as soon as it is reported, and iMessage once it is reported
            delivered or read or its sent report has stood for the line's settling time. Until then `billing_status`
            is `held`. Message webhook events carry the same value.
        failure:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          description: Why the message failed, where the cause is one the account can act on. Present
            with `error_code` on a `failed` message, on reads and in the `message.failed` event. `imessage_strict_mode_unenforceable`
            (`error_code` 5504) means the line is in strict iMessage mode and its device cannot enforce
            iMessage-only delivery, so nothing was sent. The line's delivery mode must be changed by the
            operator (Sendblue) before the line can send.
          properties:
            code:
              type: string
              enum:
              - imessage_strict_mode_unenforceable
            message:
              type: string
        read_at:
          $ref: '#/components/schemas/Timestamp'
          description: When Omni received the sending device's first report that the recipient read the
            message. The device reports only that the message was read, not when, so this is the time
            of receipt of that report and not the time of reading. Present only on a message sent from
            an iMessage line whose recipient shares read receipts. It is set once and never moves. The
            status stays delivered.
        id:
          type: string
        direction:
          $ref: '#/components/schemas/MessageDirection'
        usage:
          $ref: '#/components/schemas/MessageUsage'
        status:
          $ref: '#/components/schemas/MessageStatus'
        to:
          $ref: '#/components/schemas/PhoneNumber'
        from:
          description: The sender. Null until a campaign has chosen one.
          oneOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        campaign_id:
          type:
          - string
          - 'null'
          description: The campaign the message was sent through, if one was named.
        body:
          type: string
          description: Empty after redaction.
        media_urls:
          type: array
          description: Ordered attachment URLs. Outbound messages retain the submitted URLs. Inbound messages
            link to Omni Media resources that require the owning account's credentials.
          items:
            type: string
            format: uri
        segments:
          type:
          - integer
          - 'null'
          description: SMS segments, once known.
        price:
          description: What the message cost, once settled.
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        error_code:
          type:
          - integer
          - 'null'
          description: The failure class of a `failed` or `undelivered` message.
        status_callback:
          type:
          - string
          - 'null'
          format: uri
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        sent_at:
          $ref: '#/components/schemas/NullableTimestamp'
    MessageCreate:
      type: object
      required:
      - to
      additionalProperties: false
      properties:
        to:
          $ref: '#/components/schemas/PhoneNumber'
        from:
          $ref: '#/components/schemas/PhoneNumber'
          description: A number the account owns. Required unless `campaign_id` is given.
        campaign_id:
          type: string
          description: Send from this campaign's numbers. With `from`, that number must belong to it.
        body:
          type: string
          maxLength: 1600
          description: Required unless attachments are given.
        media_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          description: Public https URLs of attachments. Sends the message as MMS.
        media_ids:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: Uploads owned by this account, in delivery order. Use these or media_urls. A qualified
            strict iMessage sender accepts one upload. An upload must remain readable when the transport
            retrieves it.
        status_callback:
          type: string
          format: uri
          description: A public https URL that receives the message's status changes.
        send_at:
          type: string
          format: date-time
          description: Send later, between 15 minutes and 35 days from now. Needs `campaign_id`.
        validity_period_seconds:
          type: integer
          minimum: 1
          maximum: 36000
          description: Fail the message if it has not been handed to the carrier in this time.
        max_price_micro_usd:
          type: integer
          format: int64
          minimum: 1
          description: Refuse the message if it would cost more than this.
    MessageUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        status:
          type: string
          const: canceled
        body:
          type: string
          const: ''
    MessageList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type:
          - string
          - 'null'
    Number:
      type: object
      required:
      - id
      - phone_number
      - friendly_name
      - source
      - channels
      - capabilities
      - sms
      - campaign_id
      - price
      - monthly_price
      - voice_url
      - voice_method
      - voice_fallback_url
      - voice_fallback_method
      - status_callback
      - status_callback_method
      - created_at
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - 'null'
          description: The number's ID. `null` for a registered number, which has none.
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        friendly_name:
          type: string
          description: The number as it is usually written. Setting a name of your own is planned.
        source:
          type: string
          description: |
            How the account came to have the number. `requested`: an enrolled retained line
            fulfilled against an iMessage number request. `purchased`: bought
            through this API (or the Twilio-compatible one). `registered`: a
            number the company already held, registered for the account by
            Sendblue. A registered number sends and receives like any other
            and is read-only here: it has no ID, creation time or
            configuration, and is not changed or released through this API.
          enum:
          - purchased
          - requested
          - registered
        channels:
          type: array
          description: |
            What the number's kind can be used for: `sms`, `mms` and `voice`
            for a purchased carrier number; for a registered carrier number
            `sms` and `mms` when it is a message sender and `voice` when it
            is enabled for calls; `imessage` for an iMessage line. It is not a per-number
            measurement; `capabilities` says what the number can do now.
          items:
            $ref: '#/components/schemas/Channel'
        capabilities:
          type: object
          description: What the number can do now.
          required:
          - messages
          - calls
          additionalProperties: false
          properties:
            messages:
              type: boolean
              description: |
                Whether a message can be sent from the number. A purchased
                number can once its 10DLC campaign is approved and the
                carrier has confirmed the number's assignment to it; a
                registered carrier sender needs both the ready flag and a matching
                enabled carrier route. A retained device uses its sender flag.
            calls:
              type: boolean
              description: Whether the number is enabled for calls.
        voice_url:
          type:
          - string
          - 'null'
          format: uri
          description: Where the TwiML for an incoming call is fetched.
        voice_method:
          oneOf:
          - $ref: '#/components/schemas/HttpMethod'
          - type: 'null'
        voice_fallback_url:
          type:
          - string
          - 'null'
          format: uri
        voice_fallback_method:
          oneOf:
          - $ref: '#/components/schemas/HttpMethod'
          - type: 'null'
        status_callback:
          type:
          - string
          - 'null'
          format: uri
          description: Receives the status of incoming calls.
        status_callback_method:
          oneOf:
          - $ref: '#/components/schemas/HttpMethod'
          - type: 'null'
        campaign_id:
          type:
          - string
          - 'null'
          description: The assigned campaign's ID. Null for unassigned, registered, and requested numbers.
        sms:
          $ref: '#/components/schemas/NumberSms'
        price:
          description: The settled acquisition price, or null for a number with no retail purchase.
          oneOf:
          - $ref: '#/components/schemas/Price'
          - type: 'null'
        monthly_price:
          description: The account's current monthly rate for a settled retail purchase. Null for requested
            and registered numbers, an acquisition without a retail purchase record, or an account without
            a monthly rate.
          oneOf:
          - $ref: '#/components/schemas/Price'
          - type: 'null'
        created_at:
          description: When the number was bought or the iMessage request was fulfilled. `null` for a
            registered number.
          $ref: '#/components/schemas/NullableTimestamp'
    NumberConfigurationSnapshot:
      description: The purchased number and routing configuration captured at the transition.
      type: object
      additionalProperties: false
      required:
      - id
      - phone_number
      - friendly_name
      - channels
      - voice_url
      - voice_method
      - voice_fallback_url
      - voice_fallback_method
      - status_callback
      - status_callback_method
      - created_at
      properties:
        id:
          type: string
        phone_number:
          $ref: '#/components/schemas/Number/properties/phone_number'
        friendly_name:
          $ref: '#/components/schemas/Number/properties/friendly_name'
        channels:
          $ref: '#/components/schemas/Number/properties/channels'
        voice_url:
          $ref: '#/components/schemas/Number/properties/voice_url'
        voice_method:
          $ref: '#/components/schemas/Number/properties/voice_method'
        voice_fallback_url:
          $ref: '#/components/schemas/Number/properties/voice_fallback_url'
        voice_fallback_method:
          $ref: '#/components/schemas/Number/properties/voice_fallback_method'
        status_callback:
          $ref: '#/components/schemas/Number/properties/status_callback'
        status_callback_method:
          $ref: '#/components/schemas/Number/properties/status_callback_method'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    NumberCreate:
