                $ref: '#/components/schemas/WhatsappNumberList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /whatsapp/numbers/{number_id}:
