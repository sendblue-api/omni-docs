  /admin/billing/top_ups:
    post:
      operationId: createTopUp
      tags:
      - admin
      summary: Start a one-time hosted card checkout for the root account's USD wallet.
      description: |
        Show the gross amount before confirmation. Sendblue absorbs processing fees.
        Poll the returned ID until checkout_url is available, then open it in a browser.
        After payment the browser returns to the deployment's configured return page with
        the query parameter `top_up=<this top-up's id>` beside the payment provider's own
        parameters. Read the top-up by that ID to learn the outcome; the redirect itself
        proves nothing.
        Replay the same key and amount to recover the same top-up. A changed amount
        returns 409 idempotency_conflict. Invalid amounts or fields return 400,
        absent credentials 401, and a child account or missing `billing:top_up` grant 403. A deployment
        without checkout intake returns 503 unavailable.

        Required permission: `billing:top_up`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpCreate'
            example:
              amount: '25.00'
      responses:
        '201':
          description: The durable top-up, including its current state on replay.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
              example:
                id: 87350fa8-7779-4d23-a968-e215ae5961d8
                status: pending
                amount:
                  amount: '25.00'
                  amount_micro_usd: 25000000
                  currency: USD
                checkout_url: null
                transaction_id: null
                created_at: '2026-11-23T12:00:00Z'
                updated_at: '2026-11-23T12:00:00Z'
        default:
          $ref: '#/components/responses/Error'
  /admin/billing/top_ups/{top_up_id}:
    parameters:
    - name: top_up_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getTopUp
      tags:
      - admin
      summary: Read the status of a hosted checkout and its wallet credit.
      description: |
        Requires `billing:top_up` on the root account (401 for missing credentials, 403 for
        insufficient access). Foreign and unknown IDs return the same 404 not_found.
        An expired checkout link is hidden. Later verified payment can still settle.

        Required permission: `billing:top_up`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: The top-up.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
              example:
                id: 87350fa8-7779-4d23-a968-e215ae5961d8
                status: succeeded
                amount:
                  amount: '25.00'
                  amount_micro_usd: 25000000
                  currency: USD
                transaction_id: '18'
                checkout_url: null
                created_at: '2026-11-23T12:00:00Z'
                updated_at: '2026-11-23T12:04:00Z'
        default:
          $ref: '#/components/responses/Error'
  /admin/billing/auto_refill:
    get:
      operationId: getAutoRefill
      tags:
      - admin
      summary: Read the root account's automatic refill rule.
      description: |
        The threshold and target are null until a rule has been configured.

        Required permission: `billing:history`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
