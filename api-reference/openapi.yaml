        time_limit_seconds:
          type: integer
          minimum: 30
          maximum: 14400
          description: The longest the answered call may last. Default 14400.
        record:
          type: boolean
          description: Record the participant's call from answer to hangup.
        recording_channels:
          type: string
          enum:
          - mono
          - dual
        recording_track:
          type: string
          enum:
          - inbound
          - outbound
          - both
        recording_status_callback:
          type: string
          format: uri
        recording_status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        recording_status_callback_events:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - in_progress
            - completed
            - absent
        machine_detection:
