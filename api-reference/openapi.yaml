    NumberCampaign:
      type: object
      description: A number's campaign, and whether it may send SMS and MMS now.
      required:
      - phone_number
      - campaign_id
      - sms
      - assigned_at
      - activated_at
      additionalProperties: false
      properties:
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        campaign_id:
          type:
          - string
          - 'null'
          description: The campaign the number is assigned to.
        sms:
          $ref: '#/components/schemas/NumberSms'
        assigned_at:
          $ref: '#/components/schemas/NullableTimestamp'
        activated_at:
          description: When the carrier first confirmed the assignment and the number began to send.
          $ref: '#/components/schemas/NullableTimestamp'
      example:
        phone_number: '+14155550100'
        campaign_id: MG0123456789abcdef0123456789abcdef
        sms:
          enabled: false
          blocked_reason: carrier_assignment_pending
        assigned_at: '2026-11-23T18:04:05.123456Z'
        activated_at: null
    NumberSms:
      type: object
      required:
      - enabled
      - blocked_reason
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether this number is enabled for carrier SMS.
        blocked_reason:
          description: |
            Why it would not: `no_campaign` (the number is in no
            campaign), `campaign_not_approved`,
            `carrier_assignment_failed` (the carrier rejected the assignment),
            `carrier_assignment_pending` (the carrier has not confirmed
            the number's assignment to the campaign, or its last
            confirmation is more than ten minutes old) or
            `number_not_active` (the line or its carrier route is disabled, the line is paused, or the
            account owes money), or `channel_not_supported` (a registered line
            for voice or iMessage only). Null when `enabled` is true.
          oneOf:
          - type: string
            enum:
            - no_campaign
            - campaign_not_approved
            - carrier_assignment_failed
            - carrier_assignment_pending
            - number_not_active
            - channel_not_supported
          - type: 'null'
    NumberCampaignAssign:
      type: object
      required:
      - campaign_id
      additionalProperties: false
      properties:
        campaign_id:
          type: string
    AvailableNumberList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailableNumber'
        next_cursor:
          type: 'null'
    NumberOrder:
      type: object
      required:
      - id
      - channel
      - quantity
      - area_code
      - note
      - price
      - status
      - phone_numbers
      - reason
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        channel:
          type: string
          const: imessage
        quantity:
          type: integer
          minimum: 1
        area_code:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        price:
          type: string
          description: Total USD quote for the requested quantity at creation.
          pattern: ^[0-9]+\.[0-9]{2,6}$
        status:
          type: string
          enum:
          - pending
          - fulfilled
          - cancelled
          - declined
        reason:
          type:
          - string
          - 'null'
          description: Customer-visible explanation when the operator declines.
        phone_numbers:
          type: array
          description: The numbers assigned once the order is fulfilled.
          items:
            $ref: '#/components/schemas/PhoneNumber'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: 7ddf4982-fe66-4c75-a31f-41936b641ce7
        channel: imessage
        quantity: 1
        area_code: '415'
        note: San Francisco preferred
        price: '15.00'
        status: pending
        phone_numbers: []
        reason: null
        created_at: '2026-11-23T12:00:00.000000Z'
        updated_at: '2026-11-23T12:00:00.000000Z'
    NumberOrderList:
      type: object
      additionalProperties: false
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NumberOrder'
        next_cursor:
          type:
          - string
          - 'null'
    NumberOrderCreate:
      type: object
      required:
      - channel
      - quantity
      additionalProperties: false
      properties:
        channel:
          type: string
          const: imessage
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        area_code:
          type:
          - string
          - 'null'
          pattern: ^[2-9][0-9]{2}$
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    Price:
      type: object
      description: |
        An amount in US dollars. `amount` is a decimal string with two to six
        decimals; `amount_micro_usd` is the same amount as every other money
        member of this API states it.
      required:
      - amount
      - amount_micro_usd
      - currency
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^[0-9]+\.[0-9]{2,6}$
        amount_micro_usd:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          const: USD
      example:
        amount: '4.00'
        amount_micro_usd: 4000000
        currency: USD
    ComposedMessagePrice:
      type: object
      additionalProperties: false
      required:
      - base_policy
      - base_multiplier_bps
      - base_estimate_per_part
      - base_ceiling_per_part
      - surcharge_policy
      - surcharge_multiplier_bps
      - surcharge_ceiling_per_part
      - billability_policy
      - receipt_wait_seconds
      - parts
      - estimated_base
      - maximum_hold
      properties:
        base_policy:
          type: string
          enum:
          - per_part
          - carrier_multiplier
        base_multiplier_bps:
          type:
          - integer
          - 'null'
          description: 10000 basis points equals 1× the finalized carrier base.
        base_estimate_per_part:
          $ref: '#/components/schemas/Price'
        base_ceiling_per_part:
          $ref: '#/components/schemas/Price'
        surcharge_policy:
          type: string
          enum:
          - none
          - at_cost
          - multiplier
        surcharge_multiplier_bps:
          type:
          - integer
          - 'null'
        surcharge_ceiling_per_part:
          $ref: '#/components/schemas/Price'
        billability_policy:
          type: string
          enum:
          - handoff
          - upstream_charge
        receipt_wait_seconds:
          type: integer
          minimum: 1
        parts:
          type: integer
          minimum: 1
          maximum: 1600
        estimated_base:
          $ref: '#/components/schemas/Price'
        maximum_hold:
          $ref: '#/components/schemas/Price'
    NullableUsagePrice:
      oneOf:
      - $ref: '#/components/schemas/Price'
      - type: 'null'
    MessageUsage:
      type: object
      description: A composed SMS or MMS reservation or settlement. Amounts become available when the
        corresponding financial decision is posted. An explicit zero is a confirmed amount.
      additionalProperties: false
      required:
      - message_id
      - direction
      - service
      - outcome
      - reason
      - carrier_status
      - estimated_parts
      - billed_parts
      - maximum_hold
      - base_charge
      - surcharge_charged
      - total_charge
      - uncollected
      properties:
        message_id:
          type:
          - string
          - 'null'
          description: Message ID when the item is a message of this API.
        inbox_message_id:
          type: string
          description: Inbox message ID of a shared inbound item.
        direction:
          type: string
          enum:
          - outbound
          - inbound
        service:
          type: string
          enum:
          - SMS
          - MMS
        outcome:
          type: string
          description: State of the reserve or settlement.
        reason:
          type:
          - string
          - 'null'
          description: Why the amount was captured
          capped: null
          held for review or released.: null
        carrier_status:
          type:
          - string
          - 'null'
          description: Native delivery status observed when the pricing decision was recorded.
        estimated_parts:
          type:
          - integer
          - 'null'
        billed_parts:
          type:
          - integer
          - 'null'
        maximum_hold:
          $ref: '#/components/schemas/NullableUsagePrice'
        base_charge:
          $ref: '#/components/schemas/NullableUsagePrice'
        surcharge_charged:
          $ref: '#/components/schemas/NullableUsagePrice'
        total_charge:
          $ref: '#/components/schemas/NullableUsagePrice'
        uncollected:
          $ref: '#/components/schemas/NullableUsagePrice'
    PriceItem:
      type: object
      required:
      - product
      - use_case
      - unit
      - billing_increment
      - minimum_increments
      - price
      additionalProperties: false
      properties:
        product:
          type: string
          description: |
            `brand.registration`, `brand.vetting`, and `campaign.registration` (once per
            submission), `campaign.monthly` (per renewed month),
            `number.purchase` (once), `number.monthly`,
            `message.sms.outbound` and `message.sms.inbound` (segments on flat tariffs),
            `message.mms.outbound` and `message.mms.inbound` (messages on flat tariffs).
            `message.imessage.outbound` prices one message sent from an iMessage
            line. `message.imessage.sms_fallback.outbound` prices each segment of a
            message that such a line's own device sent as SMS instead.
            Composed SMS and MMS tariffs use billed parts. `call.outbound`
            prices the outbound call leg. `call.conference.participant` prices
            each participant's conference time in seconds.
            `message.whatsapp.outbound` prices one WhatsApp message, charged
            when WhatsApp reports it delivered; it is listed only while
            WhatsApp is enabled for the account.
          enum:
          - brand.registration
          - brand.vetting
          - campaign.registration
          - campaign.monthly
          - number.purchase
          - number.monthly
          - number.imessage.request
          - message.sms.outbound
          - message.sms.inbound
          - message.mms.outbound
          - message.mms.inbound
          - message.imessage.outbound
          - message.imessage.sms_fallback.outbound
          - call.outbound
          - call.conference.participant
          - message.whatsapp.outbound
        use_case:
          description: The use case for a campaign registration or monthly price. Null for other products.
          oneOf:
          - $ref: '#/components/schemas/CampaignUseCase'
          - type: 'null'
        unit:
          type: string
          enum:
          - registration
          - number
          - month
          - segment
          - message
          - second
          - part
        billing_increment:
          type: integer
          minimum: 1
          description: How many units one charge of `price` covers.
        minimum_increments:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Price'
        pricing_model:
          type: string
          const: composed
        usage_pricing:
          $ref: '#/components/schemas/ComposedMessagePrice'
        flat_preview:
          type: object
          additionalProperties: false
          required:
          - parts
          - billing_units
          - total
          properties:
            parts:
              type: integer
              minimum: 1
              maximum: 1600
            billing_units:
              type: integer
              minimum: 1
            total:
              $ref: '#/components/schemas/Price'
    PriceList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        next_cursor:
          type: 'null'
