      responses:
        '200':
          description: The changed contact.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContact'
              example:
                id: contact-1
                phone_number: '+14155550100'
                first_name: Ada
                last_name: null
                email: null
                tags:
                - customer
                opted_out: false
                created_at: '2026-01-10T00:00:00Z'
                updated_at: '2026-01-10T00:00:00Z'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteContact
      tags:
      - contacts
      summary: Delete a contact and confirm its cleanup.
      description: |
        Available to companies whose contact directory supports direct writes and whose policy permits deletion.
        Eligible running workflows are stopped and the contact is removed.
        Cleanup of every stored copy is tracked durably.
        On write_outcome_unknown repeat DELETE for the same contact ID to confirm completion.
        Other directories return 409 with reason legacy_sync_delete_by_phone before a write.

        Required permission: `contacts:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /tags:
    post:
      operationId: createTag
      tags:
      - tags
      summary: Create a tag in the company's tag catalogue.
      description: |
        Requires the root account and tags:write. A catalogue that does not support creation here returns 409
        conflict with details.reason=tag_catalogue_legacy_owned before creating a tag.
        The same key and request return the original tag even after rename or deletion.
        A different request on the same key returns 409 idempotency_conflict.
        After write_outcome_unknown, retry with the original key and body.

        Required permission: `tags:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
