          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: QU0123456789abcdef0123456789abcdef
        name: support
        max_size: 100
        current_size: 2
        average_wait_seconds: 41
        created_at: '2026-11-24T18:00:00.000Z'
        updated_at: '2026-11-24T18:00:00.000Z'
    QueueCreate:
      type: object
      required:
