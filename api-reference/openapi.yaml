        callback of the call that received an HTTP response, with what was
        sent and what your server answered, newest first. A request that
        received no response (a timeout, a refused connection) leaves no
        event.

        The history becomes readable 15 minutes after the call ends; before
        that the list is empty. Events are kept for 30 days and are erased
        with the call. Each API instance reads at most four pages at once:
        beyond that the answer is `429 rate_limited` with `Retry-After`.

        Required permission: `calls:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
