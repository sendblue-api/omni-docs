  /messages/{message_id}/reactions:
    parameters:
    - $ref: '#/components/parameters/MessageId'
    post:
      operationId: createReaction
      tags:
      - messages
      summary: Add a tapback to a message on an iMessage line.
      description: |
        Reacts, as the line, to one message in a one-to-one iMessage
        conversation: a message the line sent, or one it received. `kind` is
        one of `love`, `like`, `dislike`, `laugh`, `emphasize`, `question`
        (the names of the earlier Sendblue API), or `emoji` with exactly one
        fully qualified emoji in `emoji`. `part` names which part of the
        message (its text or one of its attachments) and defaults to `0`.

        A reaction is free and is not a message: nothing is held or charged,
        and each line accepts 60 a minute.

        The answer is `202` with the Reaction in `queued`. It is handed to the
        line's Mac as soon as the Mac is connected, and then becomes
        `sent_unconfirmed`, which is final: the Mac acknowledges and reports
        nothing for a reaction, so Sendblue cannot say whether Apple applied it,
        and `sent` is never reported. A reaction the Mac was not connected to
        receive within five minutes becomes `failed` with `failure_reason:
        device_offline`; it is never sent late and never sent twice. Read the
        outcome with `GET /messages/{message_id}/reactions/{reaction_id}`.

        Refused with `422` and `details.reason`: `not_imessage` (the message
        went or came as SMS or RCS), `message_not_sent` (the device has not
        sent it, or it failed), `target_not_addressable` (Sendblue does not hold
        the identifier the device knows the message by: a message received
        before Sendblue began keeping it, or a sent message the device never
        reported), `line_unavailable` (the line is no longer an active
        iMessage line). A message that is not on an iMessage line answers
        `404`. A repeated `Idempotency-Key` returns the original Reaction.

        Required permission: `messages:send`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionCreate'
            examples:
              tapback:
                value:
                  kind: love
              emoji:
                value:
                  kind: emoji
                  emoji: 🔥
                  part: 1
      responses:
        '202':
          description: The reaction was accepted and is waiting for the device.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
              example:
                id: RX0123456789abcdef0123456789abcdef
                direction: outbound
                status: queued
                message_id: SM11112222333344445555666677778888
                part: 0
                action: added
                kind: love
                emoji: null
                text: null
                from: '+14155550100'
                to: '+14155550101'
                channel: imessage
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
