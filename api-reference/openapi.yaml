  /recordings/{recording_id}:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecording
      tags:
      - recordings
      summary: Read one recording.
      responses:
        '200':
          description: The recording.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateRecording
      tags:
      - recordings
      summary: Pause, resume or stop a recording.
      description: |
        `paused` pauses capture, `in_progress` resumes it and `stopped` ends
        it. The change is queued for the carrier: the response is the
        recording as it is now, and its `status` follows when the carrier has
        acknowledged (`paused`, `in_progress`, or `processing` after a stop).
        Asking for the state a recording is already in, or repeating a change
        that is still queued, succeeds and queues nothing. What the audio
        holds for paused time is the carrier's behaviour; none can be selected.

        A recording of a call takes all three. A recording of a conference
        can be paused and resumed while the conference is in progress; it
        ends with the conference, and `stopped` answers `422 unprocessable`.
        A recording that is not in a state the change applies to answers
        `409 conflict`.

        Required permission: `recordings:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingUpdate'
            examples:
              pause:
                value:
                  status: paused
              resume:
                value:
                  status: in_progress
              stop:
                value:
                  status: stopped
      responses:
        '200':
          description: The recording after the change was recorded.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        default:
