      operationId: removeGroupParticipant
      tags:
      - messages
      summary: Remove a participant from a group chat.
      description: |
        Answers an Operation, as `PATCH /groups/{group_id}` does. Apple
        removes a participant only from a group of four or more, the line
        included: a smaller group answers `422` (`group_too_small`). Free;
        ten per line per minute.

        Required permission: `messages:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The change was accepted for the device.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
  /media:
    post:
      operationId: uploadMedia
      tags:
      - media
      summary: Upload one file for outgoing messages.
      description: |
        Two custody modes are selected by the `access` query parameter:

        - `carrier_link` (default): 1 byte through 4 MiB, retained for 4 hours, served over a bearer link for SMS/MMS/iMessage carriers. The file is judged by its bytes. A PNG, JPEG, GIF, MP4, MP3 or PDF is accepted when its declared MIME type and file signature agree. A CAF voice note (`audio/x-caf`) and a vCard contact card (`text/vcard`) are recognised from their bytes whatever type or file name the client declares. Each account can retain 256 active `carrier_link` uploads and 64 MiB.
        - `private`: 1 byte through 100 MiB, retained for 24 hours, stored in unified private multi-channel custody (`omni/media/v1/`) and served only through authenticated `GET /media/{media_id}/content` (never a bearer URL). Used by WhatsApp, Telegram, and future channels. Each account can retain 10,000 live private objects and 20 GiB.

        Repeating the `Idempotency-Key` with the same type, bytes, and filename returns the same upload while live. Malformed forms return 400, expired or erased replays return 404, a different file on the same key returns 409, oversize files return 413, unsupported files return 415, and exhausted capacity returns 429.

        Required permission: `media:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: access
        in: query
        required: false
        description: Storage and access model. Defaults to `carrier_link` for SMS/MMS/iMessage uploads;
          pass `private` for authenticated multi-channel uploads up to 100 MiB.
        schema:
          type: string
          enum:
          - carrier_link
          - private
          default: carrier_link
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/png, image/jpeg, image/gif, image/webp, video/mp4, video/3gpp, audio/mpeg,
                  audio/aac, audio/amr, audio/mp4, audio/ogg, application/pdf, text/plain, audio/x-caf,
                  text/vcard, text/x-vcard, application/octet-stream
      responses:
        '201':
          description: The stored file.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        default:
          $ref: '#/components/responses/Error'
  /media/{media_id}:
    parameters:
    - name: media_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getMedia
      tags:
      - media
      summary: Read metadata and download URL of an active media object in this account.
      description: |
        An expired, erased or unowned media object returns 404.

        Required permission: `media:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The media item.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMedia
      tags:
      - media
      summary: Erase the file and revoke its download URL.
      description: |
        The URL stops serving bytes immediately even if it was attached to a queued message. An expired, erased or unowned media object returns 404.

        Required permission: `media:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /media/{media_id}/content:
    parameters:
    - name: media_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getMediaContent
      tags:
      - media
      summary: Download the bytes of a private media object owned by this account.
      description: |
        Streams verified bytes for an active private media object (uploaded via `POST /media?access=private` or stored from an inbound channel attachment such as WhatsApp). Returns 404 when expired, deleted, or not owned by the authenticated account.

        Required permission: `media:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The verified file bytes.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /contacts:
    post:
      operationId: createContact
      tags:
      - contacts
      summary: Create or resolve a US contact.
      description: |
        Available to companies whose contact directory supports direct writes. An identical key and body replay
        the original response, including after the contact is edited or deleted. A
        known contact keeps its existing fields. A new contact queues a capability
        check. Read the assigned canonical ID at GET /contacts/{contact_id}.
        Other directories return 409 with reason legacy_sync_generation_unverified
        before a write. An ambiguous existing phone identity returns 409.
        For a new contact, record consent where the company records it today. An explicit
        opted_out on create returns 409 with reason contact_consent_owner_unavailable.
        New numeric variable values support ordinary decimal conversion with at most
        15 significant digits. Date variables accept calendar-valid ISO dates or timestamps
        with an explicit timezone, and supported integer epochs. Locale date strings,
        radix-prefixed numbers and unsupported precision return 400 invalid_request,
        field variables, reason contact_variable_value_unverified, before commit.
        These rules are deliberately strict.
        On write_outcome_unknown replay the same key and body.

        Required permission: `contacts:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200':
          description: The existing contact. Its profile and labels are unchanged.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
              description: The relative path of the canonical contact.
            Sendblue-Contact-Created:
              schema:
                type: string
                enum:
                - 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContact'
              example:
                id: d53a8c5d-8d72-4ca6-938d-769234edd88c
                phone_number: '+14155550100'
                first_name: Ada
                last_name: null
                email: null
                tags: []
                opted_out: false
                created_at: '2026-01-10T00:00:00Z'
                updated_at: '2026-01-10T00:00:00Z'
        '201':
          description: The newly created contact, once it is fully stored.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
              description: The relative path of the canonical contact.
            Sendblue-Contact-Created:
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContact'
              example:
                id: d53a8c5d-8d72-4ca6-938d-769234edd88c
                phone_number: '+14155550100'
                first_name: Ada
                last_name: null
                email: null
                tags: []
                opted_out: false
                created_at: '2026-01-10T00:00:00Z'
                updated_at: '2026-01-10T00:00:00Z'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listContacts
      tags:
      - contacts
      summary: Search or list US contacts.
      description: |
        A page can be short or empty. Continue while next_cursor is present.
        A substring search examines up to 1,000 candidate contacts after the cursor.
        When the service cannot establish a page within its search budget it returns
        HTTP 422 with the standard error envelope, code `unprocessable`,
        `details.field=search`, and `details.reason=search_too_broad`. Start a new
        search with an exact phone_number, a tag_id or an opted_out filter that
        narrows the candidate set.

        Required permission: `contacts:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit100'
      - $ref: '#/components/parameters/Cursor'
      - name: search
        in: query
        description: Case-insensitive literal substring of the contact name, phone number or email.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: phone_number
        in: query
        schema:
          $ref: '#/components/schemas/PhoneNumber'
      - name: tag_id
        in: query
        schema:
          type: string
      - name: opted_out
        in: query
