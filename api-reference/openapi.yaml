    NumberCampaign:
      type: object
      description: A number's campaign, and whether it may send SMS and MMS now.
      required:
      - phone_number
      - campaign_id
      - sms
      - assigned_at
      - activated_at
      additionalProperties: false
      properties:
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
