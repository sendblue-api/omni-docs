  /calls/{call_id}/siprec:
    parameters:
    - $ref: '#/components/parameters/CallId'
    post:
      operationId: startCallSiprec
      tags:
      - calls
      summary: Start a SIPREC session on a call in progress.
      description: |
        Sends the call's audio to the SIPREC recorder of a connector
        configured for the account, until the session is stopped or the call
        ends. Requests to `status_callback` keep Twilio's format and
        `X-Twilio-Signature`, exactly as a `<Start><Siprec>` in TwiML. A
        session is billed per second; its price through the call's time limit
        is held from the balance when it starts. A repeat with the same
        `Idempotency-Key` returns the first session.

        Refusals: `402 insufficient_funds` when the balance or spending limit
        does not cover the hold; `503 unavailable` when the account has no
        rate for SIPREC; `409 conflict` when the call cannot take the session
        (it is not answered, has ended, already runs a session of this `name`,
        or the account has no connector of this name) or the key was used
        with other options; `422 unsupported` for a `status_callback` where
        the deployment cannot reach customer servers.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
