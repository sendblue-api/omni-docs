  /whatsapp/numbers/{number_id}/register:
    parameters:
    - name: number_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: registerWhatsappNumber
      tags:
      - whatsapp
      summary: Register a number that already has a two-step verification PIN.
      description: |
        For a number in `pin_required`: Omni tried to register it and the
        number already has a two-step verification PIN. Send that PIN, or
        reset it in WhatsApp Manager first. A `registration_failed` number
        whose `retry_at` has passed, or that has none, can be registered again
        the same way, with its three automatic attempts restored. Omni keeps
        the PIN for later registrations of the same number. The number's next
        state arrives as `whatsapp.number.updated`.

        A number in any other state is refused with `409 conflict`,
        `details.reason: number_not_waiting_for_pin`. An `Idempotency-Key`
        names one number: reused for another, it is `409
        idempotency_conflict`; repeated for the same one, it answers the
        number as it is now.

        Required permission: `whatsapp:manage`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappNumberRegister'
            example:
              pin: '123456'
      responses:
        '202':
          description: The number, `registering`.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappNumber'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/messages:
    post:
      operationId: createWhatsappMessage
      tags:
      - whatsapp
      summary: Send a WhatsApp message.
      description: |
        `from` is a `WN…` ID or the number's E.164: a `ready` number of a
        `connected` or `suspect` connection of this account. A send from a
        `suspect` connection is accepted and waits until Omni's check of the
        connection decides it. `to` is an E.164 number, a WhatsApp user ID or
        a `WK…` contact. `type` names the one member that carries the
        content.

        The answer is `202` with the message `queued`. Its statuses arrive as
        `whatsapp.message.*` webhooks. Sendblue's fee is held at acceptance
        and charged when WhatsApp reports the message delivered, read or
        played. A message that fails, expires or ends `unknown` is free. A
        send whose outcome at Meta is unknown is never sent again by Omni;
        send it again with a new `Idempotency-Key` if you choose to.

        Refusals, with `error.details.reason`:

        - `422 unprocessable`: `window_closed` (a message that is not a
          template, while the contact's 24-hour window is closed;
          `details.window_expired_at` says when it closed),
          `recipient_opted_out` (`details.source` is `whatsapp` or `sms`),
          `marketing_opted_out`, `us_marketing_not_delivered`,
          `phone_number_required`, `recipient_not_in_portfolio`,
          `template_not_approved` and `template_not_found`.
        - `422 unsupported`: `whatsapp_not_enabled`,
          `message_type_unsupported` and `media_type_unsupported`.
        - `409 conflict`: `number_not_ready`, `connection_disconnected` and
          `connection_app_mismatch`.
        - `404 not_found`: a `reply_to`, reaction message, upload or
          `template_id` this account doesn't have, or an expired upload.
        - `402 insufficient_funds`: the balance cannot cover the fee.
        - `400 invalid_request`: a missing or extra template variable, a bad
          shape, a string holding NUL or an unrecognised `to`, named in
          `details.field`.

        Required permission: `whatsapp:send`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappMessageCreate'
            example:
              from: '+14155550100'
              to: '+447700900123'
              type: text
              text:
                body: Your table is ready
                preview_url: false
              reply_to:
                message_id: WM3f0123456789abcdef0123456789abcd
              validity_period_seconds: 86400
      responses:
        '202':
          description: The message, `queued`.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappMessage'
              example:
                id: WM0123456789abcdef0123456789abcdef
                direction: outbound
                origin: api
                number_id: WN0123456789abcdef0123456789abcdef
                from: '+14155550100'
                to: '+447700900123'
                contact:
                  id: WK0123456789abcdef0123456789abcdef
                  phone_number: '+447700900123'
                  user_id: null
                  profile_name: null
                type: text
                text:
                  body: Your table is ready
                  preview_url: false
                reply_to:
                  message_id: WM3f0123456789abcdef0123456789abcd
                status: queued
                meta_send_status: null
                failure: null
                meta_message_id: null
                pricing:
                  meta_category: null
                  meta_pricing_type: null
                  price: null
                media: []
                truncated: false
                expires_at: '2026-11-26T18:04:05Z'
                created_at: '2026-11-25T18:04:05Z'
                accepted_at: null
                sent_at: null
                delivered_at: null
                read_at: null
                played_at: null
                failed_at: null
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listWhatsappMessages
      tags:
      - whatsapp
      summary: List WhatsApp messages, newest first.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: number_id
        in: query
        description: Only messages of this number.
        schema:
          type: string
      - name: contact
        in: query
        description: Only messages with this contact, by `WK…` ID, E.164 number or WhatsApp user ID.
        schema:
          type: string
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - inbound
          - outbound
      - name: from
        in: query
        description: Only messages whose `from` is this.
        schema:
          type: string
      - name: to
        in: query
        description: Only messages whose `to` is this.
        schema:
          type: string
      responses:
        '200':
          description: One page of messages.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappMessageList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /whatsapp/messages/{message_id}:
    parameters:
    - name: message_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getWhatsappMessage
      tags:
      - whatsapp
      summary: Read one WhatsApp message.
      responses:
        '200':
          description: The message.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappMessage'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /whatsapp/read_receipts:
    post:
      operationId: createWhatsappReadReceipt
      tags:
      - whatsapp
      summary: Mark an inbound WhatsApp message read, optionally showing typing.
      description: |
        `message_id` is an inbound message. With `typing: true` the contact
        also sees a typing indicator. A read receipt is free, inherently
        idempotent at Meta, and is sent even to a contact who opted out.

        Required permission: `whatsapp:send`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappReadReceiptCreate'
            example:
              message_id: WM0123456789abcdef0123456789abcdef
              typing: false
      responses:
        '204':
          description: Marked read at Meta.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/templates:
    get:
      operationId: listWhatsappTemplates
      tags:
      - whatsapp
      summary: List message templates.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: connection_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          description: One page of templates.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappTemplateList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
    post:
      operationId: createWhatsappTemplate
      tags:
      - whatsapp
      summary: Create a message template and submit it to Meta for review.
      description: |
        The template is stored `PENDING`. Meta's review result arrives as
        `whatsapp.template.updated`.

        Required permission: `whatsapp:manage`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappTemplateCreate'
      responses:
        '201':
          description: The template.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappTemplate'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/templates/sync:
    post:
      operationId: syncWhatsappTemplates
      tags:
      - whatsapp
      summary: Pull a connection's templates from WhatsApp Manager.
      description: |
        Templates made in WhatsApp Manager are added or updated, and templates
        gone from Meta are marked deleted. Follow the work with
        `GET /operations/{operation_id}`. Omni also syncs after signup and
        daily.

        Required permission: `whatsapp:manage`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappTemplateSyncRequest'
            example:
              connection_id: WC0123456789abcdef0123456789abcdef
      responses:
        '202':
          description: The sync was started.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappTemplateSync'
              example:
                operation_id: OP0123456789abcdef0123456789abcdef
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/templates/{template_id}:
    parameters:
    - name: template_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getWhatsappTemplate
      tags:
      - whatsapp
      summary: Read one template, with the schema of the values a send supplies.
      responses:
        '200':
          description: The template.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappTemplate'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
    delete:
      operationId: deleteWhatsappTemplate
      tags:
      - whatsapp
      summary: Delete this language version of a template, in Meta and here.
      description: |
        A repeat answers the template as it is now.

        Required permission: `whatsapp:manage`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The deleted template.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappTemplate'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/contacts:
    get:
      operationId: listWhatsappContacts
      tags:
      - whatsapp
      summary: List the account's WhatsApp contacts.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of contacts.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappContactList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /whatsapp/contacts/{contact}:
    parameters:
    - name: contact
      in: path
      required: true
      description: A `WK…` contact ID, an E.164 number with the plus sign percent-encoded, or a WhatsApp
        user ID.
      schema:
        type: string
    get:
      operationId: getWhatsappContact
      tags:
      - whatsapp
      summary: Read a contact's identities, reply windows and opt-out state.
      responses:
        '200':
          description: The contact.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappContact'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateWhatsappContact
      tags:
      - whatsapp
      summary: Opt a contact out of, or back in to, the account's WhatsApp messages.
      description: |
        The change covers every WhatsApp number of the account and records the
        credential that made it in `opted_out.actor`. Use it to carry over
        opt-outs recorded elsewhere: opting out an E.164 number or a parent
        user ID that has no contact yet makes one, and opting one back in is
        `404`. A user ID names one business portfolio, so it must already
        belong to a contact. A contact merged into another answers as that
        one. A repeat answers the contact as it is now.

        Required permission: `whatsapp:send`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappContactUpdate'
            example:
              opted_out: true
      responses:
        '200':
          description: The contact.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappContact'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: eraseWhatsappContact
      tags:
      - whatsapp
      summary: Erase a contact's stored message content, media and identities.
      description: |
        For a recipient's erasure request. Omni keeps only a hashed opt-out
        record, so a contact who opted out stays opted out. Webhook snapshots
        that hold the contact's content are invalidated. A repeat answers the
        contact as it is now.

        Required permission: `whatsapp:connect`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: The erased contact.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappContact'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/settings:
    get:
      operationId: getWhatsappSettings
      tags:
      - whatsapp
      summary: Read the account's WhatsApp opt-out keyword settings.
      responses:
        '200':
          description: The settings.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSettings'
              example:
                opt_out_keyword_exceptions:
                - cancel
                opt_out_phrases:
                - remove me
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `settings:read`. Accepted credentials: a signed-in administrator, an API key, the account token.
    patch:
      operationId: updateWhatsappSettings
      tags:
      - whatsapp
      summary: Change the account's WhatsApp opt-out keyword settings.
      description: |
        `stop` and `unsubscribe` cannot be listed in
        `opt_out_keyword_exceptions`. Keywords and phrases are compared with
        a received text trimmed and in lower case, and are stored that way.
        A phrase is 1 to 160 characters on one line, at most 50 of them, and
        cannot be `start`. The account needs WhatsApp enabled.

        Required permission: `settings:write`. Accepted credentials: a signed-in administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappSettingsUpdate'
      responses:
        '200':
          description: The settings.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSettings'
        default:
          $ref: '#/components/responses/Error'
webhooks:
  nativeEvent:
    post:
      operationId: receiveNativeEvent
      description: Outbound delivery to the subscriber. Only the endpoint signing secret authenticates
        this message.
      summary: Receive a signed resource snapshot at the registered URL.
      security: []
      parameters:
      - name: X-Sendblue-Signature
        in: header
        required: true
        description: HMAC-SHA256 of the timestamp, a period and the exact body bytes, keyed by the displayed
          secret.
        schema:
          type: string
          pattern: ^t=[0-9]+,v1=[0-9a-f]{64}$
      - name: X-Sendblue-Delivery-Id
        in: header
        required: true
        description: Stable across automatic attempts of one delivery.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        2XX:
          description: The receiver acknowledged the delivery.
        default:
          description: The endpoint did not acknowledge the delivery.
components:
  securitySchemes:
    person:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A person''s session: `Authorization: Bearer <ID token>`, the ID token the Sendblue
        sign-in issues. The person acts in their company''s root account with the role of their seat.'
    bearer:
      type: http
      scheme: bearer
      bearerFormat: <credential id>.<secret>
      description: '`Authorization: Bearer <credential id>.<secret>`: an API key ID (`SK…`) with the key''s
        secret, or an account ID (`AC…`) with the account''s token. An existing Sendblue API key is accepted
        in the same form.'
    legacyKeyId:
      type: apiKey
      in: header
      name: sb-api-key-id
      description: The ID of an existing Sendblue API key (or of an `SK…` key or `AC…` account), sent
        together with `sb-api-secret-key`.
    legacyKeySecret:
      type: apiKey
      in: header
      name: sb-api-secret-key
      description: The credential's secret, sent together with `sb-api-key-id`.
  parameters:
    ActingAccount:
      name: Sendblue-Account
      in: header
      required: false
      description: |
        The account a person acts in: the root account of their company
        (the default) or one of its active subaccounts. Accepted on every
        operation with a person's session, and only with one.
      schema:
        type: string
        pattern: ^AC[0-9a-f]{32}$
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Limit100:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 1024
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value unique to this intended write, 1 to 128 visible ASCII
        characters. A repeat with the same key returns the original result.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x7E]+$
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
    ReactionId:
      name: reaction_id
      in: path
      required: true
      schema:
        type: string
    CallId:
      name: call_id
      in: path
      required: true
      schema:
        type: string
    ConferenceId:
      name: conference_id
      in: path
      required: true
      schema:
        type: string
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
    QueueId:
      name: queue_id
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
    ExpectedNumberId:
      name: Sendblue-Number-Id
      in: header
      required: false
      description: Refuse the change if the purchased number no longer has this identity.
      schema:
        type: string
        pattern: ^PN[a-f0-9]{32}$
    CallbackEndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        type: string
    PhoneNumberPath:
      name: phone_number
      in: path
      required: true
      description: E.164, with the plus sign percent-encoded (`%2B14155550100`).
      schema:
        $ref: '#/components/schemas/PhoneNumber'
  headers:
    RequestId:
      description: |
        `Request-Id`. Identifies this request in Sendblue's logs. Present on
        every response of this API, success or error, and readable by a page
        on an allowed origin.
      schema:
        type: string
        pattern: ^RQ[0-9a-f]{32}$
      example: RQ0123456789abcdef0123456789abcdef
    RetryAfter:
      description: Seconds to wait before repeating the request. Present on throttled requests and resource
        service outages.
      schema:
        type: integer
    RateLimitLimit:
      description: |
        `RateLimit-Limit`. On an accepted send from an iMessage line: the
        line's configured value for the limit named in `RateLimit-Policy`.
        The four `RateLimit-*` headers are sent together, and only when the
        line's limits were checked for this send. They are absent for a
        recipient who is exempt or wrote to the line in the last 24 hours, on
        a repeated `Idempotency-Key`, and on lines that are not iMessage
        lines.
      schema:
        type: integer
      example: 15
    RateLimitRemaining:
      description: '`RateLimit-Remaining`. How many more the limit allows, after this send is counted.'
      schema:
        type: integer
        minimum: 0
      example: 14
    RateLimitReset:
      description: |
        `RateLimit-Reset`. Seconds until the limit frees: 1 for `line_burst`,
        at most 3600 for `line_hourly_new_recipients`, and the time until the
        line's day begins (03:00 in New York) for the two daily limits.
      schema:
        type: integer
        minimum: 1
      example: 3600
    RateLimitPolicy:
      description: |
        `RateLimit-Policy`. Which limit the other three describe: of the
        limits checked for this send, the one with the least room left as a
        share of its value. `line_burst` is named only when four fifths of it
        are spent. `line_response_rate` is never named: a rate has nothing
        remaining.
      schema:
        type: string
        enum:
        - line_burst
        - line_daily_conversations
        - line_hourly_new_recipients
        - line_daily_new_recipients
      example: line_hourly_new_recipients
  responses:
    Error:
      description: |
        Any response that is not 2xx: `400 invalid_request`,
        `401 unauthenticated`, `402 insufficient_funds`, `403 forbidden` or `permission_denied`,
        `404 not_found`, `405 method_not_allowed`, `409 conflict` or
        `idempotency_conflict`, `413 payload_too_large`,
        `415 unsupported_media_type`, `422 unprocessable`, `429 rate_limited`,
        `500 internal`, `503 unavailable`, `upstream_unavailable` or `write_outcome_unknown`.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_request
              message: Unknown field
              details:
                field: colour
  schemas:
    WhatsappSignupLinkCreate:
      type: object
      additionalProperties: false
      properties:
        return_url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
          description: Where the browser goes when signup finishes, with `status` and `connection_id`
            added to its query.
    WhatsappSignupLink:
      type: object
      description: A signup link as a read, a replay and the `whatsapp.signup.*` webhooks show it. Only
        the answer that created it shows its `url`.
      required:
      - id
      - url
      - status
      - return_url
      - expires_at
      - connection_id
      - attempts
      - failure
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WS[0-9a-f]{32}$
        url:
          type: 'null'
          description: Always null. Omni keeps only a digest of the link's token.
        status:
          type: string
          description: |
            `pending`: never opened. `opened`: the page was served; the link
            stays usable until it connects or expires. `connected`, `failed`
            and `expired` are final.
          enum:
          - pending
          - opened
          - connected
          - failed
          - expired
        return_url:
          type:
          - string
          - 'null'
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        connection_id:
          type:
          - string
          - 'null'
          pattern: ^WC[0-9a-f]{32}$
          description: The connection the link produced or refreshed, once `connected`.
        attempts:
          type: array
          description: Each signup popup that ended without connecting.
          items:
            type: object
            required:
            - at
            - result
            - reason
            additionalProperties: false
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              result:
                type: string
                enum:
                - cancelled
                - error
                - retryable_failure
              reason:
                type:
                - string
                - 'null'
        failure:
          description: Why a `failed` link failed.
          oneOf:
          - type: object
            required:
            - code
            - message
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - messaging_account_claimed
                - account_disabled
                - session_info_missing
              message:
                type: string
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsappSignupLinkWithUrl:
      type: object
      description: The answer that created a signup link.
      required:
      - id
      - url
      - status
      - return_url
      - expires_at
      - connection_id
      - attempts
      - failure
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WS[0-9a-f]{32}$
        url:
          type: string
          format: uri
          pattern: ^https://
          description: The page that opens Meta's signup popup. Shown once.
        status:
          type: string
          description: |
            `pending`: never opened. `opened`: the page was served; the link
            stays usable until it connects or expires. `connected`, `failed`
            and `expired` are final.
          enum:
          - pending
          - opened
          - connected
          - failed
          - expired
        return_url:
          type:
          - string
          - 'null'
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        connection_id:
          type:
          - string
          - 'null'
          pattern: ^WC[0-9a-f]{32}$
          description: The connection the link produced or refreshed, once `connected`.
        attempts:
          type: array
          description: Each signup popup that ended without connecting.
          items:
            type: object
            required:
            - at
            - result
            - reason
            additionalProperties: false
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              result:
                type: string
                enum:
                - cancelled
                - error
                - retryable_failure
              reason:
                type:
                - string
                - 'null'
        failure:
          description: Why a `failed` link failed.
          oneOf:
          - type: object
            required:
            - code
            - message
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - messaging_account_claimed
                - account_disabled
                - session_info_missing
              message:
                type: string
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsappConnection:
      type: object
      description: One Meta Messaging account connected to this account.
      required:
      - id
      - status
      - meta_business_id
      - messaging_account_id
      - whatsapp_account_ids
      - messaging_limit
      - number_ids
      - meta_app_id
      - token_refreshed_at
      - disconnected_at
      - disconnect_reason
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WC[0-9a-f]{32}$
        status:
          type: string
          description: |
            `suspect`: Meta refused the business token and Omni is checking
            it; sends wait. `disconnected` and `revoked` are final.
          enum:
          - connected
          - suspect
          - disconnected
          - revoked
        meta_business_id:
          type: string
        messaging_account_id:
          type: string
        whatsapp_account_ids:
          type: array
          description: Meta's WhatsApp account IDs. Empty until Meta introduces them.
          items:
            type: string
        messaging_limit:
          type:
          - string
          - 'null'
          description: Meta's messaging limit for the whole business portfolio, so connections of one
            Meta business show the same value.
        number_ids:
          type: array
          items:
            type: string
            pattern: ^WN[0-9a-f]{32}$
        meta_app_id:
          type: string
        token_refreshed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        disconnected_at:
          $ref: '#/components/schemas/NullableTimestamp'
        disconnect_reason:
          type:
          - string
          - 'null'
          description: Why the connection ended, for example `app_changed`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsappConnectionList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappConnection'
        next_cursor:
          type:
          - string
          - 'null'
    WhatsappNumber:
      type: object
      required:
      - id
      - connection_id
      - phone_number
      - meta_phone_number_id
      - display_name
      - name_status
      - status
      - status_reason
      - quality_rating
      - throughput_mps
      - whatsapp_business_app
      - omni_number
      - retry_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WN[0-9a-f]{32}$
        connection_id:
          type: string
          pattern: ^WC[0-9a-f]{32}$
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        meta_phone_number_id:
          type: string
        display_name:
          type:
          - string
          - 'null'
        name_status:
          type:
          - string
          - 'null'
        status:
          type: string
          description: |
            Only a `ready` number sends. `pin_required`: send the number's
            two-step verification PIN to `POST /whatsapp/numbers/{id}/register`.
            `registration_failed`: `status_reason` says why
            (`attempts_exhausted` or `registration_blocked`), and `retry_at`
            when Meta allows another attempt.
          enum:
          - registering
          - pin_required
          - ready
          - restricted
          - registration_failed
          - disconnected
        status_reason:
          type:
          - string
          - 'null'
        quality_rating:
          type:
          - string
          - 'null'
        throughput_mps:
          type: integer
          description: Messages a second this number sends at most.
        whatsapp_business_app:
          type: boolean
          description: The number is also on the WhatsApp Business app.
        omni_number:
          description: The number as one this account bought here, when it is one.
          oneOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        retry_at:
          description: For `registration_failed` after Meta blocked registration, when it can be tried
            again.
          $ref: '#/components/schemas/NullableTimestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsappNumberList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappNumber'
        next_cursor:
          type:
          - string
          - 'null'
    WhatsappNumberRegister:
      type: object
      required:
      - pin
      additionalProperties: false
      properties:
        pin:
          type: string
          pattern: ^[0-9]{6}$
    WhatsappMessageType:
      type: string
      description: The member of the message that carries its content. `unsupported` is a received type
        Omni does not model yet.
      enum:
      - text
      - image
      - video
      - audio
      - document
      - sticker
      - template
      - interactive
      - reaction
      - location
      - contacts
      - unsupported
    WhatsappText:
      type: object
      required:
      - body
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4096
        preview_url:
          type: boolean
    WhatsappMedia:
      type: object
      description: |
        An audio file or a sticker: an upload (`media_id`, from `POST /media`)
        or a public `url` that Meta fetches.
      additionalProperties: false
      properties:
        media_id:
          type: string
        url:
          type: string
          format: uri
          pattern: ^https://
      oneOf:
      - required:
        - media_id
      - required:
        - url
    WhatsappCaptionedMedia:
      type: object
      description: An image or a video, as `WhatsappMedia`, with an optional `caption`.
      additionalProperties: false
      properties:
        media_id:
          type: string
        url:
          type: string
          format: uri
          pattern: ^https://
        caption:
          type: string
      oneOf:
      - required:
        - media_id
      - required:
        - url
    WhatsappDocument:
      type: object
      description: A document, as `WhatsappMedia`, with an optional `caption` and `filename`.
      additionalProperties: false
      properties:
        media_id:
          type: string
        url:
          type: string
          format: uri
          pattern: ^https://
        caption:
          type: string
        filename:
          type: string
      oneOf:
      - required:
        - media_id
      - required:
        - url
    WhatsappTemplateSend:
      type: object
      description: |
        Name the template by `template_id`, or by `name` and `language`, not
        both. Give its values in `variables`, `header` and `buttons`, or pass
        Meta's `components` array in place of all three.
      additionalProperties: false
      properties:
        template_id:
          type: string
          pattern: ^WT[0-9a-f]{32}$
        name:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
        variables:
          type:
          - object
          - array
          description: An object for a template with named variables, an array for one with numbered variables.
        header:
          type:
          - object
          - array
          description: |
            The header's file (`media_id` or `url`), or its text variables:
            an object for named variables, an array for numbered ones.
        buttons:
          type: array
          items:
            type: object
            description: The value of one button, by its position in the template.
            required:
            - index
            additionalProperties: false
            properties:
              index:
                type: integer
                minimum: 0
              url_suffix:
                type: string
              payload:
                type: string
              coupon_code:
                type: string
            oneOf:
            - required:
              - url_suffix
            - required:
              - payload
            - required:
              - coupon_code
        components:
          type: array
          minItems: 1
          description: Meta's template components, with their parameters.
          items:
            type: object
      oneOf:
      - required:
        - template_id
      - required:
        - name
        - language
      dependentRequired:
        name:
        - language
        language:
        - name
      not:
        required:
        - components
        anyOf:
        - required:
          - variables
        - required:
          - header
        - required:
          - buttons
    WhatsappInteractive:
      type: object
      description: |
        Meta's interactive object. Only the `button`, `list` and `cta_url`
        types are sent; flows, catalogue and payment messages are refused
        with `422 unsupported`, `details.reason` `message_type_unsupported`.
      required:
      - type
      - body
      - action
      properties:
        type:
          type: string
        body:
          type: object
          required:
          - text
          additionalProperties: false
          properties:
            text:
              type: string
              minLength: 1
        action:
          type: object
    WhatsappReaction:
      type: object
      required:
      - message_id
      - emoji
      additionalProperties: false
      properties:
        message_id:
          type: string
          pattern: ^WM[0-9a-f]{32}$
        emoji:
          type: string
          description: An empty string removes the reaction.
    WhatsappLocation:
      type: object
      required:
      - latitude
      - longitude
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        name:
          type: string
        address:
          type: string
    WhatsappContacts:
      type: object
      required:
      - contacts
      additionalProperties: false
      properties:
        contacts:
          type: array
          description: Meta's contact objects.
          items:
            type: object
    WhatsappMessageCreate:
      type: object
      description: |
        `type` names the one member that carries the content: that member is
        required and no other content member is accepted.
      required:
      - from
      - to
      - type
      additionalProperties: false
      properties:
        from:
          type: string
          description: A `WN…` ID or the number's E.164.
        to:
          type: string
          description: An E.164 number, a WhatsApp user ID or a `WK…` contact.
        type:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - document
          - sticker
          - template
          - interactive
          - reaction
          - location
          - contacts
        text:
          $ref: '#/components/schemas/WhatsappText'
        image:
          $ref: '#/components/schemas/WhatsappCaptionedMedia'
        video:
          $ref: '#/components/schemas/WhatsappCaptionedMedia'
        audio:
          $ref: '#/components/schemas/WhatsappMedia'
        document:
          $ref: '#/components/schemas/WhatsappDocument'
        sticker:
          $ref: '#/components/schemas/WhatsappMedia'
        template:
          $ref: '#/components/schemas/WhatsappTemplateSend'
        interactive:
          $ref: '#/components/schemas/WhatsappInteractive'
        reaction:
          $ref: '#/components/schemas/WhatsappReaction'
        location:
          $ref: '#/components/schemas/WhatsappLocation'
        contacts:
          $ref: '#/components/schemas/WhatsappContacts'
        reply_to:
          type: object
          required:
          - message_id
          additionalProperties: false
          description: |
            An earlier message of the same chat, quoted by this one: one of
            this account's messages with the same contact on the same Meta
            number, which a reconnect keeps. A `WM…` ID the account does not
            have answers `404`.
          properties:
            message_id:
              type: string
              pattern: ^WM[0-9a-f]{32}$
        validity_period_seconds:
          type: integer
          minimum: 60
          maximum: 259200
          default: 86400
          description: A message still queued this long after acceptance fails `expired`, and its hold
            is released.
      oneOf:
      - properties:
          type:
            const: text
        required:
        - text
      - properties:
          type:
            const: image
        required:
        - image
      - properties:
          type:
            const: video
        required:
        - video
      - properties:
          type:
            const: audio
        required:
        - audio
      - properties:
          type:
            const: document
        required:
        - document
      - properties:
          type:
            const: sticker
        required:
        - sticker
      - properties:
          type:
            const: template
        required:
        - template
      - properties:
          type:
            const: interactive
        required:
        - interactive
      - properties:
          type:
            const: reaction
        required:
        - reaction
      - properties:
          type:
            const: location
        required:
        - location
      - properties:
          type:
            const: contacts
        required:
        - contacts
      dependentSchemas:
        text:
          properties:
            type:
              const: text
        image:
          properties:
            type:
              const: image
        video:
          properties:
            type:
              const: video
        audio:
          properties:
            type:
              const: audio
        document:
          properties:
            type:
              const: document
        sticker:
          properties:
            type:
              const: sticker
        template:
          properties:
            type:
              const: template
        interactive:
          properties:
            type:
              const: interactive
        reaction:
          properties:
            type:
              const: reaction
        location:
          properties:
            type:
              const: location
        contacts:
          properties:
            type:
              const: contacts
    WhatsappMessageStatus:
      type: string
      description: |
        A received message is `received`. A sent one goes `queued`,
        `accepted`, `sent`, `delivered`, then `read` or `played`, and never
        back. `failed`, `expired` and `unknown` end it off that path;
        `unknown` is a send whose outcome at Meta was not learned within 15
        minutes.
      enum:
      - received
      - queued
      - accepted
      - sent
      - delivered
      - read
      - played
      - failed
      - expired
      - unknown
    WhatsappFailureReason:
      type: string
      enum:
      - window_closed
      - recipient_opted_out
      - marketing_opted_out
      - recipient_unavailable
      - template_parameters_invalid
      - template_paused_or_disabled
      - quality_hold_dropped
      - media_unavailable
      - payment_method_required
      - messaging_limit_reached
      - number_restricted
      - connection_revoked
      - connection_disconnected
      - expired
      - outcome_unknown
      - policy_violation
      - meta_error
    WhatsappAttachment:
      type: object
      required:
      - id
      - content_type
      - size_bytes
      - sha256
      - filename
      - status
      - url
      - expires_at
      additionalProperties: false
      properties:
        id:
          type: string
        content_type:
          type:
          - string
          - 'null'
        size_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        filename:
          type:
          - string
          - 'null'
        status:
          type: string
          description: |
            `pending`: being copied from Meta. `ready`: kept for 30 days.
            `unavailable`: Meta no longer serves it. `refused_quota`: over the
            account's storage or the number's hourly budget.
          enum:
          - pending
          - ready
          - unavailable
          - refused_quota
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Authenticated download route (`GET /media/{id}/content`) when `status` is `ready`.
            Requires the owning account's credentials (`media:read`).
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
    WhatsappMessage:
      type: object
      description: |
        Exactly one content member, the one `type` names, is present. A sent
        message has the member it was sent with. A received one has Meta's
        member, with any file in `media`; received contact cards are
        wrapped in `contacts.contacts`, as a send gives them. A received type
        Omni does not model is `unsupported`, and `unsupported.meta_type` is
        Meta's name for it. A message someone sent in a WhatsApp group is
        `unsupported` with `meta_type: group`.
      required:
      - id
      - direction
      - origin
      - number_id
      - from
      - to
      - contact
      - type
      - reply_to
      - status
      - meta_send_status
      - failure
      - meta_message_id
      - pricing
      - media
      - truncated
      - expires_at
      - created_at
      - accepted_at
      - sent_at
      - delivered_at
      - read_at
      - played_at
      - failed_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WM[0-9a-f]{32}$
        direction:
          type: string
          enum:
          - inbound
          - outbound
        origin:
          description: For a sent message, `api`, or `whatsapp_business_app` for a copy of one sent from
            the WhatsApp Business app. Null for a received message.
          type:
          - string
          - 'null'
          enum:
          - api
          - whatsapp_business_app
          - null
        number_id:
          type: string
          pattern: ^WN[0-9a-f]{32}$
        from:
          type: string
        to:
          type: string
        contact:
          type: object
          required:
          - id
          - phone_number
          - user_id
          - profile_name
          additionalProperties: false
          properties:
            id:
              type: string
              pattern: ^WK[0-9a-f]{32}$
            phone_number:
              oneOf:
              - $ref: '#/components/schemas/PhoneNumber'
              - type: 'null'
            user_id:
              type:
              - string
              - 'null'
            profile_name:
              type:
              - string
              - 'null'
        type:
          $ref: '#/components/schemas/WhatsappMessageType'
        text:
          type: object
          description: A received text is not held to the 4,096 characters of a send.
          required:
          - body
          additionalProperties: false
          properties:
            body:
              type: string
            preview_url:
              type: boolean
        image:
          type: object
        video:
          type: object
        audio:
          type: object
        document:
          type: object
        sticker:
          type: object
        template:
          type: object
        interactive:
          type: object
        reaction:
          type: object
        location:
          type: object
        contacts:
          $ref: '#/components/schemas/WhatsappContacts'
        unsupported:
          type: object
          required:
          - meta_type
          additionalProperties: false
          properties:
            meta_type:
              type: string
        reply_to:
          oneOf:
          - type: object
            required:
            - message_id
            additionalProperties: false
            properties:
              message_id:
                type: string
                pattern: ^WM[0-9a-f]{32}$
          - type: 'null'
        status:
          $ref: '#/components/schemas/WhatsappMessageStatus'
        meta_send_status:
          type:
          - string
          - 'null'
          description: What Meta's send response said, for example `accepted` or `held_for_quality_assessment`.
        failure:
          oneOf:
          - type: object
            required:
            - code
            - message
            - provider_code
            additionalProperties: false
            properties:
              code:
                $ref: '#/components/schemas/WhatsappFailureReason'
              message:
                type:
                - string
                - 'null'
              provider_code:
                type:
                - integer
                - 'null'
          - type: 'null'
        meta_message_id:
          type:
          - string
          - 'null'
        pricing:
          type: object
          required:
          - meta_category
          - meta_pricing_type
          - price
          additionalProperties: false
          properties:
            meta_category:
              type:
              - string
              - 'null'
            meta_pricing_type:
              type:
              - string
              - 'null'
            price:
              description: Sendblue's fee once charged, otherwise null. Meta bills its own charges to
                the customer.
              oneOf:
              - $ref: '#/components/schemas/Money'
              - type: 'null'
        media:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappAttachment'
        truncated:
          type: boolean
          description: |
            True when a received message was larger than Omni stores, so its
            member was shortened: a text keeps the start of its body, and
            other members keep their first entries and the start of each
            value. The message is delivered either way.
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        sent_at:
          $ref: '#/components/schemas/NullableTimestamp'
        delivered_at:
          $ref: '#/components/schemas/NullableTimestamp'
        read_at:
          $ref: '#/components/schemas/NullableTimestamp'
        played_at:
          $ref: '#/components/schemas/NullableTimestamp'
        failed_at:
          $ref: '#/components/schemas/NullableTimestamp'
      oneOf:
      - properties:
          type:
            const: text
        required:
        - text
      - properties:
          type:
            const: image
        required:
        - image
      - properties:
          type:
            const: video
        required:
        - video
      - properties:
          type:
            const: audio
        required:
        - audio
      - properties:
          type:
            const: document
        required:
        - document
      - properties:
          type:
            const: sticker
        required:
        - sticker
      - properties:
          type:
            const: template
        required:
        - template
      - properties:
          type:
            const: interactive
        required:
        - interactive
      - properties:
          type:
            const: reaction
        required:
        - reaction
      - properties:
          type:
            const: location
        required:
        - location
      - properties:
          type:
            const: contacts
        required:
        - contacts
      - properties:
          type:
            const: unsupported
        required:
        - unsupported
      dependentSchemas:
        text:
          properties:
            type:
              const: text
        image:
          properties:
            type:
              const: image
        video:
          properties:
            type:
              const: video
        audio:
          properties:
            type:
              const: audio
        document:
          properties:
            type:
              const: document
        sticker:
          properties:
            type:
              const: sticker
        template:
          properties:
            type:
              const: template
        interactive:
          properties:
            type:
              const: interactive
        reaction:
          properties:
            type:
              const: reaction
        location:
          properties:
            type:
              const: location
        contacts:
          properties:
            type:
              const: contacts
        unsupported:
          properties:
            type:
              const: unsupported
    WhatsappMessageList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappMessage'
        next_cursor:
          type:
          - string
          - 'null'
    WhatsappReadReceiptCreate:
      type: object
      required:
      - message_id
      additionalProperties: false
      properties:
        message_id:
          type: string
          pattern: ^WM[0-9a-f]{32}$
        typing:
          type: boolean
          default: false
    WhatsappTemplate:
      type: object
      description: One language version of a message template.
      required:
      - id
      - connection_id
      - meta_template_id
      - name
      - language
      - category
      - status
      - quality
      - parameter_format
      - components
      - send_schema
      - rejected_reason
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WT[0-9a-f]{32}$
        connection_id:
          type: string
          pattern: ^WC[0-9a-f]{32}$
        meta_template_id:
          type: string
        name:
          type: string
        language:
          type: string
        category:
          type: string
          description: Meta's category.
        status:
          type: string
          description: Meta's review status, such as `PENDING`, `APPROVED`, `REJECTED`, `PAUSED` or `DISABLED`.
            Only an `APPROVED` template sends. A template deleted through Omni or gone from Meta is `DELETED`.
        quality:
          type:
          - string
          - 'null'
        parameter_format:
          type: string
          enum:
          - named
          - positional
        components:
          type: array
          description: Meta's components.
          items:
            type: object
        send_schema:
          type: object
          description: |
            A JSON Schema for the `variables`, `header` and `buttons` a send
            of this template supplies. A template sent only with Meta's
            `components` (a location header, a carousel, or variables Omni
            cannot read) has a schema no values fit, whose `description`
            says why.
        rejected_reason:
          type:
          - string
          - 'null'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsappTemplateCreate:
      type: object
      required:
      - connection_id
      - name
      - language
      - category
      - components
      additionalProperties: false
      properties:
        connection_id:
          type: string
          pattern: ^WC[0-9a-f]{32}$
        name:
          type: string
        language:
          type: string
        category:
          type: string
          description: Meta's category.
        parameter_format:
          type: string
          enum:
          - named
          - positional
          description: |
            How the components write their variables: `named` for
            `{{first_name}}`, `positional` for `{{1}}`. Omitted, it follows the
            components: `named` when their variables are named, otherwise
            `positional`. Components that mix the two are refused with
            `400 invalid_request`.
        components:
          type: array
          description: Meta's components.
          items:
            type: object
    WhatsappTemplateList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappTemplate'
        next_cursor:
          type:
          - string
          - 'null'
    WhatsappTemplateSyncRequest:
      type: object
      required:
      - connection_id
      additionalProperties: false
      properties:
        connection_id:
          type: string
          pattern: ^WC[0-9a-f]{32}$
    WhatsappTemplateSync:
      type: object
      required:
      - operation_id
      additionalProperties: false
      properties:
        operation_id:
          type: string
          description: The sync, for `GET /operations/{operation_id}`.
    WhatsappContact:
      type: object
      description: |
        One person, by every identity Omni has seen for them. It shows at
        most 100 identities, the first seen, and the 100 windows with the
        latest inbound messages; `truncated` is `true` when the contact has
        more. Sends check the window of their own number either way.
      required:
      - id
      - identities
      - profile_name
      - opted_out
      - marketing_opted_out
      - windows
      - truncated
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^WK[0-9a-f]{32}$
        identities:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - kind
            - value
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                - phone
                - user_id
                - parent_user_id
              value:
                type: string
              meta_business_id:
                type: string
                description: The business portfolio a user ID belongs to.
        profile_name:
          type:
          - string
          - 'null'
        opted_out:
          type: object
          description: |
            Whether every WhatsApp message to the contact is refused. `source`
            is `keyword` for a STOP or START the contact sent, and `api` for a
            change through `PATCH /whatsapp/contacts/{contact}`, whose
            credential is `actor`: `key:SK…`, `account:AC…` or
            `person:<user ID>`, or `person_sha256:<hex>`, the SHA-256 of a
            user ID longer than 121 characters. `at` is Meta's time of the
            keyword, or for an API change the start of the second of the
            call, or the time of the change it replaced when that is later.
          required:
          - value
          - source
          - at
          additionalProperties: false
          properties:
            value:
              type: boolean
            source:
              type:
              - string
              - 'null'
              enum:
              - keyword
              - api
              - null
            actor:
              type: string
            at:
              $ref: '#/components/schemas/NullableTimestamp'
        marketing_opted_out:
          type: object
          description: Whether the contact stopped marketing messages in WhatsApp. It refuses marketing
            templates only.
          required:
          - value
          - at
          additionalProperties: false
          properties:
            value:
              type: boolean
            at:
              $ref: '#/components/schemas/NullableTimestamp'
        windows:
          type: array
          maxItems: 100
          description: The contact's 24-hour reply window on each number it wrote to, the latest first.
            A message that is not a template needs an open window.
          items:
            type: object
            required:
            - number_id
            - open
            - expires_at
            - last_inbound_at
            additionalProperties: false
            properties:
              number_id:
                type: string
                pattern: ^WN[0-9a-f]{32}$
              open:
                type: boolean
              expires_at:
                $ref: '#/components/schemas/Timestamp'
              last_inbound_at:
                $ref: '#/components/schemas/Timestamp'
        truncated:
          type: boolean
          description: The contact has more identities or windows than it shows.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WhatsappContactList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhatsappContact'
        next_cursor:
          type:
          - string
          - 'null'
    WhatsappContactUpdate:
      type: object
      required:
      - opted_out
      additionalProperties: false
      properties:
        opted_out:
          type: boolean
    WhatsappSettings:
      type: object
      required:
      - opt_out_keyword_exceptions
      - opt_out_phrases
      additionalProperties: false
      properties:
        opt_out_keyword_exceptions:
          type: array
          description: Opt-out keywords that do not opt a contact out on this account.
          items:
            type: string
        opt_out_phrases:
          type: array
          description: Further messages that opt a contact out.
          items:
            type: string
    WhatsappSettingsUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        opt_out_keyword_exceptions:
          type: array
          items:
            type: string
        opt_out_phrases:
          type: array
          items:
            type: string
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              description: |
                Machine-readable context. `field` names the request member,
                parameter or header at fault; `reason` narrows `unprocessable`,
                and `forbidden` for a verified person with no seat (`no_seat`),
                whose active membership could not be confirmed (`membership_unclassified`), or
                whose company has no usable account (`account_required`, `account_suspended`).
              properties:
                field:
                  type: string
                reason:
                  type: string
                recovery:
                  type: string
                  enum:
                  - retry_same_idempotency_key
                  - read_resource
                  - reconcile_tag_membership
                  description: Required for write_outcome_unknown. Follow the operation-specific recovery
                    before attempting another write.
                required_permission:
                  $ref: '#/components/schemas/Permission'
                missing:
                  type: string
                  enum:
                  - enablement
                  - price
                  description: On `whatsapp_not_enabled`, what the account lacks. An operator enables
                    WhatsApp for the account, and the account needs a WhatsApp price.
                limit:
                  type: integer
                  description: On a send refused by an iMessage line's limit, the line's configured value
                    for it. For `line_response_rate`, the floor as a whole percentage.
                used:
                  type: integer
                  description: How much of `limit` is used. For `line_response_rate`, the line's current
                    rate as a whole percentage.
                retry_after_seconds:
                  type: integer
                  description: Seconds until the limit frees, equal to `Retry-After`. Absent for `line_response_rate`.
              additionalProperties: true
    ErrorCode:
      type: string
      description: |
        The catalogue of error codes, with the status each is sent with.

        | Code | Status | Meaning |
        | --- | --- | --- |
        | `invalid_request` | 400 | The request is malformed: bad JSON, an unknown or mistyped member, a bad parameter or header. |
        | `unauthenticated` | 401 | No credential, or one that does not verify. |
        | `insufficient_funds` | 402 | The balance cannot cover the price, or debt is outstanding. |
        | `forbidden` | 403 | The account, resource or deployment refuses this operation. |
        | `permission_denied` | 403 | The credential lacks the named permission. See `details.required_permission`. |
        | `not_found` | 404 | No such route, or no such resource in this account. |
        | `method_not_allowed` | 405 | The route exists and does not take this method. |
        | `conflict` | 409 | The resource is not in a state that allows the change. |
        | `idempotency_conflict` | 409 | The `Idempotency-Key` was used for a different request. |
        | `payload_too_large` | 413 | The request body is over the limit. |
        | `unsupported_media_type` | 415 | The body is not `application/json`. |
        | `unprocessable` | 422 | The request is well formed and cannot be carried out; `details.reason` says why. |
        | `unsupported` | 422 | The member or value is defined and not available yet. |
        | `rate_limited` | 429 | Too many requests; wait `Retry-After` seconds. |
        | `internal` | 500 | An unexpected failure. |
        | `unavailable` | 503 | A dependency is unavailable or the request ran out of time; retry. |
        | `upstream_unavailable` | 503 | The resource service is unavailable. Wait the number of seconds in Retry-After. |
        | `write_outcome_unknown` | 503 | The owner may have committed. Follow details.recovery. Retry-After is omitted. |
      enum:
      - invalid_request
      - unauthenticated
      - insufficient_funds
      - forbidden
      - permission_denied
      - not_found
      - method_not_allowed
      - conflict
      - idempotency_conflict
      - payload_too_large
      - unsupported_media_type
      - unprocessable
      - unsupported
      - rate_limited
      - internal
      - unavailable
      - upstream_unavailable
      - write_outcome_unknown
    Money:
      type: object
      required:
      - amount_micro_usd
      - currency
      additionalProperties: false
      properties:
        amount_micro_usd:
          type: integer
          format: int64
          description: Millionths of a US dollar. 1 USD is 1000000.
        currency:
          type: string
          const: USD
      example:
        amount_micro_usd: 7900
        currency: USD
    MessageSender:
      type: string
      minLength: 1
      maxLength: 16
      description: 'Who a message is from. On a message you send it is your own number in E.164 form.
        On a received message it is the sender exactly as the carrier named it, in one of three forms:
        an E.164 phone number of any country (`+442071838750`), a short code of 3 to 8 digits with no
        plus sign (`25392`), or an alphanumeric sender ID of up to 11 letters, digits and spaces (`MyBank`).
        Compare it as a string and do not assume it is a phone number. A message cannot be sent to a short
        code or an alphanumeric sender.'
      example: '+14155550100'
    PhoneNumber:
      type: string
      description: A phone number in E.164 form.
      pattern: ^\+[1-9][0-9]{6,14}$
      example: '+14155550100'
    HttpMethod:
      type: string
      enum:
      - GET
      - POST
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    NullableTimestamp:
      type:
      - string
      - 'null'
      format: date-time
    Channel:
      type: string
      enum:
      - sms
      - mms
      - voice
      - imessage
    Me:
      type: object
      required:
      - id
      - name
      - status
      - type
      - parent_id
      - credential
      - permissions
      - capabilities
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          description: The account the request acts in.
        name:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        type:
          type: string
          enum:
          - root
          - subaccount
        parent_id:
          type:
          - string
          - 'null'
          description: The parent account's ID, for a subaccount.
        credential:
          type: object
          required:
          - type
          - id
          additionalProperties: false
          properties:
            type:
              type: string
              description: |
                `api_key` for an `SK…` key and for an existing Sendblue API
                key, `account_token` for the account's token, `person` for a
                session.
              enum:
              - api_key
              - account_token
              - person
            id:
              type: string
              description: The key or account ID, or the person's user ID.
        user:
          description: The signed-in person. Present for a session only.
          $ref: '#/components/schemas/User'
        permissions:
          $ref: '#/components/schemas/Permissions'
        capabilities:
          type: array
          description: |
            The resource groups this credential can use on this deployment.
            A group is listed when its routes are live and available to the
            credential. `balance` grants the balance read. `billing` also
            grants access to the billing journal. Contacts, tags, variables and
            workflows appear for grants with available routes in the root account
            when company resources are available on this deployment. The
            media group covers uploads and reads of uploaded media. Team is listed
            for an eligible root admin session or root account token. Directory reads
            recheck a signed-in admin’s current role. `whatsapp` is listed for a
            credential with a WhatsApp grant once an operator enabled WhatsApp for
            this exact account and the account resolves a WhatsApp rate.
          items:
            type: string
            enum:
            - messages
            - numbers
            - brands
            - campaigns
            - prices
            - operations
            - contacts
            - tags
            - variables
            - workflows
            - calls
            - recordings
            - balance
            - billing
            - keys
            - subaccounts
            - top_ups
            - webhooks
            - media
            - team
            - whatsapp
        created_at:
          $ref: '#/components/schemas/NullableTimestamp'
    AccountStatus:
      type: string
      enum:
      - active
      - suspended
      - closed
    Role:
      type: string
      description: |
        What a person may do. `admin` may use `/admin` (keys, subaccounts,
        billing) and create the company's account; `manager` and `member`
        may use everything else. The role comes from the person's Sendblue
        seat: its `admin` and `manager` are these, and its `user` and
        `member` are `member`.
      enum:
      - admin
      - manager
      - member
    User:
      type: object
      required:
      - id
      - email
      - name
      - role
      - accounts
      - accounts_truncated
      additionalProperties: false
      properties:
        id:
          type: string
          description: The person's user ID at the identity provider.
        email:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/Role'
        accounts:
          type: array
          description: |
            The accounts the person may act in: the root account of their
            company and its active subaccounts, in ID order, at most 200.
          items:
            type: object
            required:
            - id
            - name
            - type
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
                enum:
                - root
                - subaccount
        accounts_truncated:
          type: boolean
          description: Whether the company has more accounts than `accounts` lists.
    Account:
      type: object
      required:
      - id
      - name
      - status
      - type
      - created_at
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        type:
          type: string
          enum:
          - root
        created_at:
          $ref: '#/components/schemas/NullableTimestamp'
    AccountCreate:
      type: object
      description: No members. The company comes from the session.
      additionalProperties: false
    MessageDirection:
      type: string
      description: '`outbound_reply` is a message a TwiML reply to an inbound message sent.'
      enum:
      - inbound
      - outbound_api
      - outbound_reply
    MessageStatus:
      type: string
      description: '`unknown` is terminal and means Sendblue could not establish whether the message was
        sent: nothing is charged and the status does not change afterwards. An iMessage line reaches it
        when the device does not report the send before the line''s deadline; an SMS or MMS when the carrier''s
        answer was lost and could not be recovered within 72 hours. An SMS or MMS the carrier accepted
        that gets no delivery report within 72 hours becomes `sent` with a null `sent_at`; a later report
        still moves it to `delivered`, `undelivered` or `failed`.'
      enum:
      - scheduled
      - queued
      - sending
      - sent
      - delivered
      - undelivered
      - failed
      - canceled
      - received
      - unknown
    Message:
      type: object
      required:
      - id
      - direction
      - status
      - to
      - from
      - campaign_id
      - body
      - media_urls
      - segments
      - price
      - error_code
      - status_callback
      - created_at
      - updated_at
      - sent_at
      additionalProperties: false
      properties:
        delivery_evidence:
          type: string
          enum:
          - verified
          - unknown
          - reported
          - reported_unconfirmed
          description: Evidence that an iMessage line sent the message. `verified` is the strongest evidence,
            read from the sending device's own record. `reported` means the device's authenticated report
            was corroborated by a second check. `reported_unconfirmed` means the report lacks that corroboration.
            The message status separately records recipient delivery.
        billing_status:
          type: string
          enum:
          - held
          - charged
          - uncharged
          - review
          description: The reservation is held, captured, released without charge, or awaiting review
            by Sendblue after a late affirmative report, a report that names another service after the
            charge, or a report that a message accepted as iMessage only went out by another service (nothing
            is charged for that message).
        channel:
          type: string
          enum:
          - imessage
          - sms
          - rcs
          description: The service the device reported for a sent or received message on an iMessage line.
            Absent until known, and absent on other kinds of sender. The values are imessage, sms, and
            rcs; RCS is produced when the Mac reports RCS. A line that may fall back prices SMS and RCS
            by its device SMS route, with the quoted segment quantity. iMessage settles once delivered
            or read or after the settling time; until then billing_status is held. A message admitted
            as iMessage only but reported sent by SMS or RCS still names that channel and keeps its sent
            or delivered status. Its uncharged hold is released without a charge; an earlier capture remains
            and is flagged for review. Checked messages are also flagged for review. Message webhook events
            carry the same channel.
        failure:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          description: Why the message failed, where the cause is one the account can act on. Present
            with `error_code` on a `failed` message, on reads and in the `message.failed` event. `imessage_strict_mode_unenforceable`
            (`error_code` 5504) means the line is in strict iMessage mode and its device cannot enforce
            iMessage-only delivery, so nothing was sent. The line's delivery mode must be changed by the
            operator (Sendblue) before the line can send. `recipient_not_on_imessage` (`error_code` 5505)
            means the message could only be sent as an iMessage (it has a `send_style`, or a body longer
            than an SMS may be) and the line's device found that the recipient is not on iMessage, so
            nothing was sent or charged. `imessage_availability_unknown` (`error_code` 5506) means the
            device could not confirm that the recipient is on iMessage, so nothing was sent or charged;
            the same request with a new `Idempotency-Key` may succeed later.
          properties:
            code:
              type: string
              enum:
              - imessage_strict_mode_unenforceable
              - recipient_not_on_imessage
              - imessage_availability_unknown
            message:
              type: string
        read_at:
          $ref: '#/components/schemas/Timestamp'
          description: When Sendblue received the sending device's first report that the recipient read
            the message. The device reports only that the message was read, not when, so this is the time
            of receipt of that report and not the time of reading. Present only on a message sent from
            an iMessage line whose recipient shares read receipts. It is set once and never moves. The
            status stays delivered.
        unavailable_media:
          type: array
          minItems: 1
          description: Attachments an iMessage line received with this inbound message and did not keep,
            in the order they appeared in the message. The text and every other attachment are delivered
            as usual, and `media_urls` lists only the attachments that were kept. Absent when every attachment
            was kept. `message.received` carries the same value.
          items:
            type: object
            required:
            - reason
            - content_type
            - size
            additionalProperties: false
            properties:
              reason:
                type: string
                enum:
                - unsupported_type
                - too_large
                - too_many
                description: '`too_large`: the file is over 4 MB, or the kept files of the message would
                  pass 16 MB together. `unsupported_type`: the file is not JPEG, PNG, GIF, HEIC, HEIF,
                  MP4, MP3, PDF, a voice note (CAF) or a contact card (vCard). `too_many`: the message
                  already has 10 kept attachments.'
              content_type:
                type:
                - string
                - 'null'
                description: The type the sending device declared for the file, when it declared one.
              size:
                type: integer
                minimum: 0
                description: Size of the file in bytes.
        send_style:
          $ref: '#/components/schemas/SendStyle'
          description: The iMessage effect the message was sent with. Present only on a message that asked
            for one. It is what was asked of the sending device; the device does not report back whether
            the effect was shown. Message webhook events do not carry it.
        id:
          type: string
        direction:
          $ref: '#/components/schemas/MessageDirection'
        usage:
          $ref: '#/components/schemas/MessageUsage'
        status:
          $ref: '#/components/schemas/MessageStatus'
        to:
          description: The recipient. Null on a message sent to a group, which has `group_id`.
          oneOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        group_id:
          type: string
          description: |
            Present on a message sent to a group chat: the Group it was sent
            to. Such a message reports `delivered` for the chat as a whole,
            not for each participant. Also present on a message received in
            a group chat on an iMessage line: there `from` is the participant
            who sent it and `to` is the line.
        from:
          description: The sender. Null until a campaign has chosen one.
          oneOf:
          - $ref: '#/components/schemas/MessageSender'
          - type: 'null'
        campaign_id:
          type:
          - string
          - 'null'
          description: The campaign the message was sent through, if one was named.
        body:
          type: string
          description: Empty after redaction.
        media_urls:
          type: array
          description: Ordered attachment URLs. Outbound messages retain the submitted URLs. Each attachment
            of an inbound message links to `GET /messages/{message_id}/media/{media_id}` on this host,
            which requires the owning account's credentials.
          items:
            type: string
            format: uri
        media:
          type: array
          minItems: 1
          description: The kept attachments of a received message, in the order of `media_urls`. Present
            on reads of an inbound message that has attachments; absent otherwise, on outbound messages
            and in webhook events.
          items:
            type: object
            required:
            - id
            - url
            - content_type
            - size
            additionalProperties: false
            properties:
              id:
                type: string
                description: The attachment's identifier, the last segment of its link.
              url:
                type: string
                format: uri
                description: The same link as in `media_urls`.
              content_type:
                type:
                - string
                - 'null'
                description: The type the carrier or the sending device declared for the file. Null when
                  it declared none.
              size:
                type:
                - integer
                - 'null'
                minimum: 1
                description: Size of the file in bytes, where the carrier signed one with the message.
                  Null otherwise, including for attachments received on an iMessage line.
        segments:
          type:
          - integer
          - 'null'
          description: SMS segments, once known.
        price:
          description: What the message cost, once settled.
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        error_code:
          type:
          - integer
          - 'null'
          description: The failure class of a `failed` or `undelivered` message.
        status_callback:
          type:
          - string
          - 'null'
          format: uri
          description: The per-message URL given when the message was sent, if any. It receives Twilio-style
            form parameters, not the JSON events of a webhook subscription.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        sent_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: When the message was sent. For a message sent from an iMessage line it is the time
            Sendblue received the device's first report that the message was sent or delivered. The device
            reports that it sent the message and not when, so this can be later than the actual send.
            Null on a message that has not been sent.
        reply_to:
          type: object
          required:
          - message_id
          - part
          additionalProperties: false
          description: The message this one is an inline reply to, on an iMessage line. Absent on a message
            that is not a reply. On a received message, `message_id` is the account's message the sender
            replied to, or null when Sendblue never held that message (it was sent from the device itself,
            or it predates the line), and `part` is the part of it replied to, or null when the device
            did not report one. A received reply always hangs from the first message of its thread, so
            when `thread_originator` is present it names the same message. On a sent message it is the
            target the request named. `message.*` events carry the same value.
          properties:
            message_id:
              type:
              - string
              - 'null'
              description: The message replied to.
            part:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 50
              description: The part of that message replied to, zero for its first.
          example:
            message_id: SM11112222333344445555666677778888
            part: 0
        thread_originator:
          type: object
          required:
          - message_id
          - part
          additionalProperties: false
          description: The first message of the reply thread a received message belongs to. Present only
            on a received message whose device reported one. `message_id` is null when Sendblue never
            held that message. `message.received` carries the same value.
          properties:
            message_id:
              type:
              - string
              - 'null'
              description: The message the thread began with.
            part:
              type:
              - string
              - 'null'
              description: Apple's reference to the part of that message the thread hangs from, passed
                through unchanged.
          example:
            message_id: SM11112222333344445555666677778888
            part: 0:0:12
    MessageCreate:
      type: object
      description: Exactly one of `to` and `group_id`.
      oneOf:
      - required:
        - to
      - required:
        - group_id
      additionalProperties: false
      properties:
        to:
          $ref: '#/components/schemas/PhoneNumber'
        group_id:
          type: string
          description: |
            Send to a group chat (`GET /groups`) in place of `to`. The Group
            must be `active`. `from`, when given, must be the Group's line;
            `campaign_id`, `send_at` and `reply_to` are not available.
        from:
          $ref: '#/components/schemas/PhoneNumber'
          description: A number the account owns. Required unless `campaign_id` or `reply_to` is given.
        shared_sms_channel_id:
          type: string
          format: uuid
          description: Require this exact shared SMS line. Provide `from` and omit `campaign_id`.
        campaign_id:
          type: string
          description: Send from this campaign's numbers. With `from`, that number must belong to it.
        body:
          type: string
          maxLength: 18996
          description: |
            Required unless attachments are given. The limit depends on the
            route the sender gives the message, and a longer body is refused
            with `400 invalid_request`, `details.field` `body` and the
            `details.reason` shown, before anything is held or charged:

            - An iMessage line that sends iMessage only: 18,996 characters, and
              49,152 bytes when the body is written as a JSON string
              (`imessage_body_limit`, `imessage_body_bytes_limit`). Text in
              Latin script reaches the character limit first; emoji and CJK
              text reach the byte limit first, at 12,288 four-byte or 16,384
              three-byte characters. The price is the price of one iMessage
              whatever the length.
            - An iMessage line that may send the message as SMS or RCS: 1,600
              characters and ten SMS segments (`sms_fallback_body_limit`).
              Its SMS route is priced per segment, so a longer body is refused
              and never split into more. Where the line's device can check
              the recipient, a longer text with no attachment is accepted
              instead, up to the iMessage limits above, as iMessage or fail:
              it is sent as one iMessage at the price of one iMessage, or it
              ends `failed` (`failure.code` `recipient_not_on_imessage` or
              `imessage_availability_unknown`) with nothing sent or charged.
            - A registered sender or a campaign (SMS and MMS): 1,600
              characters, and ten segments for an SMS, which is 1,530 GSM-7 or
              670 UCS-2 characters (`carrier_body_limit`, `sms_segment_limit`).
        media_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          description: Public https URLs of attachments. Sends the message as MMS.
        media_ids:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: Uploads owned by this account, in delivery order. Use these or media_urls. An iMessage
            line accepts one upload per message, with or without text, and no `media_urls` link. A send
            with two uploads or with a link is refused with the `details.reason` value `media_unsupported`.
            A voice note (an `audio/x-caf` upload) is sent alone, so with a non-empty `body` it is `422
            unprocessable` naming `body`, `details.reason` `voice_note_with_body`. A voice note or contact
            card (`text/vcard`) from a carrier number or campaign is `422 unprocessable` naming `media_ids`,
            `details.reason` `media_unsupported_by_sender`. It is charged the iMessage message price like
            a text. An upload must remain readable when the transport retrieves it.
        status_callback:
          type: string
          format: uri
          description: A public https URL that receives the message's status changes as Twilio-style form
            parameters (`application/x-www-form-urlencoded`, with `MessageSid`, `MessageStatus` and the
            rest), signed with `X-Twilio-Signature` using the account token. It is a compatibility mechanism.
            For JSON events signed with `X-Sendblue-Signature`, register a webhook with `POST /admin/webhooks`
            instead. The two are independent, and a transition can notify both.
        send_at:
          type: string
          format: date-time
          description: Send later, between 15 minutes and 35 days from now. Needs `campaign_id`.
        validity_period_seconds:
          type: integer
          minimum: 1
          maximum: 36000
          description: Fail the message if it has not been handed to the carrier or the device in this
            time. The default is 36000.
        max_price_micro_usd:
          type: integer
          format: int64
          minimum: 1
          description: Refuse the message if it would cost more than this.
        content_retention:
          type: string
          enum:
          - retain
          - discard
          default: retain
          description: With `discard`, the body is erased from the stored message once the send has settled;
            the message then reads with an empty `body`. A retry with the same `Idempotency-Key` and the
            original request still returns the same message.
        reply_to:
          type: object
          required:
          - message_id
          additionalProperties: false
          description: Send the message as an inline reply to a message in the same conversation. iMessage
            lines only. See `POST /messages`.
          properties:
            message_id:
              type: string
              description: The account's message to reply to. One it received on this line from `to`,
                or one it sent from this line to `to`.
            part:
              type: integer
              minimum: 0
              maximum: 50
              default: 0
              description: The part of that message to reply to, zero for its first. A message with text
                and one attachment has two parts.
        send_style:
          $ref: '#/components/schemas/SendStyle'
          description: Send the text with this iMessage effect. Needs `from` to be an iMessage line that
            sends iMessage only, and a `body` without attachments. Refused anywhere the message could
            go out as SMS, RCS or through a carrier, where the effect would be lost.
    SendStyle:
      type: string
      enum:
      - celebration
      - shooting_star
      - fireworks
      - lasers
      - love
      - confetti
      - balloons
      - spotlight
      - echo
      - invisible
      - gentle
      - loud
      - slam
      description: An iMessage effect, by the names of the existing Sendblue API. The first nine play
        over the whole conversation (`celebration` is sparkles, `love` a heart, `balloons` the birthday
        balloons). `invisible` (invisible ink), `gentle`, `loud` and `slam` animate the message bubble.
    ReactionCreate:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - love
          - like
          - dislike
          - laugh
          - emphasize
          - question
          - emoji
        emoji:
          type: string
          description: Exactly one fully qualified emoji. Required when `kind` is `emoji`, refused otherwise.
        part:
          type: integer
          minimum: 0
          maximum: 31
          default: 0
          description: Which part of the message the reaction is on.
    Reaction:
      type: object
      description: |
        A tapback this account asked a line's device to add or remove.
        Reactions received from a contact are not delivered as Reactions yet.
      required:
      - id
      - direction
      - status
      - message_id
      - part
      - action
      - kind
      - emoji
      - text
      - from
      - to
      - channel
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^RX[0-9a-f]{32}$
        direction:
          type: string
          enum:
          - outbound
        status:
          type: string
          enum:
          - queued
          - sent_unconfirmed
          - failed
          description: |
            `queued`: waiting for the line's device, for at most five minutes.
            `sent_unconfirmed`: handed to the device, which confirms nothing
            for a reaction; final. `failed`: not handed to the device; final.
        failure_reason:
          type: string
          enum:
          - device_offline
          - not_sent
          - recipient_opted_out
          description: Present when `status` is `failed`.
        message_id:
          type: string
          description: The message reacted to.
        part:
          type: integer
        action:
          type: string
          enum:
          - added
          - removed
        kind:
          type: string
          enum:
          - love
          - like
          - dislike
          - laugh
          - emphasize
          - question
          - emoji
        emoji:
          type:
          - string
          - 'null'
          description: Set when `kind` is `emoji`.
        text:
          type: 'null'
          description: Reserved for the sentence a device reports for a received reaction.
        from:
          $ref: '#/components/schemas/PhoneNumber'
        to:
          $ref: '#/components/schemas/PhoneNumber'
        channel:
          type: string
          enum:
          - imessage
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    MessageUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        status:
          type: string
          const: canceled
        body:
          type: string
          const: ''
    MessageList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type:
          - string
          - 'null'
    Group:
      type: object
      description: A group chat one of the account's iMessage lines is in.
      required:
      - id
      - number
      - name
      - participants
      - channel
      - status
      - first_message_id
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          description: '`GR` and 32 hexadecimal digits. It does not change when the name or the participants
            do.'
        number:
          $ref: '#/components/schemas/PhoneNumber'
          description: The account's line that is in the group.
        name:
          type:
          - string
          - 'null'
        participants:
          type: array
          description: The verified outbound members, in order. The line itself is not listed. An inbound-only
            unknown Group has no verified outbound members.
          items:
            $ref: '#/components/schemas/PhoneNumber'
        observed_participants:
          type:
          - array
          - 'null'
          description: Latest inbound roster observation, never permission to send. May include email
            addresses. Null when none has been accepted.
          items:
            type: string
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Native occurrence time of the latest inbound roster observation, including a no-op
            observation.
        observed_sender_in_roster:
          type:
          - boolean
          - 'null'
          description: Whether that observation includes its reported sender. False observations preserve
            incoming content but do not authorize outbound recipients.
        channel:
          description: What the chat runs on. Null until the device has reported it.
          type:
          - string
          - 'null'
          enum:
          - imessage
          - sms
          - rcs
          - null
        status:
          type: string
          enum:
          - creating
          - active
          - left
          - failed
          - unknown
          description: |
            `creating` until the first message has an outcome. `active` takes
            messages. `failed`: the first message failed and no chat exists.
            `unknown`: the device never named the chat, or later reported
            that it no longer has it, or inbound evidence has not verified its
            outbound audience; the Group takes no messages. `left`:
            the line is no longer in the chat.
        first_message_id:
          type:
          - string
          - 'null'
          description: The message the Group was created with.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    GroupCreate:
      type: object
      required:
      - from
      - participants
      - message
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/PhoneNumber'
          description: An iMessage line of the account.
        participants:
          type: array
          description: The other members. US numbers, each once, without the line's own.
          minItems: 2
          maxItems: 31
          items:
            $ref: '#/components/schemas/PhoneNumber'
        name:
          type: string
          minLength: 1
          maxLength: 512
        message:
          type: object
          description: The first message. A `body`, `media_ids`, or both.
          additionalProperties: false
          properties:
            body:
              type: string
              maxLength: 18996
              description: As long as a message of the line may be; see `MessageCreate.body`.
            content_retention:
              type: string
              enum:
              - retain
              - discard
              default: retain
              description: As on `POST /messages`. With `discard`, the body is erased from the stored
                message once the send has settled.
            media_ids:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: string
    GroupList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_cursor:
          type:
          - string
          - 'null'
    NumberUsage:
      type: object
      additionalProperties: false
      required:
      - phone_number
      - sampled_at
      - status
      - limits
      properties:
        phone_number:
          type: string
        sampled_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - available
          - paused
          - unavailable
        new_contact_lookback_days:
          type: integer
          minimum: 1
          maximum: 365
        limits:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
            - rule
            - enforced
            - limit
            - used
            - used_is_lower_bound
            - remaining
            - window_started_at
            - resets_at
            properties:
              rule:
                type: string
                enum:
                - line_daily_conversations
                - line_hourly_new_recipients
                - line_daily_new_recipients
              enforced:
                type: boolean
              limit:
                type:
                - integer
                - 'null'
                minimum: 0
              used:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 10000
              used_is_lower_bound:
                type: boolean
              remaining:
                type:
                - integer
                - 'null'
                minimum: 0
              window_started_at:
                type: string
                format: date-time
              resets_at:
                type:
                - string
                - 'null'
                format: date-time
    Number:
      type: object
      required:
      - id
      - phone_number
      - friendly_name
      - source
      - channels
      - capabilities
      - sms
      - campaign_id
      - price
      - monthly_price
      - voice_url
      - voice_method
      - voice_fallback_url
      - voice_fallback_method
      - status_callback
      - status_callback_method
      - created_at
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - 'null'
          description: The number's ID. `null` for a registered number, which has none.
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        friendly_name:
          type: string
          description: The number as it is usually written. Setting a name of your own is planned.
        source:
          type: string
          description: |
            How the account came to have the number. `requested`: an enrolled retained line
            fulfilled against an iMessage number request. `purchased`: bought
            through this API (or the Twilio-compatible one). `registered`: a
            number the company already held, registered for the account by
            Sendblue. A registered number sends and receives like any other
            and is read-only here: it has no ID, creation time or
            configuration, and is not changed or released through this API.
          enum:
          - purchased
          - requested
          - registered
        channels:
          type: array
          description: |
            What the number's kind can be used for: `sms`, `mms` and `voice`
            for a purchased carrier number; for a registered carrier number
            `sms` and `mms` when it is a message sender and `voice` when it
            is enabled for calls; `imessage` for an iMessage line. It is not a per-number
            measurement; `capabilities` says what the number can do now.
          items:
            $ref: '#/components/schemas/Channel'
        capabilities:
          type: object
          description: What the number can do now.
          required:
          - messages
          - calls
          additionalProperties: false
          properties:
            messages:
              type: boolean
              description: |
                Whether a message can be sent from the number. A purchased
                number can once its 10DLC campaign is approved and the
                carrier has confirmed the number's assignment to it; a
                registered carrier sender needs both the ready flag and a matching
                enabled carrier route. A retained device uses its sender flag.
            calls:
              type: boolean
              description: Whether the number is enabled for calls.
        voice_url:
          type:
          - string
          - 'null'
          format: uri
          description: Where the TwiML for an incoming call is fetched.
        voice_method:
          oneOf:
          - $ref: '#/components/schemas/HttpMethod'
          - type: 'null'
        voice_fallback_url:
          type:
          - string
          - 'null'
          format: uri
        voice_fallback_method:
          oneOf:
          - $ref: '#/components/schemas/HttpMethod'
          - type: 'null'
        status_callback:
          type:
          - string
          - 'null'
          format: uri
          description: Receives the status of incoming calls.
        status_callback_method:
          oneOf:
          - $ref: '#/components/schemas/HttpMethod'
          - type: 'null'
        campaign_id:
          type:
          - string
          - 'null'
          description: The assigned campaign's ID. Null for unassigned, registered, and requested numbers.
        sms:
          $ref: '#/components/schemas/NumberSms'
        price:
          description: The settled acquisition price, or null for a number with no retail purchase.
          oneOf:
          - $ref: '#/components/schemas/Price'
          - type: 'null'
        monthly_price:
          description: The account's current monthly rate for a settled retail purchase. Null for requested
            and registered numbers, an acquisition without a retail purchase record, or an account without
            a monthly rate.
          oneOf:
          - $ref: '#/components/schemas/Price'
          - type: 'null'
        created_at:
          description: When the number was bought or the iMessage request was fulfilled. `null` for a
            registered number.
          $ref: '#/components/schemas/NullableTimestamp'
    NumberConfigurationSnapshot:
