                $ref: '#/components/schemas/QueueList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `calls:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /queues/{queue_id}:
    parameters:
