  /campaigns/{campaign_id}:
    parameters:
    - name: campaign_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCampaign
      tags:
      - campaigns
      summary: Read one campaign.
      responses:
        '200':
          description: The campaign.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `campaigns:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateCampaign
      tags:
      - campaigns
      summary: Turn automatic campaign renewal on or off.
      description: |
        Records the preference for this account's campaign. Read
        `auto_renewal_requested` for the requested setting, `auto_renewal`
        for carrier confirmation, and `renewal_status` for progress. Repeat
        the same preference safely. The existing paid term remains usable
        after opt-out. Opt-in requires the monthly offer listed by `GET /prices`.
        A malformed preference returns 400, an invalid credential returns 401,
        an unauthorized acting account returns 403, an absent or foreign
        campaign returns 404, and an ineligible campaign returns 409.
        A missing monthly offer returns 422 with reason
        `renewal_not_offered`. Unsupported fields return 400.

        Example 422 response:

        ```json
        {"error":{"code":"unprocessable","message":"This account has no monthly price for this campaign use case","details":{"field":"auto_renewal","reason":"renewal_not_offered"}}}
        ```

        Required permission: `campaigns:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdate'
            example:
              auto_renewal: false
      responses:
        '200':
          description: The campaign with the persisted renewal request and latest carrier observation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCampaign
      tags:
      - campaigns
      summary: Permanently deactivate an empty campaign at the registry.
      description: |
        Registry deletion cannot be undone. No registration or monthly fee is refunded.
        Remove assigned and pending numbers first. Turn off auto-renewal and allow any
        committed charges to settle. The account retains its numbers and billing history.
        The worker verifies carrier identity and sends at most one deletion. Repeat this
        request safely or read the campaign to see the result. The response and each
        campaign.updated event include the deactivation status, irreversibility and refund policy.

        Example deactivation after acceptance: `{"status":"pending","irreversible":true,"fees_refundable":false}`.
        A request body or query parameters return 400. Returns 401 for invalid credentials, 403 for insufficient permission, and 404 for
        an absent or foreign campaign. A 422 gives one of the reasons `numbers_attached`,
        `renewal_unsettled`, or `campaign_not_submitted`.

        Required permission: `campaigns:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '202':
          description: The request is queued or awaiting carrier confirmation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '200':
          description: The campaign with its confirmed, refused or review outcome.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
