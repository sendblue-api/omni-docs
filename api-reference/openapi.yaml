          type:
          - string
          - 'null'
        start_conference_on_enter:
          type: boolean
        end_conference_on_exit:
          type:
          - boolean
          - 'null'
          description: Null while a change to it the carrier has not confirmed is in flight.
        queue_time_ms:
          type:
          - integer
