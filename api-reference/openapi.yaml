      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: muted
        in: query
        schema:
          type: boolean
      - name: hold
        in: query
        schema:
          type: boolean
      - name: coaching
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: One page of participants.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantList'
        default:
          $ref: '#/components/responses/Error'
  /conferences/{conference_id}/participants/{participant}:
    parameters:
    - $ref: '#/components/parameters/ConferenceId'
    - name: participant
      in: path
      required: true
      description: The participant's call ID (`CA…`) or its label.
