      description: |
        Changes a participant that has joined. Any members may be combined.
        The response is the participant as it was when the change was
        recorded; the change takes effect asynchronously, and reads show it
        once the carrier has confirmed it. A participant that has not joined
        yet answers `404 not_found`; one that is leaving, or that has a
        contradictory change in flight, answers `409 conflict`.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
