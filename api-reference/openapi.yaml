          $ref: '#/components/responses/Error'
      description: |
        Required permission: `tags:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateTag
      tags:
      - tags
      summary: Change a tag.
      description: |
        A change that touches many contacts can be applied in separate batches. On write_outcome_unknown, reconcile the catalogue and affected contacts against the old and intended labels before issuing another change.

        Required permission: `tags:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
