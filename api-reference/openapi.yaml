              $ref: '#/components/schemas/CallSiprecStart'
            example:
              connector_name: Support
              name: audit
              track: both_tracks
      responses:
        '201':
          description: The session was accepted and is being connected.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSession'
              example:
                id: SR0123456789abcdef0123456789abcdef
                call_id: CA0123456789abcdef0123456789abcdef
                name: audit
                status: in_progress
                updated_at: '2026-11-24T18:00:00.000000Z'
        default:
          $ref: '#/components/responses/Error'
  /calls/{call_id}/siprec/{session}:
