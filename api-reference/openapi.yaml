        quantity: 1
        area_code: '415'
        note: San Francisco preferred
        price: '15.00'
        status: pending
        phone_numbers: []
        reason: null
        created_at: '2026-11-23T12:00:00.000000Z'
        updated_at: '2026-11-23T12:00:00.000000Z'
    NumberOrderList:
      type: object
      additionalProperties: false
