      - description
      - message_flow
      - sample_messages
      - privacy_policy_url
      - terms_url
      - opt_in_keywords
      - opt_in_message
      - opt_out_keywords
      - opt_out_message
      - help_keywords
      - help_message
      - has_embedded_links
      - has_embedded_phone
      - age_gated
      - direct_lending
      - subscriber_opt_in
      - auto_renewal
      - auto_renewal_requested
      - current_term_ends_at
      - renewal_fund_by
      - renewal_cutoff_missed
      - renewal_notice
      - committed_term_starts_at
      - committed_term_ends_at
      - renewal_commitment_status
      - renewal_status
      - renewal_review_required
      - price
      - monthly_price
      - number_count
      - operation_id
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          description: Also the `campaign_id` of a message and of a number.
        brand_id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        deactivation:
          type:
          - object
          - 'null'
          description: Set when the owner requests permanent registry deletion. A confirmed campaign reports
            expired. `review` means Sendblue must resolve the request. Deactivation carries no refund.
          additionalProperties: false
          required:
          - status
          - irreversible
          - fees_refundable
          properties:
            status:
              type: string
              enum:
              - pending
              - confirmed
              - refused
              - review
            irreversible:
              type: boolean
              enum:
              - true
            fees_refundable:
              type: boolean
              enum:
              - false
          example:
            status: confirmed
            irreversible: true
            fees_refundable: false
        review_stage:
          type:
          - string
          - 'null'
          description: |
            The carrier's own review phase, lower-cased, for example
            `tcr_pending`, `tcr_accepted`, `mno_pending`, `mno_provisioned`.
            Null until the carrier has accepted the submission.
        failure_reasons:
          type: array
          description: Why the campaign is `rejected`, and what to correct. Empty otherwise.
          items:
            $ref: '#/components/schemas/FailureReason'
        use_case:
          type: string
        sub_use_cases:
          type: array
          items:
            type: string
        description:
          type: string
        message_flow:
          type: string
        sample_messages:
          type: array
          items:
            type: string
        privacy_policy_url:
          type: string
        terms_url:
          type: string
        opt_in_keywords:
          type: array
          items:
            type: string
        opt_in_message:
          type:
          - string
          - 'null'
        opt_out_keywords:
          type: array
          description: Registered for every campaign and answered by the carrier; not configurable.
          items:
            type: string
        opt_out_message:
          type: string
        help_keywords:
          type: array
          description: Registered for every campaign; not configurable.
          items:
            type: string
        help_message:
          type: string
        has_embedded_links:
          type: boolean
        has_embedded_phone:
          type: boolean
        age_gated:
          type: boolean
        direct_lending:
          type: boolean
        subscriber_opt_in:
          type: boolean
        auto_renewal:
          type:
          - boolean
          - 'null'
          description: Last carrier-confirmed renewal setting. Null while confirmation is pending for
            a new enrollment. Legacy one-time registrations report false.
        auto_renewal_requested:
          type: boolean
          description: The current renewal instruction. Opt-out, expiry, or an unpaid renewal at the safety
            cutoff turns it off.
        current_term_ends_at:
          description: End of the current term reported by the carrier. Null until supplied.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        renewal_fund_by:
          description: Absolute UTC deadline to cover the fee for the next month. Pinned to the observed
            carrier term. Null until Sendblue knows an applicable deadline.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        renewal_cutoff_missed:
          type: boolean
          description: Sendblue requested opt-out after finding the next monthly fee uncovered at or after
            this term's funding deadline. Read auto_renewal for the last confirmed carrier setting.
        renewal_notice:
          type:
          - string
          - 'null'
          description: Funding deadline, recovery instructions after nonpayment, or the charge and campaign
            end after a late voluntary cancellation. Null when none applies. Captured for campaign.updated
            at the time of the change.
          examples:
          - Fund by 2027-03-16T12:00:00.000000Z or Sendblue will request that auto-renewal be turned off.
            If the fee is already reserved, no additional funds are needed.
          - Sendblue requested that auto-renewal be turned off and is awaiting carrier confirmation. The
            carrier's cancellation cutoff for the term starting 2027-01-31T12:00:00.000000Z has passed.
            You will still be charged for that month when the carrier confirms the new period. The campaign
            is expected to end on 2027-02-28T12:00:00.000000Z.
        committed_term_starts_at:
          description: Start of the next month affected by a late cancellation. Review can identify a
            known term with incomplete billing evidence even when no reservation exists. Null when no
            relevant term was captured.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        committed_term_ends_at:
          description: Expected end of that committed month, one calendar month later in UTC until the
            carrier confirms the actual term. If the carrier confirms it never billed that month, the
            campaign ended at committed_term_starts_at.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        renewal_commitment_status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - billed
          - not_billed
          - review
          - null
          description: Pending retains the existing hold. Billed means Sendblue captured the hold against
            a confirmed new carrier period. Not_billed means confirmed expiry without a renewed month
            released any hold. Review means billing evidence is unresolved. Any existing hold remains
            in place. Null when no late cancellation commitment applies.
        renewal_status:
          type: string
          enum:
          - unavailable
          - false
          - pending
          - scheduled
          - awaiting_funds
          - spend_limit
          - disabling
          - expired
          - review
          description: |
            `unavailable` means there is no monthly offer. `off` means renewal
            is disabled. `pending` awaits carrier confirmation. `scheduled`
            has a renewal scheduled. `awaiting_funds` means the wallet needs
            funding before cutoff. `spend_limit` means the account's spending
            ceiling prevents the renewal hold. Ask the parent account owner
            to review the ceiling before renewal_fund_by. Funding alone
            leaves the ceiling in place. `disabling` awaits carrier confirmation
            of opt-out or nonpayment. `expired` means the term ended.
            `review` means Sendblue must resolve it. The status describes
            the current term. An earlier disputed or unverified charge can
            remain under separate review.
        renewal_review_required:
          type: boolean
          description: True when an earlier renewal still holds wallet funds awaiting matching carrier
            billing evidence. Check this flag alongside the current term's renewal_status.
        price:
          description: The registration fee held for this campaign and charged on submission.
          $ref: '#/components/schemas/Price'
        monthly_price:
          description: The agreed monthly amount for subsequent terms, or the offer on an unenrolled campaign.
            Null when no price is available.
          oneOf:
          - $ref: '#/components/schemas/Price'
          - type: 'null'
        number_count:
          type: integer
          description: How many numbers are assigned to the campaign.
        operation_id:
          type: string
          description: The submission, for `GET /operations/{operation_id}`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: MG0123456789abcdef0123456789abcdef
        brand_id: BN0123456789abcdef0123456789abcdef
        name: Order updates
        status: pending
        review_stage: tcr_accepted
        failure_reasons: []
        use_case: CUSTOMER_CARE
        sub_use_cases: []
        description: Order confirmations and support replies for customers of the shop.
        message_flow: Customers tick an unchecked box at checkout to receive order updates by text.
        sample_messages:
        - Your order 1042 has shipped and arrives on Friday.
        - Thanks for writing in. An agent will reply within one hour.
        privacy_policy_url: https://example.com/privacy
        terms_url: https://example.com/terms
        opt_in_keywords: []
        opt_in_message: null
        opt_out_keywords:
        - STOP
        - STOPALL
        - UNSUBSCRIBE
        - CANCEL
        - END
        - QUIT
        opt_out_message: You are unsubscribed and will receive no more messages.
        help_keywords:
        - HELP
        help_message: 'Synthetic Works support: write to help@example.com.'
        has_embedded_links: false
        has_embedded_phone: false
        age_gated: false
        direct_lending: false
        subscriber_opt_in: true
        auto_renewal: null
        auto_renewal_requested: true
        current_term_ends_at: null
        renewal_fund_by: null
        renewal_cutoff_missed: false
        renewal_notice: null
        committed_term_starts_at: null
        committed_term_ends_at: null
        renewal_commitment_status: null
        renewal_status: pending
        renewal_review_required: false
        price:
          amount: '15.00'
          amount_micro_usd: 15000000
          currency: USD
        monthly_price:
          amount: '10.00'
          amount_micro_usd: 10000000
          currency: USD
        number_count: 0
        operation_id: OP1123456789abcdef0123456789abcdef
        created_at: '2026-11-23T18:04:05.123456Z'
        updated_at: '2026-11-23T18:09:05.123456Z'
    CampaignStatus:
      type: string
      description: |
        Where the campaign stands with the registry and the mobile networks.

        - `pending`: recorded, being submitted, or in review.
        - `approved`: registered and provisioned by the mobile networks.
          Numbers can be assigned to it and send.
        - `rejected`: the carrier refused the submission, or the registry, the
          carrier or a mobile network rejected the campaign
          (`failure_reasons`).
        - `suspended`: the registry suspended the campaign. Its numbers
          cannot send.
        - `expired`: the campaign's term ended. Its numbers cannot send.
      enum:
      - pending
      - approved
      - rejected
      - suspended
      - expired
    CampaignList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        next_cursor:
          type:
          - string
          - 'null'
    CallStatus:
      type: string
      enum:
      - queued
      - ringing
      - in_progress
      - completed
      - busy
      - failed
      - no_answer
      - canceled
    Call:
      type: object
      required:
      - id
      - direction
      - status
      - to
      - from
      - parent_call_id
      - answered_by
      - started_at
      - ended_at
      - duration_seconds
      - price
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        direction:
          type: string
          description: '`outbound_dial` is a leg a `<Dial>` created; its `parent_call_id` names the call
            that dialed it.'
          enum:
          - inbound
          - outbound_api
          - outbound_dial
        status:
          description: Null while the carrier's evidence about the call is contradictory.
          oneOf:
          - $ref: '#/components/schemas/CallStatus'
          - type: 'null'
        to:
          type: string
        from:
          type: string
        parent_call_id:
          type:
          - string
          - 'null'
        answered_by:
          type:
          - string
          - 'null'
          description: The answering-machine detection verdict, when detection was requested.
        stir_verstat:
          type:
          - string
          - 'null'
          enum:
          - TN-Validation-Passed-A
          - TN-Validation-Passed-B
          - TN-Validation-Passed-C
          - TN-Validation-Failed-A
          - TN-Validation-Failed-B
          - TN-Validation-Failed-C
          - null
          description: 'The SHAKEN/STIR result of an incoming call: whether the carrier validated the
            caller''s signed identity, and its attestation level (A, B or C). Read-only. It is taken once,
            from the carrier''s signed report that the call arrived, and is the value sent as `StirVerstat`
            on the call''s TwiML and status requests. Null for an outgoing call, for an incoming call
            whose arrival report carried no validation result and attestation level of A, B or C, and
            while the carrier''s evidence about the call is contradictory. Every read of a call (`GET
            /calls`, `GET /calls/{call_id}`, and the call a write returns) carries the member. The call
            snapshot in a `call.completed` or `call.updated` webhook event does not carry it yet.'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        ended_at:
          $ref: '#/components/schemas/NullableTimestamp'
        duration_seconds:
          type:
          - integer
          - 'null'
        price:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CallCreate:
      type: object
      required:
      - to
      - from
      additionalProperties: false
      properties:
        to:
          $ref: '#/components/schemas/PhoneNumber'
        from:
          $ref: '#/components/schemas/PhoneNumber'
          description: A number the account owns.
        twiml:
          type: string
          maxLength: 4000
          description: The TwiML document to run when the call is answered.
        url:
          type: string
          format: uri
          description: Where to fetch the TwiML document when the call is answered.
        method:
          $ref: '#/components/schemas/HttpMethod'
        fallback_url:
          type: string
          format: uri
        fallback_method:
          $ref: '#/components/schemas/HttpMethod'
        timeout_seconds:
          type: integer
          minimum: 5
          maximum: 120
          description: How long to let the call ring. Default 60.
        time_limit_seconds:
          type: integer
          minimum: 30
          maximum: 14400
          description: The longest the answered call may last. Default 14400.
        caller_id:
          $ref: '#/components/schemas/PhoneNumber'
          description: The number shown to the destination. Must equal `from`, which is what is presented.
        send_digits:
          type: string
          maxLength: 32
          pattern: ^[0-9A-D#*wW]+$
          description: 'Tones sent when the destination answers: digits, `A` to `D`, `#`, `*`, and `w`
            or `W` for a pause. With it, `machine_detection` is ignored.'
        status_callback:
          type: string
          format: uri
        status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        status_callback_events:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - initiated
            - ringing
            - answered
            - completed
        machine_detection:
          type: string
          description: Answering-machine detection. Billed per call when enabled.
          enum:
          - enable
          - detect_message_end
        async_machine_detection:
          type: boolean
          description: Run the document at once and report the verdict to `machine_detection_callback`.
        machine_detection_callback:
          type: string
          format: uri
        machine_detection_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        machine_detection_timeout_seconds:
          type: integer
          minimum: 3
          maximum: 59
        machine_detection_speech_threshold_ms:
          type: integer
          minimum: 1000
          maximum: 6000
          description: The longest greeting still taken for a person. Default 2400. Needs `machine_detection`.
        machine_detection_speech_end_threshold_ms:
          type: integer
          minimum: 500
          maximum: 5000
          description: The silence after a greeting that ends it. Default 1200. Needs `machine_detection`.
        machine_detection_silence_timeout_ms:
          type: integer
          minimum: 2000
          maximum: 10000
          description: The silence at the start of the call that ends detection. Default 5000. Needs `machine_detection`.
        record:
