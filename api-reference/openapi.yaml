    post:
      operationId: rotateWebhookSecret
      tags:
      - admin
      summary: Replace the signing secret and show the new value once.
      description: |
        Use a credential with `webhooks:manage` and a fresh Idempotency-Key. An equal retry returns the
        current endpoint without a secret. The old secret is retired immediately. A request already
        transmitted may arrive with its previous signature. An absent or foreign endpoint returns
        404 not_found. Reusing a rotation key for another endpoint returns 409 idempotency_conflict.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Rotated endpoint with its new secret.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
              example:
                id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                url: https://hooks.acme.com/omni
                events:
                - message.delivered
                enabled: true
                created_at: '2026-11-23T18:04:05.000000Z'
                updated_at: '2026-11-23T18:04:05.000000Z'
                secret: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA
        '200':
          description: Metadata from an equal retry.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
              example:
                id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                url: https://hooks.acme.com/omni
                events:
                - message.delivered
                enabled: true
                created_at: '2026-11-23T18:04:05.000000Z'
                updated_at: '2026-11-23T18:04:05.000000Z'
        default:
          $ref: '#/components/responses/Error'
  /admin/webhooks/{webhook_id}/deliveries:
