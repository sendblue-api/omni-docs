  /admin/callback_endpoints:
    get:
      operationId: listCallbackEndpoints
      tags:
      - admin
      summary: List the destinations of the account's status callbacks and inbound webhooks, with their
        health.
      description: |
        A status callback or inbound webhook URL belongs to a message or a number, not to a
        registration, so its endpoint is the account and the URL's origin (scheme, host and port).
        One appears here the first time a callback is delivered to that origin. Health follows the
        rule of `WebhookEndpointHealth`. Newest first; the newest 200 are listed.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The account's callback destinations.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackEndpointList'
              example:
                data:
                - id: 6f1c2d34-58aa-4c0e-9b1f-0d2e7a4c9b10
                  origin: https://hooks.acme.com
                  health:
                    status: unhealthy
                    reason: continuous_failure
                    unhealthy_at: '2026-11-23T09:12:44.000000Z'
                    consecutive_failures: 41
                    failing_since: '2026-11-22T21:10:02.000000Z'
                    last_success_at: '2026-11-22T21:03:51.000000Z'
                    last_failure_at: '2026-11-23T09:12:44.000000Z'
                    next_probe_at: '2026-11-23T09:22:44.000000Z'
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
  /admin/callback_endpoints/{endpoint_id}/reenable:
    parameters:
    - $ref: '#/components/parameters/CallbackEndpointId'
    post:
      operationId: reenableCallbackEndpoint
      tags:
      - admin
      summary: Declare an unhealthy callback destination fixed so deliveries resume.
      description: |
        The destination's health becomes `healthy` at once and its next failures start a new run.
        Callbacks parked while it was unhealthy stay dead letters: list them at
        `GET /admin/callback_endpoints/{endpoint_id}/dead_letters` and replay them. Re-enabling a
        healthy destination changes nothing and returns it. An absent or foreign destination returns
        404 not_found.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: The destination with its health.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackEndpoint'
              example:
                id: 6f1c2d34-58aa-4c0e-9b1f-0d2e7a4c9b10
                origin: https://hooks.acme.com
                health:
                  status: healthy
                  reason: null
                  unhealthy_at: null
                  consecutive_failures: 0
                  failing_since: null
