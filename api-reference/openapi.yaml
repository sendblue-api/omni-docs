      tags:
      - messages
      summary: Cancel a scheduled message, or redact a message's body.
      description: |
        Exactly one change per request: `{"status": "canceled"}` cancels a
        message that is still `scheduled`; `{"body": ""}` erases the stored
        body of a message that is no longer in flight. Redaction applies to
        any message of the account, sent or received, so that a person's
        words can be erased on request. It cannot be undone. It erases the
        text only: a received message's attachments stay until the message is
        deleted. Only a message the account sent can be canceled.

        Required permission: `messages:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageUpdate'
            examples:
              cancel:
                value:
                  status: canceled
              redact:
                value:
                  body: ''
      responses:
