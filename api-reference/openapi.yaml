      description: |
        A suspended subaccount cannot authenticate or start new work.

        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubaccountUpdate'
            example:
              status: suspended
      responses:
        '200':
          description: The changed subaccount.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subaccount'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: closeSubaccount
      tags:
      - admin
      summary: Permanently close a direct child account.
      description: |
        The active parent closes its child and revokes the child's credentials.
        The child spends from the parent's wallet. Closure transfers no funds.
        The parent can still read the closed account and its posted transactions.
        Repeating the request returns 204. Closure cannot be reversed.
        Active numbers, device lines, pending orders, active campaigns, outstanding
        renewal exposure, open wallet holds or unsettled work return 409 conflict
        with a blocker in error.details.reason. A foreign or root ID returns 404.
        A request body or query parameter returns 400. For example, a 409
        for an open reservation includes `{"reason":"wallet_holds"}` in error.details.

        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
      responses:
        '204':
          description: The child is permanently closed. The response has no body.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /admin/keys:
    get:
      operationId: listKeys
      tags:
      - admin
      summary: List API keys. Secrets are never listed.
      description: |
        Requires `keys:manage` in the acting account.

        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of keys.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKey
      tags:
      - admin
      summary: Create an API key. Its `secret` is shown once, here.
      description: |
        Requires `keys:manage`. A creator may delegate only permissions they
        hold. A delegated key inherits the issuing key's expiry unless the
        request gives it an earlier one. Only an administrator session or
        account token may issue a Standard key with access to the compatible
        API under `/t`. Authenticate with `Authorization: Bearer <id>.<secret>`.
        An identical retry returns the existing key metadata. The secret is
        displayed on the first successful creation only. Replaying the same
        request after revocation returns `404 not_found` and creates no key.

        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        description: Optional. An absent body is an empty object.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreate'
            example:
              name: Message sender
              role: messaging
      responses:
        '200':
          description: Matching issuance replay. The original key metadata excludes its secret.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '201':
          description: The key with its secret.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyWithSecret'
        default:
          $ref: '#/components/responses/Error'
  /admin/keys/{key_id}:
    parameters:
    - name: key_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getKey
      tags:
      - admin
      summary: Read one API key's metadata.
      responses:
        '200':
          description: The key.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
    patch:
      operationId: updateKey
      tags:
      - admin
      summary: Relabel an API key.
      description: |
        Requires `keys:manage`. Only the name changes: a key's permissions,
        role and expiry are fixed at issuance, and its secret is never shown
        again. Repeating the request changes nothing more.

        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdate'
            example:
              name: Billing export
      responses:
        '200':
          description: The key with its new name.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
              example:
                id: SKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx01
                name: Billing export
                role: billing_read
                permissions:
                - billing:read
                - me:read
                created_by: person:example-user
                expires_at: null
                last_used_at: '2026-11-24T17:58:00.000000Z'
                created_at: '2026-11-23T00:00:00.000000Z'
                updated_at: '2026-11-24T18:04:05.123456Z'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeKey
      tags:
      - admin
      summary: Revoke an API key. It stops authenticating at once.
      responses:
        '204':
          description: Revoked.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `keys:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
  /read_receipts:
    post:
      operationId: createReadReceipt
      tags:
      - messages
      summary: Mark a conversation on an iMessage line as read.
      description: |
        `from` is one of the account's iMessage lines and `to` the contact.
        The whole conversation is marked read, which is what the device does:
        there is no per-message form. The contact sees "Read" under their
        last message when the line sends read receipts for that conversation.

        The request is answered `202` as soon as the command is stored. The
        line's device is then told once. Its client accepts the command and
        never answers it, so the last status is `sent_unconfirmed`: handed to
        the device, with nothing to say whether the conversation was marked.
        The device does nothing when it holds no conversation with `to`.

        A line whose device is not connected answers `409 conflict`
        (`reason: line_offline`) and stores nothing. A stored command waits
        up to 5 minutes for the device (a read receipt is still true a few
        minutes late) and then ends as `expired`; it is never sent after that.

        It is free. A line takes 30 read receipts a minute; more answer
        `429 rate_limited`. A repeated `Idempotency-Key` returns the original
        command and tells the device nothing again.

        Required permission: `messages:send`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadReceiptCreate'
            example:
              from: '+14155550100'
              to: '+14155550101'
      responses:
        '202':
          description: The command was stored for the line's device.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadReceipt'
              example:
                id: RR0123456789abcdef0123456789abcdef
                status: queued
                from: '+14155550100'
                to: '+14155550101'
                failure_reason: null
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
  /read_receipts/{read_receipt_id}:
    parameters:
    - name: read_receipt_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getReadReceipt
      tags:
      - messages
      summary: Read what became of a read receipt.
      description: |
        The command is kept for 30 days after it ends.

        Required permission: `messages:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The read receipt.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadReceipt'
              example:
                id: RR0123456789abcdef0123456789abcdef
                status: sent_unconfirmed
                from: '+14155550100'
                to: '+14155550101'
                failure_reason: null
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:06Z'
        default:
          $ref: '#/components/responses/Error'
  /opt_outs:
    get:
      operationId: listOptOuts
      tags:
      - messages
      summary: List the recipients the account does not send to, in number order.
      description: |
        The recipients the account's own record marks opted out, including
        keywords, API decisions, imported decisions, and legacy line or
        contact blocks copied into that record. A block only a legacy line
        or a company contact mark holds is refused and visible through the
        individual lookup, but is not listed until it is copied into the
        record.

        Required permission: `messages:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of opted-out recipients.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutList'
              example:
                data:
                - number: '+14155550101'
                  opted_out: true
                  source: keyword
                  updated_at: '2026-11-25T18:04:05Z'
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
  /opt_outs/{number}:
    parameters:
    - name: number
      in: path
      required: true
      description: The recipient, a US number in E.164 (`+` may be written `%2B`).
      schema:
        $ref: '#/components/schemas/PhoneNumber'
    get:
      operationId: getOptOut
      tags:
      - messages
      summary: Read whether a recipient has opted out of the account.
      description: |
        `opted_out: true` means every send to the number is refused with
        `422 unprocessable` (`reason: recipient_opted_out`), from every
        iMessage line, number and campaign of the account, and so is a
        message to a group the number is in. A message already queued when
        the recipient opted out fails instead of being sent.

        `source` says what decided it: `keyword` (the recipient's own
        message to an iMessage line or a carrier number of the account),
        `api` (`PUT /opt_outs/{number}`),
        `import` (an operator's legacy import), `line` (a legacy device-line
        STOP), or `contact` (the company's contact mark). A number nothing was ever
        recorded for answers `opted_out: false` with a null `source`; it is
        never a 404.

        On an iMessage line a received text that is exactly `STOP`,
        `STOPALL`, `STOP ALL`, `UNSUBSCRIBE`, `CANCEL`, `OPT OUT`, `REVOKE`,
        `END` or `QUIT` (any case, surrounding spaces ignored, no attachment,
        not even Apple's attachment mark alone) opts its sender out; `START`
        or `UNSTOP` opts the sender back in. The later of two keywords wins.
        No reply is sent for either. A stop word sent to a carrier number is
        recorded here too, and keeps the scope the carrier gives it there
        (the campaign or profile) as well.

        Required permission: `messages:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The recipient's state.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOut'
              example:
                number: '+14155550101'
                opted_out: true
                source: keyword
                updated_at: '2026-11-25T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setOptOut
      tags:
      - messages
      summary: Opt a recipient out of the account, or back in.
      description: |
        `opted_out: true` blocks subsequent sends and recipient-facing device
        controls from this account; `false` opts the number back in. The API
        event uses database time: later events win and blocked wins ties.
        A newer legacy-line STOP or a contact marked again later can block
        again; editing or deleting a contact never does. Against a Dashboard
        contact mark Omni has not seen before and that has no Dashboard time,
        the first `opted_out: false` always answers 200 with `opted_out: true`
        and `source: contact` (that call fixes the mark's time); the next one
        wins. A device frame
        may still be written within two seconds of a check that allowed it;
        already-written frames cannot be recalled. No `Idempotency-Key` is
        required. This operation is free and sends nothing to the recipient.

        Required permission: `messages:send`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptOutSet'
            example:
              opted_out: true
      responses:
        '200':
          description: The recipient's state after the write.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOut'
              example:
                number: '+14155550101'
                opted_out: true
                source: api
                updated_at: '2026-11-25T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
  /typing:
    post:
      operationId: createTyping
      tags:
      - messages
      summary: Show or clear the typing indicator in a conversation on an iMessage line.
      description: |
        `from` is one of the account's iMessage lines and `to` the contact.
        `state: start` shows the typing bubble to the contact for
        `max_duration_ms` (default 60000, at most 300000) or until a `stop`
        or a message is sent; `state: stop` clears it.

        The request is answered `202` as soon as the command is stored. The
        line's device is then told once. Its client accepts the command and
        never answers it, so the last status is `sent_unconfirmed`: handed to
        the device, with nothing to say whether the bubble appeared. The
        device does nothing when it holds no conversation with `to` yet, and
        the indicator is an iMessage feature, so a contact reached over SMS
        or RCS sees nothing.

        A typing indicator is only worth sending now. It is tried once and
        never retried: a command the device has not taken within 10 seconds
        ends as `expired`. A line whose device is not connected answers
        `409 conflict` (`reason: line_offline`) and stores nothing.

        It is free. A line takes 60 typing commands a minute; more answer
        `429 rate_limited`. A repeated `Idempotency-Key` returns the original
        command and tells the device nothing again.

        Required permission: `messages:send`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypingCreate'
            examples:
              start:
                value:
                  from: '+14155550100'
                  to: '+14155550101'
                  state: start
                  max_duration_ms: 15000
              stop:
                value:
                  from: '+14155550100'
                  to: '+14155550101'
                  state: stop
      responses:
        '202':
          description: The command was stored for the line's device.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Typing'
              example:
                id: TY0123456789abcdef0123456789abcdef
                status: queued
                from: '+14155550100'
                to: '+14155550101'
                state: start
                max_duration_ms: 15000
                failure_reason: null
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
  /typing/{typing_id}:
    parameters:
    - name: typing_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getTyping
      tags:
      - messages
      summary: Read what became of a typing command.
      description: |
        The command is kept for 30 days after it ends.

        Required permission: `messages:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The typing command.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Typing'
              example:
                id: TY0123456789abcdef0123456789abcdef
                status: sent_unconfirmed
                from: '+14155550100'
                to: '+14155550101'
                state: start
                max_duration_ms: 15000
                failure_reason: null
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:06Z'
        default:
          $ref: '#/components/responses/Error'
  /operations/{operation_id}:
    parameters:
    - name: operation_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getOperation
      tags:
      - operations
      summary: Read the state of asynchronous work.
      description: |
        The submission of one brand or campaign to the carrier, named by the
        `operation_id` of the brand or campaign. It is `pending` until the
        carrier has answered, `succeeded` once the carrier accepted the
        submission (the fee is charged then), and `failed` when the carrier
        refused it (the fee is released). The registry's review is not part
        of the operation: read it from the resource's `status`.

        A number purchase does not return an operation yet: `POST /numbers`
        answers `201` or `202`, and repeating it reads the outcome.

        Required permission: `operations:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The operation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: OP0123456789abcdef0123456789abcdef
                type: brand.submission
                status: succeeded
                resource:
                  type: brand
                  id: BN0123456789abcdef0123456789abcdef
                error: null
                created_at: '2026-11-23T18:04:05.123456Z'
                updated_at: '2026-11-23T18:04:09.123456Z'
        default:
          $ref: '#/components/responses/Error'
  /prices:
    get:
      operationId: getPrices
      tags:
      - account
      summary: What this account pays for each thing that costs money.
      description: |
        The one place a price is read before it is charged: registering a
        brand or a campaign, buying and keeping a number, a message, a call.
        Each price is the rate this account's next request resolves to. A
        product the account has no rate for is absent, and a request for it
        is refused. The list is not paged; `next_cursor` is always null.

        A price is charged per whole `billing_increment` of `unit`, with at
        least `minimum_increments`: a call priced per 60 seconds is charged
        for each started minute. Conference participant time is priced separately
        for each participant. A composed SMS or MMS item quotes the maximum
        hold for one part in `price`. Its `usage_pricing` gives the base rate or
        estimate, carrier surcharge policy, billing condition and receipt deadline.
        Supply `parts` to preview a quantity without disclosing message text.
        A flat MMS remains one logical message regardless of part count. Unknown or
        repeated keys and out-of-range counts return 400 invalid_request.

        Required permission: `prices:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - in: query
        name: parts
        description: Estimated or known billed parts for one message. Defaults to one in composed offers.
        schema:
          type: integer
          minimum: 1
          maximum: 1600
      responses:
        '200':
          description: Assigned offers in USD. Composed terms and previews are specific to the authenticated
            account.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
              example:
                data:
                - product: brand.registration
                  use_case: null
                  unit: registration
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '4.00'
                    amount_micro_usd: 4000000
                    currency: USD
                - product: campaign.registration
                  use_case: LOW_VOLUME
                  unit: registration
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '15.00'
                    amount_micro_usd: 15000000
                    currency: USD
                - product: campaign.monthly
                  use_case: LOW_VOLUME
                  unit: month
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '0.00'
                    amount_micro_usd: 0
                    currency: USD
                - product: call.conference.participant
                  use_case: null
                  unit: second
                  billing_increment: 60
                  minimum_increments: 1
                  price:
                    amount: '0.004'
                    amount_micro_usd: 4000
                    currency: USD
                - product: message.sms.outbound
                  use_case: null
                  unit: segment
                  billing_increment: 1
                  minimum_increments: 1
                  price:
                    amount: '0.0079'
                    amount_micro_usd: 7900
                    currency: USD
                - product: message.mms.outbound
                  use_case: null
                  unit: part
                  billing_increment: 1
                  minimum_increments: 1
                  pricing_model: composed
                  price:
                    amount: '0.015'
                    amount_micro_usd: 15000
                    currency: USD
                  usage_pricing:
                    base_policy: per_part
                    base_multiplier_bps: null
                    base_estimate_per_part:
                      amount: '0.01'
                      amount_micro_usd: 10000
                      currency: USD
                    base_ceiling_per_part:
                      amount: '0.01'
                      amount_micro_usd: 10000
                      currency: USD
                    surcharge_policy: at_cost
                    surcharge_multiplier_bps: null
                    surcharge_ceiling_per_part:
                      amount: '0.005'
                      amount_micro_usd: 5000
                      currency: USD
                    billability_policy: upstream_charge
                    receipt_wait_seconds: 86400
                    parts: 1
                    estimated_base:
                      amount: '0.01'
                      amount_micro_usd: 10000
                      currency: USD
                    maximum_hold:
                      amount: '0.015'
                      amount_micro_usd: 15000
                      currency: USD
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/signup_links:
    post:
      operationId: createWhatsappSignupLink
      tags:
      - whatsapp
      summary: Create a link that connects a WhatsApp Business number to this account.
      description: |
        `url` is a page of this deployment, valid for 24 hours, that opens
        Meta's signup popup. Open it, or pass it to whoever manages the
        company's Meta business. The person picks or creates a business
        portfolio, a WhatsApp account and a number in Meta's screens.

        When signup finishes, the browser goes to `return_url` with
        `status=connected` and `connection_id`, or shows a plain message when
        there is no `return_url`. Rely on the `whatsapp.signup.completed` and
        `whatsapp.connection.updated` webhooks, not on the redirect.

        `url` is shown once: Omni keeps only a digest of its token. A repeat
        with the same `Idempotency-Key` answers `200` with the link and a null
        `url`. The body is optional.

        Required permission: `whatsapp:connect`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsappSignupLinkCreate'
            example:
              return_url: https://app.example.com/whatsapp/done
      responses:
        '201':
          description: The link, with its `url`.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSignupLinkWithUrl'
              example:
                id: WS0123456789abcdef0123456789abcdef
                url: https://omni-api.sendblue.com/whatsapp/connect/Jt0dXh2v9b7cQm1kR4sW8yZ3aF6gH0jL2nP5qT7uV9w
                status: pending
                return_url: https://app.example.com/whatsapp/done
                expires_at: '2026-11-26T18:04:05Z'
                connection_id: null
                attempts: []
                failure: null
                created_at: '2026-11-25T18:04:05Z'
        '200':
          description: The link this `Idempotency-Key` created, with a null `url`.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSignupLink'
        default:
          $ref: '#/components/responses/Error'
  /whatsapp/signup_links/{signup_link_id}:
