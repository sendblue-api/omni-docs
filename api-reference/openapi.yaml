          $ref: '#/components/responses/Error'
    patch:
      operationId: dequeueQueueMember
      tags:
      - queues
      summary: Take a waiting call out of the queue.
      description: |
        The call leaves the queue and runs the TwiML document at `url`. Its
        `<Enqueue>` `action` is told `QueueResult=redirected`. Both requests
        keep Twilio's parameter names and `X-Twilio-Signature`. A call that
        has already left is `404 not_found`. Answers `422 unsupported` where
        the deployment cannot request customer URLs.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueMemberUpdate'
            example:
              url: https://example.com/next
              method: POST
      responses:
        '200':
          description: The call as it was when it left the queue.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMember'
        default:
          $ref: '#/components/responses/Error'
  /groups:
    post:
      operationId: createGroup
      tags:
      - messages
      summary: Create a group chat on an iMessage line, with its first message.
      description: |
        A group chat cannot be created empty: the chat comes into being with
        its first message, so the request carries one. The Group is `creating`
        until that message has an outcome, then `active` (the message was
        sent and the device named the chat), `failed` (the message failed; no
        chat was made) or `unknown` (the message was sent and the device
        never named the chat: it takes no further messages until an operator
        resolves it). `GET /groups/{group_id}` shows the state, and
        `first_message_id` names the message to follow.

        Creation on a released Mac without verified exact-recipient matching
        answers `422 unsupported` with
        `details.reason: group_creation_unverified_client`, unless an operator
        explicitly allowed creation on that line. The allowance is off by default.

        `from` is an iMessage line of the account and every participant is a
        US number other than the line. The line may have one Group per set of
        participants: a request for a set it already has answers
        `409 conflict` with `details.reason: group_exists` and
        `details.group_id`, because the device would send into that chat and
        not make a second one.

        The first message is priced, held and charged exactly as one message
        of the line: a group iMessage is one iMessage, whatever the number of
        participants. A message that fails before it is sent is not charged.

        A line in strict iMessage mode answers `422 unsupported`
        (`details.reason: strict_imessage_line`): group messages are not
        available on such a line yet.

        On a device running client 1.9.152 the participants may see an empty
        bubble before the first message: that client creates the chat with an
        empty probe message.

        Required permission: `messages:send`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
            example:
              from: '+14155550100'
              participants:
              - '+14155550101'
              - '+14155550102'
              name: Launch
              message:
                body: Welcome to the launch thread
      responses:
        '201':
          description: The Group was created and its first message accepted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: GR0123456789abcdef0123456789abcdef
                number: '+14155550100'
                name: Launch
                participants:
                - '+14155550101'
                - '+14155550102'
                channel: null
                status: creating
                first_message_id: SM0123456789abcdef0123456789abcdef
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listGroups
      tags:
      - messages
      summary: List group chats, newest first.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: number
        in: query
        description: Only groups this line of the account is in.
        schema:
          $ref: '#/components/schemas/PhoneNumber'
      - name: participant
        in: query
        description: Only groups this number is a current participant of.
        schema:
          $ref: '#/components/schemas/PhoneNumber'
      responses:
        '200':
          description: One page of groups.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `messages:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /groups/{group_id}:
    parameters:
    - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      tags:
      - messages
      summary: Read one group chat.
      responses:
        '200':
          description: The Group.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `messages:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateGroup
      tags:
      - messages
      summary: Rename a group chat, or clear its name.
      description: |
        The change is sent to the line's device, which answers whether Apple
        applied it. The response is an Operation: `pending`, then `succeeded`
        (the Group shows the new name and `group.updated` is sent) or
        `failed`. A device that does not confirm in time ends the operation
        `failed` with `error.code: write_outcome_unknown`: the change may
        have been applied, it is never sent again by itself, and the Group
        shows what is true once the device next reports it. The Operation is
        readable for 30 days after it ends.

        Only an `active` iMessage group can be changed. Free; ten renames per
        line per minute.

        Required permission: `messages:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              additionalProperties: false
              properties:
                name:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 512
                  description: The new name. Null clears it.
            example:
              name: Launch day
      responses:
        '202':
          description: The change was accepted for the device.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: OP0123456789abcdef0123456789abcdef
                type: group.rename
                status: pending
                resource:
                  type: group
                  id: GR0123456789abcdef0123456789abcdef
                error: null
                created_at: '2026-11-24T18:04:05Z'
                updated_at: '2026-11-24T18:04:05Z'
        default:
          $ref: '#/components/responses/Error'
  /groups/{group_id}/participants:
