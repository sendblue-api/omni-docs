          $ref: '#/components/schemas/Money'
          description: What new work can be accepted against.
    TransactionType:
      type: string
      description: |
        `funding` adds funds; `reserve` holds the price of accepted work;
        `capture` charges the final price and returns the rest of the hold;
        `release` returns a whole hold; `reversal` takes back reversed
        funding; `number_renewal` is a number's monthly charge.
        `campaign_renewal` is the capture for one campaign renewal period.
      enum:
      - funding
      - reserve
      - capture
      - release
      - reversal
      - number_renewal
      - campaign_renewal
