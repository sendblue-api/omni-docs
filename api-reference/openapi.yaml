          type: boolean
          description: 'Only `false` is available, and it is the default here: the participant joins when
            the call is answered.'
        coaching:
          type: boolean
          description: Join heard only by the participant `call_id_to_coach` names. Requires `call_id_to_coach`.
        call_id_to_coach:
          type: string
        conference_record:
          type: boolean
          description: Record the conference from its start.
        conference_trim:
          type: string
          enum:
          - trim_silence
          - do_not_trim
        conference_status_callback:
          type: string
          format: uri
        conference_status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        conference_status_callback_events:
          type: array
