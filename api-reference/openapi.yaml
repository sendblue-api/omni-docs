        state:
          type: string
          enum:
          - start
          - stop
        max_duration_ms:
          description: With `start` only. How long the indicator shows unless stopped. Default 60000.
          type: integer
          minimum: 1
          maximum: 300000
    Typing:
      type: object
      required:
      - id
      - status
      - from
      - to
      - state
      - max_duration_ms
      - failure_reason
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/DeviceCommandStatus'
        from:
          $ref: '#/components/schemas/PhoneNumber'
        to:
          $ref: '#/components/schemas/PhoneNumber'
        state:
          type: string
          enum:
          - start
          - stop
        max_duration_ms:
          description: Null for a `stop`.
          type:
          - integer
          - 'null'
        failure_reason:
          description: |
            Set when `status` is `expired` (`not_handed_off`) or `failed`
            (`socket_write_failed`, `unencodable`).
          type:
          - string
          - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
