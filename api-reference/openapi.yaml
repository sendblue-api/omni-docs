          type: string
        status:
          $ref: '#/components/schemas/DeviceCommandStatus'
        from:
          $ref: '#/components/schemas/PhoneNumber'
        to:
          $ref: '#/components/schemas/PhoneNumber'
        failure_reason:
          description: |
            Set when `status` is `expired` (`not_handed_off`) or `failed`
            (`socket_write_failed`, `unencodable`).
          type:
          - string
          - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TypingCreate:
