  /calls:
    post:
      operationId: createCall
      tags:
      - calls
      summary: Place an outbound call.
      description: |
        Give the call its instructions as a TwiML document: inline in `twiml`,
        or fetched from `url` when the call is answered. Exactly one of the two
        is required. TwiML documents and every request Sendblue makes to your URLs
        keep Twilio's parameter names and `X-Twilio-Signature`. The price of
        the longest possible call is held from the balance at acceptance.

        Required permission: `calls:create`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallCreate'
            example:
              to: '+14155550101'
              from: '+14155550100'
              twiml: <Response><Say>Hello from Sendblue.</Say></Response>
      responses:
        '201':
          description: The call was accepted and queued for dialing.
          headers:
