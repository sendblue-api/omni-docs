      - channels
      - price
      - monthly_price
      additionalProperties: false
      properties:
        phone_number:
          $ref: '#/components/schemas/PhoneNumber'
        channels:
          type: array
          description: What the carrier says this number can do.
          items:
            $ref: '#/components/schemas/Channel'
        price:
          description: |
            What buying the number costs this account, once. Null when the
            account has no price for a number, and so cannot buy one.
          oneOf:
          - $ref: '#/components/schemas/Price'
