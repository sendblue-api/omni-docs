          minLength: 1
          maxLength: 128
          description: The name of a SIPREC connector configured for the account.
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Unique among the call's running SIPREC sessions.
        track:
          $ref: '#/components/schemas/CallSessionTrack'
          default: inbound_track
        status_callback:
          type: string
          format: uri
        status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
    CallStreamStart:
      type: object
      required:
      - url
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Your WebSocket server, as a `wss://` URL without a query string.
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Unique among the call's running streams.
        track:
          $ref: '#/components/schemas/CallSessionTrack'
          default: inbound_track
        status_callback:
          type: string
          format: uri
        status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        parameters:
          type: object
          description: Up to 99 custom values sent to your server in the stream's `start` message. A name
            and its value together are under 500 characters.
          maxProperties: 99
          additionalProperties:
            type: string
    CallTranscriptionStart:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Unique among the call's running live transcriptions.
        track:
          $ref: '#/components/schemas/CallSessionTrack'
          default: both_tracks
        status_callback:
          type: string
          format: uri
          description: Where the session's events and utterances are sent.
        status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        inbound_track_label:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9]+$
          description: A label for the call's party in the utterances sent.
        outbound_track_label:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9]+$
        language_code:
          type: string
          default: en-US
          description: The spoken language, as a BCP 47 tag.
        transcription_engine:
          type: string
          enum:
          - auto
          - google
          - deepgram
          default: auto
        speech_model:
          type: string
          description: '`telephony` with `google`; `nova-3` (the default) or `nova-2` with `deepgram`.'
          enum:
          - telephony
          - nova-3
          - nova-2
        hints:
          type: string
          description: Words and phrases the speech is likely to hold, separated by commas.
        partial_results:
          type: boolean
          default: false
          description: Also send utterances while they are still being spoken.
        profanity_filter:
          type: boolean
          description: Mask profanity. On by default, and only `google` on one track can do it; `deepgram`
            and `both_tracks` need it `false`.
        enable_automatic_punctuation:
          type: boolean
          description: Punctuate the text. `deepgram` only.
    Media:
      type: object
      required:
      - id
      - content_type
      - size_bytes
      - message_id
      - url
      - created_at
      - expires_at
      additionalProperties: false
      properties:
        id:
          type: string
        content_type:
          type: string
        size_bytes:
          type:
          - integer
          - 'null'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Verified lowercase hex SHA-256 digest of the stored bytes (present on `private`
            media objects).
        filename:
          type:
          - string
          - 'null'
          description: Sanitized filename supplied at upload or by the channel provider (present on `private`
            media objects).
        access:
          type: string
          enum:
          - carrier_link
          - private
          description: Custody and access model. Omitted on legacy `carrier_link` uploads; `private` on
            unified private media objects.
        status:
          type: string
          enum:
          - ready
          description: Current readiness state (present on `private` media objects).
        message_id:
          type:
          - string
          - 'null'
          description: The message the item arrived with, for inbound media.
        url:
          type:
          - string
          - 'null'
          format: uri
          description: For `carrier_link` uploads, a bearer link at the configured public origin (an `audio/x-caf`
            upload is also served ending `.caf` and a `text/vcard` upload ending `.vcf`). For `private`
            media objects, the authenticated content route `GET /media/{id}/content` requiring account
            credentials (`media:read`). Deletion or expiry revokes it.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: 99456418-e03a-484c-b42e-94b998ead0a3
        content_type: image/png
        size_bytes: 2391
        message_id: null
        url: https://api.example.com/v1/UploadedMediaContent/86bd74f1-355a-44c6-ab01-5f42eb480331/file
        created_at: '2026-11-23T12:00:00.000000Z'
        expires_at: '2026-11-23T16:00:00.000000Z'
    ContactFields:
