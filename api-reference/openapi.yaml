                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /conferences:
    get:
      operationId: listConferences
      tags:
      - conferences
      summary: List conferences, newest first.
      description: |
        Lists conferences in one status: `in_progress` unless `status` says
        otherwise. A conference is created by the first participant that
        joins a name, through `<Dial><Conference>` or an invitation, and each
        time a name is used again after it ended it is a new conference with
