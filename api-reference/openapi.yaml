  /calls/{call_id}:
    parameters:
    - $ref: '#/components/parameters/CallId'
    get:
      operationId: getCall
      tags:
      - calls
      summary: Read one call.
      responses:
        '200':
          description: The call.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `calls:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateCall
      tags:
      - calls
      summary: Redirect a call in progress, or end it.
      description: |
        Exactly one change per request. `{"status": "canceled"}` ends a call
        that has not been answered; `{"status": "completed"}` ends it in any
        state; `twiml`, or `url` with an optional `method`, replaces the
        instructions of a call in progress.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallUpdate'
            examples:
              complete:
                value:
                  status: completed
              redirect:
                value:
                  url: https://example.com/next
                  method: POST
      responses:
        '200':
          description: The call after the change was recorded.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCall
      tags:
      - calls
      summary: Delete a finished call's record.
      description: |
        Removes the call from every read and list, and erases the stored
        history of the HTTP requests the call made to your URLs (TwiML
        fetches and callbacks). Only a call that has ended (`completed`,
        `busy`, `failed`, `no_answer` or `canceled`) can be deleted; one
        still in flight answers `409 conflict`. Charges already made and the
        call's recordings are not changed: delete a recording through
        `DELETE /recordings/{recording_id}`. Deletion cannot be undone, and a
        second request answers 404.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /calls/{call_id}/recordings:
    parameters:
    - $ref: '#/components/parameters/CallId'
    get:
      operationId: listCallRecordings
      tags:
      - recordings
      summary: List the recordings of one call.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of recordings.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingList'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
    post:
      operationId: startCallRecording
      tags:
      - recordings
      summary: Start a recording on a call in progress.
      description: |
        Reserves the price of the longest recording the call can still make,
        and queues the start: the recording is returned as `processing` and
        becomes `in_progress` when the carrier has acknowledged it. Every
        member is optional; an absent body records both parties on one
        channel. A status callback is sent in Twilio's form, signed with
        `X-Twilio-Signature`, for `completed` unless
        `status_callback_events` names others.

        A repeat with the same `Idempotency-Key` returns the recording the
        first request started, with the first request's settings. Refusals:
        `409 conflict` when the call is not in progress, when it already has
        a recording running, or when the key started a recording of another
        call; `402 insufficient_funds` when the allowance does not cover it;
        `503 unavailable` when the deployment cannot deliver callbacks.

        Required permission: `recordings:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingStart'
            examples:
              defaults:
                value: {}
              dual:
                value:
                  channels: dual
                  trim: do_not_trim
                  status_callback: https://example.com/recordings
                  status_callback_events:
                  - in_progress
                  - completed
      responses:
        '201':
          description: The recording was accepted and its start queued.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
              example:
                id: RE0123456789abcdef0123456789abcdef
                call_id: CA0123456789abcdef0123456789abcdef
                conference_id: null
                status: processing
                source: StartCallRecordingAPI
                channels: 1
                duration_seconds: null
                price: null
                started_at: null
                created_at: '2026-11-24T18:04:05.123456Z'
                updated_at: '2026-11-24T18:04:05.123456Z'
        default:
          $ref: '#/components/responses/Error'
  /recordings:
    get:
      operationId: listRecordings
      tags:
