        '204':
          description: Deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:write`. Accepted credentials: a signed-in person, an API key, the account token.
  /recordings/{recording_id}/audio:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecordingAudio
      tags:
      - recordings
      summary: Download a completed recording's audio.
      description: |
        Served only to the account's credentials; no link works without them.
        Answers `503 unavailable` where the deployment has no recording storage.

        `channels=1` mixes a two-channel recording down to one channel, in
        either format. `channels=2` serves both channels of a two-channel
        recording. With no value, a call's recording is served with the
        channels it was recorded with, and a conference's recording is served
        as its one-channel mix, also when two channels were recorded: ask for
        `channels=2` to get both.

        A value other than 1 or 2 answers `422 unprocessable` with `channels`
        in `error.details.field` and reason `invalid_channels`. `channels=2`
        for a recording that has one channel, by its record or in its stored
        file, answers the same with reason `channel_layout_unavailable`.

        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - wav
          - mp3
          default: wav
      - name: channels
        in: query
        description: 1 mixes to mono; 2 serves both recorded channels. See the operation for the default.
        schema:
          type: integer
          enum:
          - 1
          - 2
      responses:
        '200':
          description: The audio.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /queues:
    post:
      operationId: createQueue
      tags:
      - queues
      summary: Create a call queue.
      description: |
        A queue holds calls that a TwiML `<Enqueue>` put in it until a
        `<Dial><Queue>`, a `<Leave>`, a hangup or a dequeue takes them out.
        Names are unique in the account: a second queue of the same name is
        `409 conflict`. The `Idempotency-Key` names the queue, so a repeat of
        the request returns the same queue, and the key with another `name` or
        `max_size` is `409 idempotency_conflict`. The comparison is with the
        queue as it is now: a key whose queue was since renamed or resized is
        refused, and one whose queue was deleted creates a new queue.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
