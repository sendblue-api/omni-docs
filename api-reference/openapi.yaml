    BrandStatus:
      type: string
      description: |
        Where the brand stands with the carrier registry.

        - `pending`: recorded, being submitted, or registered and not yet
          verified by the registry.
        - `verified`: the registry verified the business. Campaigns can be
          registered for it.
        - `unverified`: the registry registered the brand and could not
          verify its identity (`failure_reasons`). No campaign can be
          registered for it.
        - `failed`: the carrier refused the submission, or the registry
          failed the registration (`failure_reasons`).
      enum:
      - pending
      - verified
      - unverified
      - failed
    FailureReason:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            For a brand: `submission_rejected`, `registration_failed`,
            `identity_unverified`. For a campaign: `submission_rejected`,
            `registry_rejected`, `carrier_rejected`, `network_rejected`,
            `network_provisioning_failed`.
        message:
          type: string
          description: What happened and what to correct, for people.
    BrandList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        next_cursor:
          type:
          - string
          - 'null'
    CampaignUseCase:
      type: string
      description: |
        The Campaign Registry's standard use cases, as the carrier accepts
        them. `LOW_VOLUME` and `MIXED` declare one to five of the others in
        `sub_use_cases`; the rest declare none. A use case is available to an
        account when `GET /prices` lists a `campaign.registration` price for
        it, and the registry decides whether the brand qualifies for it. The
        registry's special use cases (charity, political, emergency,
        sweepstakes, K-12 education, proxy, social, agents and franchises,
        sole proprietor, carrier exemptions) need vetting that is not
        available here and are refused.
      enum:
      - 2FA
      - ACCOUNT_NOTIFICATION
      - CUSTOMER_CARE
      - DELIVERY_NOTIFICATION
      - FRAUD_ALERT
      - HIGHER_EDUCATION
      - LOW_VOLUME
      - MARKETING
      - MIXED
      - POLLING_VOTING
      - PUBLIC_SERVICE_ANNOUNCEMENT
      - SECURITY_ALERT
    CampaignCreate:
      type: object
      required:
      - brand_id
      - name
      - use_case
      - description
      - message_flow
      - sample_messages
      - privacy_policy_url
      - terms_url
      - opt_out_message
      - help_message
      - has_embedded_links
      - has_embedded_phone
      - subscriber_opt_in
      - terms_accepted
      additionalProperties: false
      properties:
        quote:
          type: object
          additionalProperties: false
          required:
          - submission_micro_usd
          - monthly_micro_usd
          description: Accepted initial and renewal prices in USD microdollars. Requires auto_renewal
            true.
          properties:
            submission_micro_usd:
              type: integer
              format: int64
              minimum: 1
            monthly_micro_usd:
              type: integer
              format: int64
              minimum: 0
        auto_renewal:
          type: boolean
          description: Defaults to on when a monthly price is offered and off otherwise.
        brand_id:
          type: string
          description: A brand whose `status` is `verified`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        use_case:
          $ref: '#/components/schemas/CampaignUseCase'
        sub_use_cases:
          type: array
          description: For `LOW_VOLUME` and `MIXED` only, one to five different standard use cases.
          maxItems: 5
          items:
            $ref: '#/components/schemas/CampaignUseCase'
        description:
          type: string
          description: What the campaign is for and what its messages say.
          minLength: 40
          maxLength: 4096
        message_flow:
          type: string
          description: How recipients opt in, concretely enough for a reviewer to verify.
          minLength: 40
          maxLength: 2048
        sample_messages:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: string
            minLength: 20
            maxLength: 1024
        privacy_policy_url:
          type: string
          format: uri
          maxLength: 255
        terms_url:
          type: string
          format: uri
          maxLength: 255
        opt_in_keywords:
          type: array
          description: Keywords a recipient texts to opt in, when opt-in is by text.
          maxItems: 10
          items:
            type: string
            pattern: ^[A-Za-z0-9]{1,20}$
        opt_in_message:
          type: string
          minLength: 20
          maxLength: 320
        opt_out_message:
          type: string
          description: The reply to an opt-out keyword.
          minLength: 20
          maxLength: 320
        help_message:
          type: string
          description: The reply to `HELP`.
          minLength: 20
          maxLength: 320
        has_embedded_links:
          type: boolean
        has_embedded_phone:
          type: boolean
        age_gated:
          type: boolean
          default: false
        direct_lending:
          type: boolean
          default: false
        subscriber_opt_in:
          type: boolean
          description: The declaration that recipients opt in before they are messaged. Must be true.
          const: true
        terms_accepted:
          type: boolean
          description: Acceptance of the carrier registry's terms for this campaign. Must be true.
          const: true
    CampaignUpdate:
      type: object
      additionalProperties: false
      required:
      - auto_renewal
      properties:
        auto_renewal:
          type: boolean
          description: Whether the customer requests automatic renewal. Opting out after the carrier cancellation
            cutoff keeps an already committed month on hold. The response and campaign.updated give the
            committed dates and expected charge immediately. The carrier setting is confirmed independently.
    Campaign:
      type: object
      required:
      - id
      - brand_id
      - name
      - status
      - review_stage
      - failure_reasons
      - use_case
