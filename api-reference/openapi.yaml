    post:
      operationId: buyNumber
      tags:
      - numbers
      summary: Buy a number found with `GET /numbers/available`.
      description: |
        Costs `number.purchase` in `GET /prices`, held now and charged when
        the carrier confirms the order; `number.monthly` is then charged each
        month from one month after the purchase. `GET /numbers/available`
        shows both beside each number. A number can be bought before any
        campaign exists: it can place and receive calls at once and sends
        SMS only once it is assigned to an approved campaign
        (`/numbers/{phone_number}/campaign`). The carrier order is placed
        once and the response waits for it briefly. A purchase the carrier
        has not confirmed in that time answers `202`; repeat the request to
        read its outcome. A purchase is identified by the account and the
        number: repeating it for the same number, under any
        `Idempotency-Key`, joins the first active order and never places a
        second. With a `quote`, the accepted prices are checked before the
        hold and the original key must be used to read or retry the order.

        Required permission: `numbers:purchase`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberCreate'
            example:
              phone_number: '+14155550100'
      responses:
        '201':
          description: The number is owned.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
        '202':
          description: The purchase is accepted and not yet confirmed by the carrier.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPurchase'
        default:
          $ref: '#/components/responses/Error'
  /numbers/available:
    get:
      operationId: searchAvailableNumbers
      tags:
      - numbers
      summary: Search US local numbers that can be bought.
      description: |
        A live carrier search. It is not paged; `next_cursor` is always null.
        Each result carries what this account would pay to buy it (`price`)
        and to keep it each month (`monthly_price`). Filters can be combined.
        `contains` matches digits in the national number. When `area_code` is
        supplied, it matches only the seven digits following the area code.
        Invalid or repeated parameters return 400 with the field name.

        Required permission: `numbers:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - name: area_code
        in: query
        schema:
          type: string
          pattern: ^[2-9][0-9]{2}$
      - name: locality
        in: query
        description: City name as listed in the carrier inventory.
        schema:
          type: string
          minLength: 1
          maxLength: 100
        example: San Francisco
      - name: contains
        in: query
        description: Consecutive digits, up to seven when combined with area_code.
        schema:
          type: string
          pattern: ^[0-9]{1,10}$
        example: '5550'
      - name: voice
        in: query
        description: Only numbers that can place and receive calls.
        schema:
          type: boolean
          default: false
      - name: mms
        in: query
        description: Only numbers that can send and receive MMS.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      responses:
        '200':
          description: Numbers that were available at the time of the search.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableNumberList'
        default:
          $ref: '#/components/responses/Error'
  /numbers/orders:
    post:
      operationId: createNumberOrder
      tags:
      - numbers
      summary: Request iMessage numbers, which Sendblue fulfills.
      description: |
        See `number.imessage.request` in `GET /prices` first. The request
        records the total USD quote for its quantity at the applicable rate.
        Sendblue reviews the request and sets up the lines separately.
        Recording the request and its fulfillment do not debit the wallet.
        Without an assigned price creation returns 422 (`price_unavailable`).
        Repeating the same key and input returns the original request at its
        recorded price; different input under the same key returns 409.

        Required permission: `number_orders:create`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberOrderCreate'
            example:
              channel: imessage
              quantity: 1
              area_code: '415'
              note: San Francisco preferred
      responses:
        '201':
          description: The recorded request with its total quoted price.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberOrder'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listNumberOrders
      tags:
      - numbers
      summary: List this account's iMessage number requests.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of requests.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberOrderList'
              example:
                data: []
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `number_orders:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /numbers/orders/{order_id}:
    parameters:
    - name: order_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getNumberOrder
      tags:
      - numbers
      summary: Read an iMessage number request.
      responses:
        '200':
          description: The request, including any fulfilled numbers or decline reason. An unknown request
            returns 404.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberOrder'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `number_orders:read`. Accepted credentials: a signed-in person, an API key, the account token.
    delete:
      operationId: cancelNumberOrder
      tags:
      - numbers
      summary: Cancel a pending iMessage number request.
      description: |
        A repeat returns the cancelled request. A fulfilled or declined
        request returns 409. An unknown request returns 404.

        Required permission: `number_orders:cancel`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The cancelled request.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberOrder'
        default:
          $ref: '#/components/responses/Error'
  /numbers/{phone_number}:
    parameters:
    - $ref: '#/components/parameters/PhoneNumberPath'
    get:
      operationId: getNumber
      tags:
      - numbers
      summary: Read one of the account's numbers.
      responses:
        '200':
          description: The number.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `numbers:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateNumber
      tags:
      - numbers
      summary: Change a number's configuration.
      description: |
        A member that is absent is left as it is; `null` clears a URL.

        Live members: `voice_url`, `voice_method`, `voice_fallback_url`,
        `voice_fallback_method`, `status_callback`, `status_callback_method`, `campaign_id`.
        Set `campaign_id` to assign the number to an approved campaign, or pass null
        to remove its assignment under the same rules as the campaign subresource.
        All supplied changes commit together.

        `friendly_name` is not available yet: a
        request that names it answers `422 unsupported` with the
        member in `error.details.field`, and changes nothing.
        A missing or unapproved campaign answers 422. A conflicting assignment answers 409.
        An iMessage line managed by Sendblue answers 422 with reason `operator_managed`.
        A registered sender answers 422 with reason `registered_number`.

        Required permission: `numbers:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberUpdate'
            example:
              voice_url: https://example.com/voice
              voice_method: POST
      responses:
        '200':
          description: The changed number.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Number'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: releaseNumber
      tags:
      - numbers
      summary: Release a purchased carrier number.
      description: |
        An iMessage line fulfilled by Sendblue returns 422 with reason `operator_managed`.
        A registered sender returns 422 with reason `registered_number`.

        Required permission: `numbers:release`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/ExpectedNumberId'
      responses:
        '204':
          description: The release was recorded.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /numbers/{phone_number}/release:
    parameters:
    - $ref: '#/components/parameters/PhoneNumberPath'
    - name: Sendblue-Number-Id
      in: header
      required: true
      description: The immutable identity of the purchased number being released.
      schema:
        type: string
        pattern: ^PN[a-f0-9]{32}$
    get:
      operationId: getNumberRelease
      tags:
      - numbers
      summary: Read the status of a number release.
      responses:
        '200':
          description: Whether the carrier confirmed the release.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - queued
                    - claimed
                    - uncertain
                    - refused
                    - released
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `numbers:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /numbers/{phone_number}/usage:
    parameters:
    - $ref: '#/components/parameters/PhoneNumberPath'
    get:
      operationId: getNumberUsage
      tags:
      - numbers
      summary: Read a retained iMessage line's admission usage.
      description: |
        Read-only snapshot for the current account's active device assignment.
        Does not reserve capacity or establish permission to send. No query parameters.
        Daily windows begin at 03:00 America/New_York (including DST); the trailing
        hour excludes its start. Counts use the same stored reservations as admission,
        including accepted sends, not just delivered messages. A used_is_lower_bound
        count is capped at 10000; remaining is null unless zero is certain.
        Disabled policy returns unavailable with no limits. Ungated or disabled
        hourly rules have enforced false and null used/remaining. A paused daily
        rule has limit zero. Exempt recipients can still send; burst and response
        rate rules are not included. 404 hides other accounts and released or
        reassigned lines. Owned carrier and voice-only numbers return 422 with
        details.reason line_usage_not_supported. Database timeout returns 503.

        Required permission: `numbers:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: Current policy counters, with Cache-Control no-store.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberUsage'
              example:
                phone_number: '+14155550100'
                sampled_at: '2026-11-25T12:00:00Z'
                status: unavailable
                limits: []
        default:
          $ref: '#/components/responses/Error'
  /numbers/{phone_number}/campaign:
    parameters:
    - $ref: '#/components/parameters/PhoneNumberPath'
    get:
      operationId: getNumberCampaign
      tags:
      - numbers
      - campaigns
      summary: Read whether a number may send SMS, and under which campaign.
      description: |
        A number can be bought at any time, and places and receives calls
        without registration. It sends SMS and MMS only while it is assigned
        to an approved campaign and the carrier confirms the assignment; a
        send from it is refused otherwise (`422 unprocessable`,
        `sender_unavailable`). `sms.enabled` and `sms.blocked_reason` state
        that rule for this number as it stands now. For a number Sendblue
        registered for the account, this read returns its carrier SMS state and a null campaign.
        Campaign changes on a registered number return `422 unprocessable`
        with reason `registered_number`. A fulfilled iMessage line returns 422
        with reason `operator_managed` on campaign changes.

        Required permission: `numbers:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The number's campaign and messaging state.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberCampaign'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: assignNumberCampaign
      tags:
      - numbers
      - campaigns
      summary: Assign a number to an approved campaign.
      description: |
        Costs nothing and may be repeated: assigning a number to the campaign
        it is already in changes nothing. The carrier is asked once to map
        the number to the campaign; `sms.enabled` becomes true when it
        confirms, usually within minutes. Poll `GET`.

        `422 unprocessable` with `details.reason` `campaign_not_found` or
        `campaign_not_approved`. `409 conflict` when the number is in
        another campaign: a number cannot be moved between campaigns.

        Required permission: `numbers:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/ExpectedNumberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberCampaignAssign'
            example:
              campaign_id: MG0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: The number's campaign and messaging state.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberCampaign'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: unassignNumberCampaign
      tags:
      - numbers
      - campaigns
      summary: Take a number out of its campaign.
      description: |
        Possible only until the carrier has been asked to assign the number:
        after that it answers `409 conflict`, and the way to stop the number
        sending is to release it. A number in no campaign answers `204`.

        Required permission: `numbers:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '204':
          description: The number is in no campaign.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /brands:
    post:
      operationId: createBrand
      tags:
      - brands
      summary: Submit a business for US 10DLC brand registration.
      description: |
        The business's own details, as its tax records state them. They go to
        the carrier registry as submitted; nobody at Sendblue reviews them
        first.

        **Price.** `brand.registration` in `GET /prices`. It is held from the
        balance when this request is accepted, charged when the carrier
        accepts the submission, and released if the carrier refuses the
        submission outright. A brand the registry later fails or cannot
        verify is not refunded. `price` in the answer is the amount held.

        **Asynchronous.** The answer is the brand in `pending`. The
        submission is the operation `operation_id` (`GET /operations/{id}`);
        the registry's verdict then arrives in `status`, usually within
        minutes and at most a few business days. Poll `GET /brands/{id}`.

        **Refusals.** `402 insufficient_funds` before anything is stored or
        sent. `422 unprocessable` with `details.reason`:
        `registration_not_enabled` (the account has no carrier profile yet)
        or `not_offered` (the account has no price for a brand).
        `409 idempotency_conflict` when the key was used for other details.

        After verification, use PATCH /brands/{brand_id} to update the display
        name or website. The original registration and paid receipt are retained.

        Required permission: `brands:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreate'
            example:
              legal_name: Synthetic Works LLC
              display_name: Synthetic Works
              entity_type: PRIVATE_PROFIT
              tax_id: 12-3456789
              tax_id_country: US
              vertical: TECHNOLOGY
              website: https://example.com
              address:
                street: 1 Example Street
                city: San Francisco
                region: CA
                postal_code: '94105'
                country: US
              contact:
                first_name: Ada
                last_name: Example
                email: ada@example.com
                phone_number: '+14155550100'
      responses:
        '201':
          description: The brand was recorded, its fee held, and its submission queued.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listBrands
      tags:
      - brands
      summary: List brands.
      description: |
        Every brand of the account, whichever API registered it.

        Required permission: `brands:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of brands.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandList'
        default:
          $ref: '#/components/responses/Error'
  /brands/{brand_id}:
    parameters:
    - name: brand_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getBrand
      tags:
      - brands
      summary: Read one brand.
      responses:
        '200':
          description: The brand.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `brands:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateBrand
      tags:
      - brands
      summary: Change the display name or website of a verified brand.
      description: |
        Supply one or both fields and a fresh Idempotency-Key. Sendblue queues a
        metadata amendment and publishes the values after a separate carrier
        read confirms them. Until then GET returns the last confirmed values.
        Repeat the same request and key to check the outcome. The original
        registration and paid receipt are retained. This operation has no
        customer fee and does not order re-vetting.
        Unregistered or unverified brands and concurrent or unresolved edits
        return 409. Changes to identity, tax, contact or vetting fields and
        a definitive carrier refusal return 422.

        Required permission: `brands:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdate'
            example:
              display_name: Example Market
              website: https://example.com
      responses:
        '200':
          description: The brand after independent confirmation.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '202':
          description: The brand with a pending metadata change.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        default:
          $ref: '#/components/responses/Error'
  /brands/{brand_id}/vetting:
    parameters:
    - name: brand_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getBrandVetting
      tags:
      - brands
      summary: Read the standard brand vetting price and latest order.
      responses:
        '200':
          description: The current offer and latest order for this brand.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandVettingOffer'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `brands:read`. Accepted credentials: a signed-in person, an API key, the account token.
    post:
      operationId: createBrandVetting
      tags:
      - brands
      summary: Order standard vetting for a verified brand.
      description: |
        Approve the exact fee returned by GET. The wallet holds it once at
        admission, captures it on accepted submission, and releases it on a
        definitive submission refusal. Poll the offer for the result. Replay
        the same key and expected price after an ambiguous response.

        Required permission: `brands:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_price_micro_usd
              properties:
                expected_price_micro_usd:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: The accepted or previously authorized order.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandVettingOrder'
        default:
          $ref: '#/components/responses/Error'
  /campaigns:
    post:
      operationId: createCampaign
      tags:
      - campaigns
      summary: Register a US 10DLC campaign for a verified brand.
      description: |
        A campaign is also a pool of senders: numbers join it with
        `PUT /numbers/{phone_number}/campaign`, and a message sent with
        `campaign_id` uses one of them. No number is needed to register one.

        **Price.** `campaign.registration` for the `use_case` in
        `GET /prices`. It is held when this request is accepted, charged when
        the carrier accepts the submission, and released if the carrier
        refuses the submission outright (for example because the brand does
        not qualify for the use case). A campaign rejected in review is not
        refunded. Before registering, read `campaign.monthly` for the same
        use case. When offered, this request pins the monthly price for
        subsequent terms and requests automatic renewal by default.
        Pass `auto_renewal: false` to register for the initial term only.
        A zero monthly price means Sendblue covers the recurring fee.
        With no monthly offer, omitting the preference registers a one-time
        campaign with `renewal_status: unavailable`. Explicit opt-in then
        returns 422 with reason `renewal_not_offered`.

        **Asynchronous.** The answer is the campaign in `pending`. The
        submission is the operation `operation_id`; review by the registry
        and the mobile networks then moves `status` to `approved` or
        `rejected`, typically in three to seven business days. Poll
        `GET /campaigns/{id}`.

        **Refusals.** `402 insufficient_funds` before anything is stored or
        sent. `422 unprocessable` with `details.reason`: `brand_not_found`,
        `brand_not_verified`, `campaign_limit` (a brand holds at most five
        campaigns that were not rejected), `registration_not_enabled`, or
        `not_offered` (the account has no price for this use case).
        `409 idempotency_conflict` when the key was used for another
        campaign.

        Change the renewal preference with `PATCH /campaigns/{campaign_id}`.
        After a rejection, register a
        corrected campaign with a new `Idempotency-Key`: it is a new
        submission and a new fee.

        Required permission: `campaigns:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
            example:
              brand_id: BN0123456789abcdef0123456789abcdef
              name: Order updates
              use_case: CUSTOMER_CARE
              description: Order confirmations and support replies for customers of the shop.
              message_flow: Customers tick an unchecked box at checkout to receive order updates by text.
              sample_messages:
              - Your order 1042 has shipped and arrives on Friday.
              - Thanks for writing in. An agent will reply within one hour.
              privacy_policy_url: https://example.com/privacy
              terms_url: https://example.com/terms
              opt_out_message: You are unsubscribed and will receive no more messages.
              help_message: 'Synthetic Works support: write to help@example.com.'
              has_embedded_links: false
              has_embedded_phone: false
              subscriber_opt_in: true
              terms_accepted: true
      responses:
        '201':
