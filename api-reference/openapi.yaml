    EventType:
      type: string
      description: |
        The message.sent, message.delivered, message.failed and message.received types
        describe those transitions. message.read is emitted once when the sending
        device first reports that the recipient read a message sent from an
        iMessage line. Its data is the Message with read_at, and its status is
        still delivered. read_at is the time Sendblue received that report, because
        the device does not report when the message was read. Other emitted
        message lifecycle changes use message.updated. A completed call emits call.completed. Other emitted
        call transitions use call.updated. Number acquisition, routing, campaign
        assignment, activation and release emit number.updated. Registration
        changes emit brand.updated and campaign.updated with their public resource.
        A top-up request, hosted link, payment, failure or recorded expiry emits
        top_up.updated. A clock-only expiry is visible on GET. endpoint.unhealthy is
        emitted once when one of the account's endpoints is declared unhealthy: a
        registered webhook endpoint, or the destination of its status callbacks.
        Subscribe a second endpoint to it; the unhealthy endpoint's own copy is
        parked with its other deliveries. whatsapp.message.received carries a
        received WhatsApp message, sent at once while its attachments may still be
        pending. whatsapp.contact.opted_out is emitted when a contact's opt-out or
        marketing opt-out becomes true, and whatsapp.contact.opted_in when either
        becomes false. whatsapp.template.updated is emitted when a template's
        status, category, quality or components change, from Meta's webhooks,
        a sync or a deletion.
      enum:
      - message.sent
      - message.delivered
      - message.read
      - message.failed
      - message.received
      - message.updated
      - call.updated
      - call.completed
      - brand.updated
      - campaign.updated
      - number.updated
      - top_up.updated
      - endpoint.unhealthy
      - whatsapp.signup.completed
      - whatsapp.signup.failed
      - whatsapp.connection.updated
      - whatsapp.number.updated
      - whatsapp.message.received
      - whatsapp.message.sent
      - whatsapp.message.delivered
      - whatsapp.message.read
      - whatsapp.message.failed
      - whatsapp.message.updated
      - whatsapp.template.updated
      - whatsapp.contact.opted_out
      - whatsapp.contact.opted_in
    Event:
      type: object
      description: The body of a webhook delivery.
      required:
      - id
      - type
      - created_at
      - data
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^EV[0-9a-f]{32}$
          description: Event ID shared by all deliveries of this event.
        type:
          $ref: '#/components/schemas/EventType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          description: The event-specific snapshot captured at the transition.
      oneOf:
      - properties:
          type:
            enum:
            - message.sent
            - message.delivered
            - message.read
            - message.failed
            - message.received
            - message.updated
          data:
            $ref: '#/components/schemas/Message'
      - properties:
          type:
            enum:
            - call.completed
            - call.updated
          data:
            $ref: '#/components/schemas/Call'
      - properties:
          type:
            enum:
            - brand.updated
          data:
            $ref: '#/components/schemas/Brand'
      - properties:
          type:
            enum:
            - campaign.updated
          data:
            $ref: '#/components/schemas/Campaign'
      - properties:
          type:
            enum:
            - number.updated
          data:
            $ref: '#/components/schemas/NumberConfigurationSnapshot'
      - properties:
          type:
            enum:
            - top_up.updated
          data:
            $ref: '#/components/schemas/TopUp'
      - properties:
          type:
            enum:
            - endpoint.unhealthy
          data:
            $ref: '#/components/schemas/EndpointUnhealthy'
      - properties:
          type:
            enum:
            - whatsapp.signup.completed
            - whatsapp.signup.failed
          data:
            $ref: '#/components/schemas/WhatsappSignupLink'
      - properties:
          type:
            enum:
            - whatsapp.connection.updated
          data:
            $ref: '#/components/schemas/WhatsappConnection'
      - properties:
          type:
            enum:
            - whatsapp.number.updated
          data:
            $ref: '#/components/schemas/WhatsappNumber'
      - properties:
          type:
            enum:
            - whatsapp.message.received
            - whatsapp.message.sent
            - whatsapp.message.delivered
            - whatsapp.message.read
            - whatsapp.message.failed
            - whatsapp.message.updated
          data:
            $ref: '#/components/schemas/WhatsappMessage'
      - properties:
          type:
            enum:
            - whatsapp.template.updated
          data:
            $ref: '#/components/schemas/WhatsappTemplate'
      - properties:
          type:
            enum:
            - whatsapp.contact.opted_out
            - whatsapp.contact.opted_in
          data:
            $ref: '#/components/schemas/WhatsappContact'
      example:
        id: EV0123456789abcdef0123456789abcdef
        type: message.delivered
        created_at: '2026-11-23T18:04:07Z'
        data:
          id: SM0123456789abcdef0123456789abcdef
          direction: outbound_api
          status: delivered
          to: '+14155550101'
          from: '+14155550100'
          campaign_id: null
          body: Your code is 482913
          media_urls: []
          segments: 1
          price:
            amount_micro_usd: 7900
            currency: USD
          error_code: null
          status_callback: null
          created_at: '2026-11-23T18:04:05Z'
          updated_at: '2026-11-23T18:04:07Z'
          sent_at: '2026-11-23T18:04:06Z'
    CallbackEndpoint:
      type: object
      description: The destination of status callbacks and inbound webhooks for one origin, with its health.
      required:
