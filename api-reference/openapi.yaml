      - identity_status
      - failure_reasons
      - legal_name
      - display_name
      - entity_type
      - vertical
      - tax_id_country
      - tax_id_last4
      - website
      - address
      - contact
      - stock_symbol
      - stock_exchange
      - price
      - operation_id
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/BrandStatus'
