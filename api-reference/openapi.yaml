    KeyCreate:
      type: object
      additionalProperties: false
      description: |
        Omitting both role and permissions requests a Standard key. With a
        role and an explicit list, every listed permission must belong to the
        role. Only the explicit permissions are granted. A key with explicit
        grants uses the native API only, except when both the standard role
        and its exact unchanged permission set were requested.
        accounts:create, subaccounts:manage, team:manage, team:read and
        webhooks:receive cannot be delegated to a key.
      properties:
        name:
          type: string
          maxLength: 64
        role:
          $ref: '#/components/schemas/KeyRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        expires_at:
          type: string
          format: date-time
          description: Future RFC 3339 timestamp bounded by the issuing key's expiry.
