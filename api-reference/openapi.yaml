          type: boolean
      responses:
        '200':
          description: One page of contacts.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContactList'
              example:
                data:
                - id: contact-1
                  phone_number: '+14155550100'
                  first_name: Ada
                  last_name: null
                  email: null
                  tags:
                  - customer
                  opted_out: false
                  created_at: '2026-01-10T00:00:00Z'
                  updated_at: '2026-01-10T00:00:00Z'
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
  /contacts/{contact_id}:
