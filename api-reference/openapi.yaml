              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
              example:
                data:
                - id: fa679dd8-b799-4812-ad5c-24680b56c21b
                  event_id: EV0123456789abcdef0123456789abcdef
                  event_type: message.delivered
                  status: delivered
                  attempts: 1
                  response_status: 204
                  created_at: '2026-11-23T18:04:05.000000Z'
                  delivered_at: '2026-11-23T18:04:05.000000Z'
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
  /admin/webhooks/{webhook_id}/deliveries/{delivery_id}/replay:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    - name: delivery_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: replayWebhookDelivery
      tags:
      - admin
      summary: Queue the original event for delivery again.
      description: |
        The replay gets a new delivery ID and keeps the original event ID and snapshot.
        An equal retry returns the same delivery. A changed replay under the same key returns
        409 idempotency_conflict. An absent or foreign delivery returns 404 not_found.
        Replay requires an enabled endpoint and a retained event snapshot (up to seven days). A disabled endpoint or erased/expired snapshot returns 409 conflict.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The replay delivery.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
              example:
                id: 35b165ea-f373-4027-8239-f4d7f0ddba06
                event_id: EV0123456789abcdef0123456789abcdef
                event_type: message.delivered
                status: pending
                attempts: 0
                response_status: null
                created_at: '2026-11-23T18:04:05.000000Z'
                delivered_at: null
        default:
          $ref: '#/components/responses/Error'
  /admin/subaccounts:
    get:
      operationId: listSubaccounts
      tags:
      - admin
      summary: List the account's subaccounts.
      description: |
        Requires the parent account token or an admin acting in that account.

        Required permission: `subaccounts:manage`. Accepted credentials: a signed-in administrator, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of subaccounts.
