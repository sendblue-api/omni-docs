  /conferences/{conference_id}/participants:
    parameters:
    - name: conference_id
      in: path
      required: true
      description: |
        A conference ID (`CF…`). When inviting a participant it may also be
        a conference name of 1 to 128 characters: the call joins the
        conference in progress under that name, or starts one.
      schema:
        type: string
    post:
      operationId: createParticipant
      tags:
      - conferences
      summary: Invite a participant by calling a phone number.
      description: |
        Places an outbound call from `from` to `to` and joins it to the
        conference when it is answered. The call is an ordinary call: it is
        read, ended and priced as one, and its ID is the participant's
        `call_id`. A participant's time in a conference is priced per second
        as well; the longest possible call and visit are held from the
        balance at acceptance. An account with no price for conference
        participants is refused with `403 forbidden` and
        `details.reason: conference_pricing_missing`.

        Status callbacks are per-request URLs: `status_callback` receives
        the call's events and `conference_status_callback` the conference's,
        both form-encoded with Twilio's parameter names and
        `X-Twilio-Signature`.

        The same `Idempotency-Key` returns the same participant. A key that
        was used for another conference or another body is refused with
        `409 idempotency_conflict`.

        Required permission: `calls:create`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantCreate'
            example:
              to: '+14155550101'
              from: '+14155550100'
              label: agent
              start_conference_on_enter: true
              end_conference_on_exit: false
              beep: never
              status_callback: https://example.com/calls
              status_callback_events:
              - initiated
              - ringing
              - answered
              - completed
              conference_status_callback: https://example.com/conferences
              conference_status_callback_events:
              - start
              - end
              - join
              - leave
              - hold
      responses:
        '201':
          description: The call was accepted and queued for dialing.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
              example:
                call_id: CA0123456789abcdef0123456789abcdef
                conference_id: CF0123456789abcdef0123456789abcdef
                label: agent
                status: queued
                muted: false
                hold: false
                coaching: false
                call_id_to_coach: null
                start_conference_on_enter: true
                end_conference_on_exit: false
                queue_time_ms: 0
                created_at: '2026-11-24T18:00:00.000000Z'
                updated_at: '2026-11-24T18:00:00.000000Z'
        default:
          $ref: '#/components/responses/Error'
    get:
