  /admin/settings:
    get:
      operationId: getSettings
      tags:
      - admin
      summary: Read the selected account's settings.
      description: |
        The account's display name and cumulative USD spending limit. The root
        account also sees its configured low-balance refill
        trigger, including whether Sendblue enabled it. A subaccount sees
        its own limit and a null refill rule. This read requires settings:read.
        Missing credentials return 401 and a missing permission returns 403.

        Required permission: `settings:read`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: Stored settings for the authenticated account.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAccountSettings'
              example:
                name: West
                spending_limit:
                  amount: '50.00'
                  amount_micro_usd: 50000000
                  currency: USD
                low_balance_refill: null
        default:
          $ref: '#/components/responses/Error'
  /admin/settings/device-automation:
    get:
      operationId: getDeviceAutomation
      tags:
      - admin
      summary: Read automatic device controls for the authenticated account.
      description: |
        Both controls are false and revision is zero when no policy is stored.
        No root or sibling account policy is inherited. Requires settings:read;
        historical Standard and legacy key pairs do not hold that permission.
        This isolated candidate does not activate automatic actions: reviewed
        incoming eligibility and consent integration remain prerequisites.

        Required permission: `settings:read`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: The account policy, independent of the process activation switch.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - auto_mark_read
                - auto_typing_indicator
                - revision
                properties:
                  auto_mark_read:
                    type: boolean
                  auto_typing_indicator:
                    type: boolean
                  revision:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
              example:
                auto_mark_read: false
                auto_typing_indicator: false
                revision: 0
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateDeviceAutomation
      tags:
      - admin
      summary: Update the authenticated account's automatic device policy.
      description: |
        Requires a verified current person administrator and settings:write.
        Account tokens and API keys cannot write. A person may select an authorized
        subaccount with Sendblue-Account; no body/query member selects company or account.
        Supply the revision returned by GET and at least one boolean. Omitted
        booleans are unchanged; null, coercions and unknown fields are refused.
        Every successful update increments revision and invalidates queued automatic
        commands from the previous revision, including after off/on changes.
        Disabling is prospective: already claimed commands may reach the client.
        No automatic stop is sent; explicit controls retain their wire-order behavior.
        A stale revision is a 409 conflict with reason policy_revision: GET the
        current revision before updating. On an uncertain write outcome, GET
        before deciding whether to update again.
        Legacy URLs and real account imports are not part of this resource.

        Required permission: `settings:write`. Accepted credentials: a signed-in administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              minProperties: 2
              properties:
                revision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740990
                auto_mark_read:
                  type: boolean
                auto_typing_indicator:
                  type: boolean
            example:
              revision: 0
              auto_mark_read: true
      responses:
        '200':
          description: Updated policy and its new revision.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - auto_mark_read
                - auto_typing_indicator
                - revision
                properties:
                  auto_mark_read:
                    type: boolean
                  auto_typing_indicator:
                    type: boolean
                  revision:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
              example:
                auto_mark_read: true
                auto_typing_indicator: false
                revision: 1
        default:
          $ref: '#/components/responses/Error'
  /admin/company-settings:
