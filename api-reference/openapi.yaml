  /admin/callback_endpoints/{endpoint_id}/dead_letters:
    parameters:
    - $ref: '#/components/parameters/CallbackEndpointId'
    get:
      operationId: listCallbackDeadLetters
      tags:
      - admin
      summary: List a destination's undelivered callbacks, newest first, with why each failed.
      description: |
        The destination's callbacks of the last 14 days that ran out of attempts, or were parked
        because the destination was unhealthy. `from` (inclusive) and `to` (exclusive) bound when the
        callback became a dead letter (`failed_at`). A callback that is replayed leaves this list
        until it fails again. An absent or foreign destination returns 404 not_found. A cursor from
        another destination or range returns 400 invalid_request.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: from
        in: query
        description: Only callbacks that became dead letters at or after this time.
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        description: Only callbacks that became dead letters before this time.
        schema:
          $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: One page of dead letters.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackDeadLetterList'
              example:
                data:
                - id: fa679dd8-b799-4812-ad5c-24680b56c21b
                  message_id: SM0123456789abcdef0123456789abcdef
                  event: delivered
                  attempts: 6
                  response_status: 503
                  failure_reason: attempts_exhausted
                  replayable: true
                  failed_at: '2026-11-23T18:04:05.000000Z'
                  replayed_at: null
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
  /admin/callback_endpoints/{endpoint_id}/dead_letters/replay:
    parameters:
    - $ref: '#/components/parameters/CallbackEndpointId'
    post:
      operationId: replayCallbackDeadLetters
      tags:
      - admin
      summary: Replay a destination's undelivered callbacks in a time range.
      description: |
        Gives one further attempt to the destination's replayable dead letters of the last 14 days
        that became dead letters in the range, oldest first, at most 200 a request. The stored form is
        signed and sent to the stored URL with the original idempotency token, so a receiver that
        already processed it can recognise it. A replayed callback is pending and no longer a dead
        letter, so repeating the request does not send it twice; if that attempt fails it becomes a
        dead letter again. `more` is true when the request queued its maximum and should be sent
        again. The body is optional: with no range every replayable dead letter is replayed. An
        inbound webhook replayed more than ten minutes after its message arrived is a notification
        only: a TwiML reply in its answer is not sent. An absent or foreign destination returns
        404 not_found.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookDeadLetterReplayRequest'
            example:
              from: '2026-11-23T00:00:00Z'
              to: '2026-11-24T00:00:00Z'
      responses:
        '200':
          description: How many dead letters were queued again.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeadLetterReplay'
              example:
                replayed: 37
                more: false
        default:
          $ref: '#/components/responses/Error'
