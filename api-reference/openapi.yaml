                id: customer
                name: customer
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTag
      tags:
      - tags
      summary: Delete a tag and remove it from every contact.
      description: |
        A change that touches many contacts can be applied in separate batches. On write_outcome_unknown, inspect the catalogue and the affected contacts for the old label before issuing another change.

        Required permission: `tags:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
