      description: |
        Costs `number.purchase` in `GET /prices`, held now and charged when
        the carrier confirms the order; `number.monthly` is then charged each
        month from one month after the purchase. `GET /numbers/available`
        shows both beside each number. A number can be bought before any
        campaign exists: it can place and receive calls at once and sends
        SMS only once it is assigned to an approved campaign
        (`/numbers/{phone_number}/campaign`). The carrier order is placed
        once and the response waits for it briefly. A purchase the carrier
        has not confirmed in that time answers `202`; repeat the request to
