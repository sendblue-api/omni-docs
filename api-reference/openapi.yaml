  /calls/{call_id}/transcriptions:
    parameters:
    - $ref: '#/components/parameters/CallId'
    post:
      operationId: startCallTranscription
      tags:
      - calls
      summary: Start a live transcription on a call in progress.
      description: |
        Transcribes the call's speech as it is spoken, until the session is
        stopped or the call ends, and sends each utterance to
        `status_callback` in Twilio's format with `X-Twilio-Signature`,
        exactly as a `<Start><Transcription>` in TwiML. A session is billed
        per second; its price through the call's time limit is held from the
        balance when it starts. A repeat with the same `Idempotency-Key`
        returns the first session.

        `both_tracks`, the default, tells the two sides apart with one fixed
        engine: it needs `profanity_filter: false` and takes no
        `transcription_engine`, `speech_model`, `hints`, `partial_results` or
        `enable_automatic_punctuation`. One track takes them, in the
        combinations the engine supports; any other combination is
        `400 invalid_request`.

        Refusals: `402 insufficient_funds` when the balance or spending limit
        does not cover the hold; `503 unavailable` when the account has no
        rate for live transcription; `409 conflict` when the call cannot take
        the session (it is not answered, has ended, or already runs a session
        of this `name`) or the key was used with other options;
        `422 unsupported` for a `status_callback` where the deployment cannot
        reach customer servers.

        Required permission: `calls:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallTranscriptionStart'
            example:
              name: notes
              track: inbound_track
              status_callback: https://example.com/utterances
              transcription_engine: deepgram
              profanity_filter: false
              partial_results: true
      responses:
        '201':
          description: The session was accepted and is being started.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSession'
              example:
                id: GT0123456789abcdef0123456789abcdef
                call_id: CA0123456789abcdef0123456789abcdef
                name: notes
                status: in_progress
                updated_at: '2026-11-24T18:00:00.000000Z'
        default:
          $ref: '#/components/responses/Error'
