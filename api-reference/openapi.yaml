      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getTopUp
      tags:
      - admin
      summary: Read the status of a hosted checkout and its wallet credit.
      description: |
        Requires `billing:top_up` on the root account (401 for missing credentials, 403 for
        insufficient access). Foreign and unknown IDs return the same 404 not_found.
        An expired checkout link is hidden. Later verified payment can still settle.

        Required permission: `billing:top_up`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: The top-up.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
              example:
                id: 87350fa8-7779-4d23-a968-e215ae5961d8
                status: succeeded
                amount:
                  amount: '25.00'
                  amount_micro_usd: 25000000
                  currency: USD
                transaction_id: '18'
                checkout_url: null
                created_at: '2026-11-23T12:00:00Z'
                updated_at: '2026-11-23T12:04:00Z'
        default:
          $ref: '#/components/responses/Error'
  /admin/webhooks:
    get:
      operationId: listWebhookEndpoints
      tags:
      - admin
      summary: List this account's endpoints, newest first.
      description: |
        Requires `webhooks:manage` in the acting account. A malformed cursor or limit returns 400 invalid_request.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of endpoints.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
              example:
                data:
                - id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                  url: https://hooks.acme.com/omni
                  events:
                  - message.delivered
                  enabled: true
                  created_at: '2026-11-23T18:04:05.000000Z'
                  updated_at: '2026-11-23T18:04:05.000000Z'
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWebhookEndpoint
      tags:
      - admin
      summary: Register a webhook endpoint and show its signing secret once.
      description: |
        Requires `webhooks:manage`. The idempotency key identifies the registration within this account.
        An equal retry returns 200 with the endpoint metadata, including any later edits.
        A changed request under the same key returns 409 idempotency_conflict.
        An invalid destination or event list returns 400 invalid_request. Reaching the
        account's limit of 16 active and disabled endpoints returns 422 unprocessable. If the first response was lost,
        rotate the endpoint secret with a new rotation key.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
