              enabled: false
      responses:
        '200':
          description: Updated endpoint.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
              example:
                id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                url: https://hooks.acme.com/omni
                events:
                - message.delivered
                enabled: false
                created_at: '2026-11-23T18:04:05.000000Z'
                updated_at: '2026-11-23T18:04:05.000000Z'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWebhookEndpoint
      tags:
      - admin
      summary: Delete an endpoint and stop its deliveries.
      description: |
        An absent or foreign endpoint returns 404 not_found. Deletion prevents future claims and makes the endpoint and its log unavailable.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id:
