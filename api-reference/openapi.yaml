    CallEvent:
      type: object
      description: One HTTP exchange between a call and the customer's server.
      required:
      - request
      - response
      - created_at
      additionalProperties: false
      properties:
        request:
          type: object
          required:
          - method
          - url
          - parameters
          additionalProperties: false
          properties:
            method:
              type: string
              enum:
              - GET
              - POST
            url:
              type: string
              description: The address requested, as the call or number configured it.
            parameters:
              type: object
              description: |
                The parameters sent, by their snake_case names: `CallSid` is
                `call_sid`, `CallStatus` is `call_status`. Values are as sent.
              additionalProperties:
                type: string
        response:
          type: object
          required:
          - status
          - content_type
          - body
          - duration_ms
          additionalProperties: false
          properties:
            status:
              type: integer
              minimum: 100
              maximum: 599
            content_type:
              type:
              - string
              - 'null'
            body:
              type: string
              description: The response body as text. Bytes that are not UTF-8 are replaced.
            duration_ms:
              type: integer
              minimum: 0
              description: Milliseconds from sending the request to the response.
        created_at:
          description: When the response was recorded.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
    CallEventList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CallEvent'
        next_cursor:
          type:
          - string
          - 'null'
    Queue:
