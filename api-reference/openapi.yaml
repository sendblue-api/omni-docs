        auto_renewal_requested:
          type: boolean
          description: The current renewal instruction. Opt-out, expiry, or an unpaid renewal at the safety
            cutoff turns it off.
        current_term_ends_at:
          description: End of the current term reported by the carrier. Null until supplied.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        renewal_fund_by:
          description: Absolute UTC deadline to cover the fee for the next month. Pinned to the observed
            carrier term. Null until Omni knows an applicable deadline.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        renewal_cutoff_missed:
          type: boolean
          description: Omni requested opt-out after finding the next monthly fee uncovered at or after
            this term's funding deadline. Read auto_renewal for the last confirmed carrier setting.
        renewal_notice:
          type:
          - string
          - 'null'
          description: Funding deadline, recovery instructions after nonpayment, or the charge and campaign
            end after a late voluntary cancellation. Null when none applies. Captured for campaign.updated
            at the time of the change.
          examples:
          - Fund by 2027-03-16T12:00:00.000000Z or Omni will request that auto-renewal be turned off.
            If the fee is already reserved, no additional funds are needed.
          - Omni requested auto-renewal be turned off and is awaiting carrier confirmation. The carrier's
            cancellation cutoff for the term starting 2027-01-31T12:00:00.000000Z has passed. You will
            still be charged for that month when the carrier confirms the new period. The campaign is
            expected to end on 2027-02-28T12:00:00.000000Z.
        committed_term_starts_at:
          description: Start of the next month affected by a late cancellation. Review can identify a
            known term with incomplete billing evidence even when no reservation exists. Null when no
            relevant term was captured.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        committed_term_ends_at:
          description: Expected end of that committed month, one calendar month later in UTC until the
            carrier confirms the actual term. If the carrier confirms it never billed that month, the
            campaign ended at committed_term_starts_at.
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        renewal_commitment_status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - billed
          - not_billed
          - review
          - null
          description: Pending retains the existing hold. Billed means Omni captured the hold against
            a confirmed new carrier period. Not_billed means confirmed expiry without a renewed month
            released any hold. Review means billing evidence is unresolved. Any existing hold remains
            in place. Null when no late cancellation commitment applies.
        renewal_status:
          type: string
          enum:
          - unavailable
          - false
          - pending
          - scheduled
          - awaiting_funds
          - spend_limit
          - disabling
          - expired
          - review
          description: |
            `unavailable` means there is no monthly offer. `off` means renewal
            is disabled. `pending` awaits carrier confirmation. `scheduled`
            has a renewal scheduled. `awaiting_funds` means the wallet needs
            funding before cutoff. `spend_limit` means the account's spending
            ceiling prevents the renewal hold. Ask the parent account owner
            to review the ceiling before renewal_fund_by. Funding alone
            leaves the ceiling in place. `disabling` awaits carrier confirmation
            of opt-out or nonpayment. `expired` means the term ended.
            `review` means Sendblue must resolve it. The status describes
            the current term. An earlier disputed or unverified charge can
            remain under separate review.
        renewal_review_required:
          type: boolean
          description: True when an earlier renewal still holds wallet funds awaiting matching carrier
            billing evidence. Check this flag alongside the current term's renewal_status.
