        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        id: BN0123456789abcdef0123456789abcdef
        status: verified
        identity_status: verified
        failure_reasons: []
        legal_name: Synthetic Works LLC
        display_name: Synthetic Works
        entity_type: PRIVATE_PROFIT
