        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
  /recordings/{recording_id}:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecording
      tags:
      - recordings
      summary: Read one recording.
      responses:
        '200':
          description: The recording.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
    delete:
      operationId: deleteRecording
      tags:
      - recordings
      summary: Delete a recording and its audio.
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `recordings:write`. Accepted credentials: a signed-in person, an API key, the account token.
  /recordings/{recording_id}/audio:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecordingAudio
      tags:
      - recordings
      summary: Download a completed recording's audio.
      description: |
        Served only to the account's credentials; no link works without them.
        Answers `503 unavailable` where the deployment has no recording storage.

        Required permission: `recordings:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - wav
          - mp3
          default: wav
      responses:
        '200':
          description: The audio.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /media:
    post:
      operationId: uploadMedia
      tags:
      - media
      summary: Upload one file for outgoing messages, retained for four hours.
      description: |
        A file may contain 1 byte through 4 MiB. The declared MIME type and file signature must agree. Each account can retain 256 active uploads and 64 MiB. Repeating the key with the same type and bytes returns the same upload while live. Malformed forms return 400, expired or erased replays return 404, a different file on the same key returns 409, oversize files return 413, unsupported files return 415, and exhausted capacity returns 429.

        Required permission: `media:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/png, image/jpeg, image/gif, video/mp4, audio/mpeg, application/pdf
      responses:
        '201':
          description: The stored file.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        default:
          $ref: '#/components/responses/Error'
  /media/{media_id}:
    parameters:
    - name: media_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getMedia
      tags:
      - media
      summary: Read metadata and the bearer download link of an active upload in this account.
      description: |
        An expired, erased or unowned upload returns 404.

        Required permission: `media:read`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '200':
          description: The media item.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMedia
      tags:
      - media
      summary: Erase the file and revoke its download link.
      description: |
        The link stops serving bytes even if it was attached to a queued message. An expired, erased or unowned upload returns 404.

        Required permission: `media:write`. Accepted credentials: a signed-in person, an API key, the account token.
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        default:
          $ref: '#/components/responses/Error'
  /contacts:
    post:
      operationId: createContact
      tags:
      - contacts
      summary: Create or resolve a US contact.
      description: |
        Available to companies whose contact directory supports direct writes. An identical key and body replay
        the original response, including after the contact is edited or deleted. A
        known contact keeps its existing fields. A new contact queues a capability
        check. Read the assigned canonical ID at GET /contacts/{contact_id}.
        Other directories return 409 with reason legacy_sync_generation_unverified
        before a write. An ambiguous existing phone identity returns 409.
        For a new contact, record consent where the company records it today. An explicit
        opted_out on create returns 409 with reason contact_consent_owner_unavailable.
        New numeric variable values support ordinary decimal conversion with at most
        15 significant digits. Date variables accept calendar-valid ISO dates or timestamps
        with an explicit timezone, and supported integer epochs. Locale date strings,
        radix-prefixed numbers and unsupported precision return 400 invalid_request,
        field variables, reason contact_variable_value_unverified, before commit.
        These rules are deliberately strict.
        On write_outcome_unknown replay the same key and body.

        Required permission: `contacts:write`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200':
          description: The existing contact. Its profile and labels are unchanged.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
              description: The relative path of the canonical contact.
            Sendblue-Contact-Created:
              schema:
                type: string
                enum:
                - 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContact'
              example:
                id: d53a8c5d-8d72-4ca6-938d-769234edd88c
                phone_number: '+14155550100'
                first_name: Ada
                last_name: null
                email: null
                tags: []
                opted_out: false
                created_at: '2026-01-10T00:00:00Z'
                updated_at: '2026-01-10T00:00:00Z'
        '201':
          description: The newly created contact, once it is fully stored.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
              description: The relative path of the canonical contact.
            Sendblue-Contact-Created:
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContact'
              example:
                id: d53a8c5d-8d72-4ca6-938d-769234edd88c
                phone_number: '+14155550100'
                first_name: Ada
                last_name: null
                email: null
                tags: []
                opted_out: false
                created_at: '2026-01-10T00:00:00Z'
                updated_at: '2026-01-10T00:00:00Z'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listContacts
      tags:
      - contacts
      summary: Search or list US contacts.
      description: |
        A page can be short or empty. Continue while next_cursor is present.
        A substring search examines up to 1,000 candidate contacts after the cursor.
        When the service cannot establish a page within its search budget it returns
        HTTP 422 with the standard error envelope, code `unprocessable`,
        `details.field=search`, and `details.reason=search_too_broad`. Start a new
        search with an exact phone_number, a tag_id or an opted_out filter that
        narrows the candidate set.

        Required permission: `contacts:read`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/Limit100'
      - $ref: '#/components/parameters/Cursor'
      - name: search
        in: query
        description: Case-insensitive literal substring of the contact name, phone number or email.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: phone_number
        in: query
        schema:
          $ref: '#/components/schemas/PhoneNumber'
      - name: tag_id
        in: query
        schema:
          type: string
      - name: opted_out
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: One page of contacts.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContactList'
              example:
                data:
                - id: contact-1
                  phone_number: '+14155550100'
                  first_name: Ada
                  last_name: null
                  email: null
                  tags:
                  - customer
                  opted_out: false
                  created_at: '2026-01-10T00:00:00Z'
                  updated_at: '2026-01-10T00:00:00Z'
                next_cursor: null
        default:
          $ref: '#/components/responses/Error'
