              example:
                id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                url: https://hooks.acme.com/omni
                events:
                - message.delivered
                enabled: true
                created_at: '2026-11-23T18:04:05.000000Z'
                updated_at: '2026-11-23T18:04:05.000000Z'
                secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        '200':
          description: Metadata from an equal retry.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
              example:
                id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                url: https://hooks.acme.com/omni
                events:
                - message.delivered
                enabled: true
                created_at: '2026-11-23T18:04:05.000000Z'
                updated_at: '2026-11-23T18:04:05.000000Z'
        default:
          $ref: '#/components/responses/Error'
  /admin/webhooks/{webhook_id}:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    get:
      operationId: getWebhookEndpoint
      tags:
      - admin
      summary: Read an endpoint.
      description: |
        An absent, deleted or foreign endpoint returns 404 not_found. Signing secrets are omitted.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      responses:
        '200':
          description: Current endpoint configuration.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
              example:
                id: 881e85ab-1007-46bf-8fed-75bd85a2033c
                url: https://hooks.acme.com/omni
                events:
                - message.delivered
                enabled: true
                created_at: '2026-11-23T18:04:05.000000Z'
                updated_at: '2026-11-23T18:04:05.000000Z'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateWebhookEndpoint
      tags:
      - admin
      summary: Change an endpoint's URL, subscriptions or enabled state.
      description: |
        Requires at least one field. A malformed or unknown field returns 400 invalid_request.
        An absent or foreign endpoint returns 404 not_found. Subscription changes affect future
        events. Changing the destination or disabling the endpoint fences pending delivery attempts.

        Required permission: `webhooks:manage`. Accepted credentials: a signed-in administrator, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdate'
