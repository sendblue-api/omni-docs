                created_at: '2026-01-10T00:00:00Z'
                updated_at: '2026-01-10T00:00:00Z'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `contacts:read`. Accepted credentials: a signed-in person, an API key, the account token.
    patch:
      operationId: updateContact
      tags:
      - contacts
      summary: Change contact profile fields or replace the labels on a contact.
      description: |
        If the owner cannot confirm completion, read the contact and compare the requested fields or labels before issuing another change.

        Required permission: `contacts:write`. Accepted credentials: a signed-in person, an API key, the account token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyContactUpdate'
            example:
