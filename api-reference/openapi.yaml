          $ref: '#/components/schemas/HttpMethod'
        status_callback:
          type:
          - string
          - 'null'
          format: uri
        status_callback_method:
          $ref: '#/components/schemas/HttpMethod'
        campaign_id:
          type:
          - string
          - 'null'
    NumberList:
      type: object
      required:
      - data
      - next_cursor
