      - webhooks:manage
      - webhooks:receive
      - whatsapp:connect
      - whatsapp:manage
      - whatsapp:read
      - whatsapp:send
      - workflows:read
      - workflows:write
    Permissions:
      type: array
      uniqueItems: true
      description: Effective permission names in lexical order. Grants are immutable after issuance.
      items:
        $ref: '#/components/schemas/Permission'
    KeyRole:
      type: string
      enum:
      - standard
      - read_only
      - messaging
      - billing_read
      description: |
        `standard` preserves the historical Standard key grants.
        `read_only` grants the read operations in the Standard bundle.
        `messaging` grants me:read, messages:read and messages:send.
        `billing_read` grants me:read and billing:read (balance).
    Key:
      type: object
      required:
      - id
      - name
      - role
      - permissions
      - expires_at
      - last_used_at
      - created_by
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          $ref: '#/components/schemas/Permissions'
        role:
          description: The named preset when issued without narrowing, or null for a custom scope.
          anyOf:
          - $ref: '#/components/schemas/KeyRole'
          - type: 'null'
        created_by:
          type:
          - string
          - 'null'
          description: Creator's credential or user identifier, null when never recorded.
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    KeyWithSecret:
      type: object
      required:
      - id
      - name
      - role
      - permissions
      - expires_at
      - last_used_at
      - created_by
      - created_at
      - updated_at
      - secret
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          $ref: '#/components/schemas/Permissions'
        role:
          description: The named preset when issued without narrowing, or null for a custom scope.
          anyOf:
          - $ref: '#/components/schemas/KeyRole'
          - type: 'null'
        created_by:
          type:
          - string
          - 'null'
          description: Creator's credential or user identifier, null when never recorded.
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        secret:
          type: string
          description: The key's secret. Shown once.
    KeyCreate:
      type: object
      additionalProperties: false
      description: |
        Omitting both role and permissions requests a Standard key. With a
        role and an explicit list, every listed permission must belong to the
        role. Only the explicit permissions are granted. A key with explicit
        grants uses the native API only, except when both the standard role
        and its exact unchanged permission set were requested.
        accounts:create, subaccounts:manage, team:manage, team:read and
        webhooks:receive cannot be delegated to a key.
      properties:
        name:
          type: string
          maxLength: 64
        role:
          $ref: '#/components/schemas/KeyRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        expires_at:
          type: string
          format: date-time
          description: Future RFC 3339 timestamp bounded by the issuing key's expiry.
    KeyUpdate:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
    KeyList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Key'
        next_cursor:
          type:
          - string
          - 'null'
    ResourceRef:
      type: object
      required:
      - type
      - id
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - message
          - number
          - call
          - recording
          - brand
          - campaign
          - top_up
          - group
          - whatsapp_connection
        id:
          type: string
    DeviceCommandStatus:
      type: string
      description: |
        `queued`: stored, not yet handed to the line's device.
        `sent_unconfirmed`: handed to the device. The device's client never
        answers this kind of command, so this is the last status and it does
        not say the device acted. `expired`: the device did not take it in
        time; nothing was sent. `failed`: it could not be handed over;
        `failure_reason` says why.
      enum:
      - queued
      - sent_unconfirmed
      - expired
      - failed
    ReadReceiptCreate:
      type: object
      required:
      - from
      - to
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/PhoneNumber'
        to:
          $ref: '#/components/schemas/PhoneNumber'
    ReadReceipt:
      type: object
      required:
