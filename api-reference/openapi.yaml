      - calls:write
      - campaigns:read
      - campaigns:write
      - company_settings:read
      - contacts:read
      - contacts:write
      - keys:manage
      - me:read
      - media:read
      - media:write
      - messages:read
      - messages:send
      - messages:write
      - number_orders:cancel
      - number_orders:create
      - number_orders:read
      - numbers:purchase
      - numbers:read
      - numbers:release
      - numbers:write
      - operations:read
      - prices:read
      - recordings:read
      - recordings:write
      - settings:read
      - settings:write
      - subaccounts:manage
      - tags:read
      - tags:write
      - team:manage
