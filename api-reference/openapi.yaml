                      call_status: in-progress
                  response:
                    status: 200
                    content_type: text/xml
                    body: <Response><Say>Hello</Say></Response>
                    duration_ms: 112
                  created_at: '2026-11-24T18:04:05.123456Z'
                next_cursor: null
