          - string
          - 'null'
          maxLength: 100
        last_name:
          type:
          - string
          - 'null'
          maxLength: 100
        email:
          type:
          - string
          - 'null'
          format: email
        tag_ids:
          type: array
          items:
            type: string
        variables:
          type: object
          description: Variable values by variable key.
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
