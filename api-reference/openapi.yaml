        base_estimate_per_part:
          $ref: '#/components/schemas/Price'
        base_ceiling_per_part:
          $ref: '#/components/schemas/Price'
        surcharge_policy:
          type: string
          enum:
          - none
          - at_cost
          - multiplier
        surcharge_multiplier_bps:
          type:
          - integer
          - 'null'
        surcharge_ceiling_per_part:
          $ref: '#/components/schemas/Price'
        billability_policy:
          type: string
          enum:
          - handoff
          - upstream_charge
        receipt_wait_seconds:
          type: integer
          minimum: 1
        parts:
          type: integer
          minimum: 1
          maximum: 1600
        estimated_base:
          $ref: '#/components/schemas/Price'
        maximum_hold:
          $ref: '#/components/schemas/Price'
    NullableUsagePrice:
      oneOf:
      - $ref: '#/components/schemas/Price'
