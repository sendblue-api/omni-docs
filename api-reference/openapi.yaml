    CallbackDeadLetter:
      type: object
      description: A status callback or inbound webhook that ended without being delivered.
      required:
      - id
      - message_id
      - event
      - attempts
      - response_status
      - failure_reason
      - replayable
      - failed_at
      - replayed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The callback ID, sent to the receiver as I-Twilio-Idempotency-Token.
        message_id:
          type: string
        event:
          type: string
          enum:
          - queued
          - sent
          - delivered
          - undelivered
          - failed
          - canceled
          - received
          description: The message status the callback reports; `received` is the webhook of an inbound
            message.
        attempts:
          type: integer
          minimum: 0
        response_status:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 599
        failure_reason:
          type:
          - string
          - 'null'
          enum:
          - attempts_exhausted
          - endpoint_unhealthy
          - worker_lost
          - null
          description: |
            `attempts_exhausted`: every attempt failed. `endpoint_unhealthy`: the destination was unhealthy,
            so the callback was not attempted. `worker_lost`: the last attempt's outcome is unknown.
        replayable:
          type: boolean
          description: |
            False when the stored form was erased with its message, the last attempt's outcome is
            unknown, or the callback belongs to a TwiML reply.
        failed_at:
          $ref: '#/components/schemas/Timestamp'
        replayed_at:
          $ref: '#/components/schemas/NullableTimestamp'
    CallbackDeadLetterList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CallbackDeadLetter'
        next_cursor:
          type:
          - string
          - 'null'
    WebhookEndpointHealth:
      type: object
      description: |
        Whether Sendblue is delivering to the endpoint. Every delivery attempt is recorded against it: any
        response that is not 2xx, a timeout, a connection failure or a name that does not resolve is a
        failure, and a 2xx clears the run. An endpoint becomes `unhealthy` after 30 consecutive failed
        attempts spread over at least ten minutes (`consecutive_failures`), or after twelve hours of
        failure with no success (`continuous_failure`). While it is unhealthy nothing is sent to it:
        its deliveries become dead letters with the reason `endpoint_unhealthy`, except one every ten
        minutes that is attempted as a probe (`next_probe_at`). A successful probe, or
        `POST /admin/webhooks/{webhook_id}/reenable`, makes it healthy again. Dead letters are not
        resent on recovery; replay them.
      required:
      - status
      - reason
      - unhealthy_at
      - consecutive_failures
      - failing_since
      - last_success_at
      - last_failure_at
      - next_probe_at
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - healthy
          - unhealthy
        reason:
          type:
          - string
          - 'null'
          enum:
          - consecutive_failures
          - continuous_failure
          - null
          description: Why the endpoint is unhealthy; null while it is healthy.
        unhealthy_at:
          $ref: '#/components/schemas/NullableTimestamp'
        consecutive_failures:
          type: integer
          minimum: 0
          description: Failed attempts since the last success.
        failing_since:
          $ref: '#/components/schemas/NullableTimestamp'
        last_success_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_failure_at:
          $ref: '#/components/schemas/NullableTimestamp'
        next_probe_at:
          $ref: '#/components/schemas/NullableTimestamp'
    EndpointUnhealthy:
      type: object
      description: The data of an endpoint.unhealthy event.
      required:
      - id
      - kind
      - url
      - reason
      - consecutive_failures
      - failing_since
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The webhook endpoint ID, or the ID of the callback destination.
        kind:
          type: string
          enum:
          - webhook
          - callback
          description: A registered webhook endpoint, or the destination of status callbacks.
        url:
          type: string
          description: The webhook endpoint's URL, or the callback destination's origin (scheme, host
            and port).
        reason:
          type: string
          enum:
          - consecutive_failures
          - continuous_failure
        consecutive_failures:
          type: integer
          minimum: 1
        failing_since:
          $ref: '#/components/schemas/Timestamp'
    WebhookDeadLetter:
      type: object
      description: A delivery that ended without being delivered.
      required:
      - id
      - event_id
      - event_type
      - attempts
      - response_status
      - failure_reason
      - replayable
      - created_at
      - replayed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          pattern: ^EV[0-9a-f]{32}$
        event_type:
          $ref: '#/components/schemas/EventType'
        attempts:
          type: integer
          minimum: 0
          maximum: 6
        response_status:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 599
        failure_reason:
          type:
          - string
          - 'null'
          enum:
          - attempts_exhausted
          - endpoint_unhealthy
          - endpoint_changed
          - not_retryable
          - event_expired
          - account_unauthorized
          - null
          description: |
            `attempts_exhausted`: six attempts failed. `endpoint_unhealthy`: the endpoint was unhealthy, so
            the delivery was not attempted. `endpoint_changed`: the endpoint's URL, enabled flag or secret
            changed, or it was deleted, while the delivery was pending. `not_retryable`: the endpoint
            answered with a status that is not retried. `event_expired`: the event's body was no longer
            retained. `account_unauthorized`: the account was not active. Null on a delivery that failed
            before reasons were recorded.
        replayable:
          type: boolean
          description: Whether the event's body is still retained, so the delivery can be replayed.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        replayed_at:
          $ref: '#/components/schemas/NullableTimestamp'
    WebhookDeadLetterList:
      type: object
      required:
      - data
      - next_cursor
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeadLetter'
        next_cursor:
          type:
          - string
          - 'null'
    WebhookDeadLetterReplayRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
    WebhookDeadLetterReplay:
      type: object
      required:
      - replayed
      - more
      additionalProperties: false
      properties:
        replayed:
          type: integer
          minimum: 0
          maximum: 200
          description: Dead letters queued again by this request.
        more:
          type: boolean
          description: True when this request queued its maximum; send it again for the rest.
    WebhookEndpoint:
      type: object
      required:
      - id
      - url
      - events
      - enabled
      - health
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
        events:
          type: array
          minItems: 1
          maxItems: 26
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventType'
        enabled:
          type: boolean
        health:
          $ref: '#/components/schemas/WebhookEndpointHealth'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookEndpointWithSecret:
      type: object
      required:
      - id
      - url
      - events
      - enabled
      - health
      - created_at
      - updated_at
      - secret
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
        events:
          type: array
          minItems: 1
          maxItems: 26
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventType'
        enabled:
          type: boolean
        health:
          $ref: '#/components/schemas/WebhookEndpointHealth'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        secret:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Use the displayed text as the HMAC key. Returned only on the first successful create
            or rotation.
    WebhookEndpointCreate:
      type: object
      required:
      - url
      - events
