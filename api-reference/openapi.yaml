          description: The link. `url` is null.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappSignupLink'
        default:
          $ref: '#/components/responses/Error'
      description: |
        Required permission: `whatsapp:connect`. Accepted credentials: a signed-in administrator, an API key, the account token.
  /whatsapp/connections:
    get:
      operationId: listWhatsappConnections
      tags:
      - whatsapp
      summary: List the account's WhatsApp connections.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
