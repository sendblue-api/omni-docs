  /messages:
    post:
      operationId: createMessage
      tags:
      - messages
      summary: Send a message.
      description: |
        Name the sender with `from`, or let a campaign choose one of its numbers
        with `campaign_id`. A scheduled message (`send_at`) needs `campaign_id`.
        The price is held from the balance at acceptance. An account with no
        price for the kind of message (see `GET /prices`) is refused with
        `422 unprocessable` and `details.reason` `price_unavailable`; nothing
        is held and retrying does not help.

        A body may be as long as the sender's route carries: 18,996 characters
        on an iMessage line that sends iMessage only, 1,600 characters on every
        other sender. See `body`.

        With `group_id` in place of `to` the message goes to a group chat. It
        is priced, held and charged as one message of the Group's line (a
        group iMessage is one iMessage, whatever the number of participants),
        and the Message shows `group_id` with `to: null`. A Group that is not
        `active` answers `409 conflict` (`details.reason: group_not_active`),
        and so does a Group whose line was enrolled again since the Group was
        made (`details.reason: group_line_changed`). A message to one person
        and a message to a group cannot share an `Idempotency-Key`: the later
        request answers `409 idempotency_conflict`. When a request under the
        same key removes the link while this one is being admitted, the answer
        is `503` and nothing is admitted or charged; send it again.
        If the device reports that it no longer has the chat, the message
        fails and the Group becomes `unknown`. `delivered` is reported for
        the chat as a whole, not for each participant.

        A campaign keeps one of its numbers for each recipient. The first
        message a campaign chooses a sender for binds that number to the
        recipient, and later messages with only `campaign_id` use it for as
        long as the number is still eligible to send for the campaign. A
        number that is not (released, moved to another campaign, disabled, at
        its daily limit, or blocked for that recipient) is skipped: the
        campaign rotates to its next eligible number and binds that one. A
        message the recipient sends to one of the campaign's numbers binds
        them to it, so the reply leaves from the number they texted. A `from`
        on the request always wins and changes no binding. A repeated
        `Idempotency-Key` returns the original message and sender. Bindings
        belong to the account's campaign and lapse after one year without a
        message.

        **Inline reply.** `reply_to` sends the message as a reply to one
        message of the same conversation on an iMessage line: a message the
        account received on that line from `to`, or one it sent from that line
        to `to`. The reply leaves from the line the target is on, so `from`
        may be omitted; `campaign_id` and `send_at` cannot be combined with
        it. It is priced and reported exactly as any other message from that
        line. The target is checked before anything is accepted, and a
        refusal is `422 unprocessable` naming the member in `details.field`
        with `details.reason`:

        | Reason | Meaning |
        | --- | --- |
        | `reply_target_not_found` | `reply_to.message_id` is not a message of this account on an iMessage line. |
        | `reply_target_other_conversation` | `to` is not the other party of the target, or `from` is not the line it is on. |
        | `reply_target_not_sent` | The target was sent by this account and the device has not reported it sent, or it was never sent. |
        | `reply_target_not_imessage` | The target went or came as SMS. Only an iMessage can be replied to inline. |
        | `reply_target_unavailable` | The target was received before Sendblue kept the identifier a device needs to find it. Such a message can never be replied to. |

        A reply is never sent as an ordinary message. The device itself
        confirms the target when it sends: if it no longer holds the target,
        or the conversation is no longer iMessage, it sends nothing and the
        message ends `failed`. A repeated `Idempotency-Key` with another
        target is `409`.

        `send_style` sends a text with an iMessage effect. It is accepted only
        where the message goes out as an iMessage or not at all, because SMS
        and RCS cannot carry an effect and the text would arrive without it.
        `from` must be an iMessage line. On a line that sends iMessage only
        the message is sent as any other. On a line that may fall back to SMS
        and whose device can check the recipient, the message is accepted as
        iMessage or fail: the device is first asked whether `to` is on
        iMessage, and the message is then sent as an iMessage, or it ends
        `failed` with `failure.code` `recipient_not_on_imessage` (or
        `imessage_availability_unknown` when the device could not tell
        within about twenty seconds), nothing sent and nothing charged. It is
        never sent or charged as SMS. A body longer than an SMS may be is
        accepted on such a line in the same way. Anywhere else the request
        is refused and nothing is sent or held. A carrier number or a
        `campaign_id` is `422 unprocessable` with `details.field`
        `send_style` and `details.reason` `send_style_requires_imessage`. An
        iMessage line that may fall back to SMS and whose device cannot check
        the recipient is the same with
        `send_style_requires_imessage_only`. A name outside the list, or an
        effect with attachments, is `400 invalid_request` naming `send_style`.
        An effect costs nothing: the message is priced as the same message
        without it. The same `Idempotency-Key` with a different `send_style`
        is a different request.

        Required permission: `messages:send`. Accepted credentials: a signed-in person, an API key, the account token.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
