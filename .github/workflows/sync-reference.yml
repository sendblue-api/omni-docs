name: Sync API reference

# Rebuilds api-reference/openapi.yaml from the contract on Omni main and opens a
# pull request when it changed. Needs the secret OMNI_READ_TOKEN: a fine-grained
# token with read-only "Contents" access to sendblue-api/omni.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sendblue-api/omni
          ref: main
          token: ${{ secrets.OMNI_READ_TOKEN }}
          path: .omni
          sparse-checkout: contracts/native
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: build
        run: |
          python3 scripts/build_reference.py --omni-repo .omni --ref HEAD
          echo "sha=$(git -C .omni rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf .omni
      - name: Open a pull request when the reference changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- api-reference/openapi.yaml; then
            echo "reference is up to date"; exit 0
          fi
          branch="sync/reference"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add api-reference/openapi.yaml
          git commit -m "Sync API reference with Omni ${{ steps.build.outputs.sha }}"
          git push --force origin "$branch"
          gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN || \
            gh pr create --head "$branch" --base main \
              --title "Sync API reference with the Omni contract" \
              --body "Regenerated by scripts/build_reference.py from contracts/native/openapi.yaml on Omni main. Only operations marked live are included."
